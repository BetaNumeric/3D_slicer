            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 7. Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 1.2);
            dl.position.set(5, 10, 7);
            dl.castShadow = true;
            scene.add(dl);
            const rimLight = new THREE.DirectionalLight(0x4444ff, 0.5);
            rimLight.position.set(-5, 5, -5);
            scene.add(rimLight);

            // 8. Clipping Plane
            clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

            // 9. Initialize Groups
            visualGroup = new THREE.Group();
            stencilGroup = new THREE.Group();
            capGroup = new THREE.Group();
            pointGroup = new THREE.Group();
            gaussianGroup = new THREE.Group();
            pointGroup.visible = false;
            gaussianGroup.visible = false;
            
            visualGroup.renderOrder = 0;
            stencilGroup.renderOrder = 1;
            capGroup.renderOrder = 2;
            pointGroup.renderOrder = 3;
            gaussianGroup.renderOrder = 4;

            scene.add(visualGroup);
            scene.add(stencilGroup); 
            scene.add(capGroup);
            scene.add(pointGroup);
            scene.add(gaussianGroup);

            // 10. Helper
            const frameGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)); 
            const frameMat = new THREE.LineBasicMaterial({ color: 0xff0000, depthTest: false, depthWrite: false });
            frameHelper = new THREE.LineSegments(frameGeo, frameMat);
            frameHelper.visible = false; 
            scene.add(frameHelper);
            createCropBoxHelper();

            // 11. Materials
            const stencilConfig = {
                depthWrite: false,
                depthTest: false,
                colorWrite: false,
                stencilWrite: true,
                stencilFunc: THREE.AlwaysStencilFunc,
                clippingPlanes: [clippingPlane],
                blending: THREE.NoBlending,
                fog: false
            };

            backMat = new THREE.MeshBasicMaterial({ 
                ...stencilConfig, 
                side: THREE.BackSide,
                stencilFail: THREE.IncrementWrapStencilOp,
                stencilZFail: THREE.IncrementWrapStencilOp,
                stencilZPass: THREE.IncrementWrapStencilOp
            });

            frontMat = new THREE.MeshBasicMaterial({ 
                ...stencilConfig,
                side: THREE.FrontSide,
                stencilFail: THREE.DecrementWrapStencilOp,
                stencilZFail: THREE.DecrementWrapStencilOp,
                stencilZPass: THREE.DecrementWrapStencilOp
            });

            capMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                stencilWrite: true,
                stencilRef: 0,
                stencilFunc: THREE.NotEqualStencilFunc, 
                stencilFail: THREE.KeepStencilOp,
                stencilZFail: THREE.KeepStencilOp,
                stencilZPass: THREE.KeepStencilOp,
                side: THREE.DoubleSide
            });

            const planeGeom = new THREE.PlaneGeometry(100, 100);
            capMesh = new THREE.Mesh(planeGeom, capMaterial);
            capMesh.renderOrder = 2; 
            capMesh.castShadow = false;
            capMesh.receiveShadow = true;
            capGroup.add(capMesh);
            configureSliceGeometry();

            // Load
            loadModel(DEFAULT_MODEL);

            // Events
            window.addEventListener('resize', onWindowResize);
            setupUI();
            
            // Start Loop
            renderer.setAnimationLoop(renderFrame);
        }

        // --- CORE RENDER FUNCTION ---
        function renderFrame() {
            if(isProcessingVideo) return; 

            // Update Point Uniforms every frame for camera switch
            const isOrtho = (activeCamera.isOrthographicCamera) ? 1.0 : 0.0;
            // Use active camera zoom to scale points in ortho mode
            const orthoZoom = activeCamera.zoom;
            
            pointMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = isOrtho;
                m.uniforms.uOrthoZoom.value = orthoZoom;
            });
            gaussianMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = isOrtho;
                m.uniforms.uOrthoZoom.value = orthoZoom;
                m.uniforms.uViewport.value.set(renderer.domElement.width, renderer.domElement.height);
            });

            if (isAnimate) {
                time += 0.01 * scanSpeed;
                const t = (time % 2);
                const alpha = t < 1 ? t : 2 - t; 
                const yPos = THREE.MathUtils.lerp(modelBounds.min, modelBounds.max, alpha);
                updatePlaneHeight(yPos);
            }
            
            if(frameHelper.visible) {
                setObjectSlicePosition(frameHelper, finiteNumber(document.getElementById('slice-slider').value, getAxisComponent(frameHelper.position)));
            }

            controls.update();
            setSliceWindowUniforms(false);
            
            if (renderStyle === 'points' || renderStyle === 'gaussian') {
                if (renderStyle === 'gaussian') updateGaussianDepthSorting(false);
                renderer.render(scene, activeCamera);
            } else {
                performMultiPassRender();
            }
        }

        function performMultiPassRender() {
            const currentBg = scene.background;
            const visVisible = visualGroup.visible;
            
            scene.background = null; 
            visualGroup.visible = false; 
            stencilGroup.visible = true; 
            capGroup.visible = true;     
            frameHelper.visible = false; 
            pointGroup.visible = false; 
            gaussianGroup.visible = false;

            renderer.setRenderTarget(renderTarget);
            renderer.clear();
            renderer.render(scene, activeCamera);
            
            renderer.setRenderTarget(null);
            scene.background = currentBg;
            visualGroup.visible = visVisible; 
            stencilGroup.visible = false; 
            capGroup.visible = false;     
            frameHelper.visible = document.getElementById('show-frame').checked && !isProcessingVideo;

            renderer.clear();
            if(visVisible) {
                renderer.render(scene, activeCamera);
            }

            postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
            postMaterial.uniforms.uIsOutline.value = outlineMode ? 1 : 0;
            
            renderer.autoClear = false;
            renderer.render(postScene, postCamera);
            renderer.autoClear = true;
            
            if(frameHelper.visible) {
                if(!visVisible) {
                    visualGroup.visible = false;
                    stencilGroup.visible = false;
                    capGroup.visible = false;
                    scene.background = null; 
                    renderer.autoClear = false;
                    renderer.render(scene, activeCamera);
                    renderer.autoClear = true;
                    scene.background = currentBg;
                }
            }
            
            visualGroup.visible = visVisible;
            stencilGroup.visible = true; 
            capGroup.visible = true;
        }

        // --- CUSTOM POINT SHADER ---
        const createPointMaterial = (texture, color, hasVertexColors = false, hasUv = false) => {
            const useTexture = !!texture && hasUv;
            return new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: texture || null },
                    size: { value: pointSize },
                    diffuse: { value: new THREE.Color(color) },
                    uIsOrtho: { value: 0.0 },
                    uOrthoZoom: { value: 1.0 },
                    uUseSliceWindow: { value: 0.0 },
                    uSliceAxis: { value: new THREE.Vector3(0, 1, 0) },
                    uSliceMin: { value: -1e20 },
                    uSliceMax: { value: 1e20 }
                },
                vertexShader: `
                    ${hasVertexColors ? 'attribute vec3 color;' : ''}
                    uniform float size;
                    uniform float uIsOrtho;
                    uniform float uOrthoZoom;
                    uniform vec3 uSliceAxis;
                    ${useTexture ? 'varying vec2 vUv;' : ''}
                    ${hasVertexColors ? 'varying vec3 vColor;' : ''}
                    varying float vSliceCoord;
                    #include <clipping_planes_pars_vertex>
                    void main() {
                        ${useTexture ? 'vUv = uv;' : ''}
                        ${hasVertexColors ? 'vColor = color;' : ''}
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vSliceCoord = dot(worldPosition.xyz, uSliceAxis);
                        vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                        
                        if (uIsOrtho > 0.5) {
                            // Ortho Size: Fixed pixel size * zoom factor (approx 60x scalar)
                            gl_PointSize = size * 60.0 * uOrthoZoom;
                        } else {
                            // Perspective Size: Attenuate by depth
                            gl_PointSize = size * ( 50.0 / -mvPosition.z );
                        }
                        
                        gl_Position = projectionMatrix * mvPosition;
                        #include <clipping_planes_vertex>
                    }
                `,
                fragmentShader: `
                    ${useTexture ? 'uniform sampler2D map;' : ''}
                    uniform vec3 diffuse;
                    uniform float uUseSliceWindow;
                    uniform float uSliceMin;
                    uniform float uSliceMax;
                    ${useTexture ? 'varying vec2 vUv;' : ''}
                    ${hasVertexColors ? 'varying vec3 vColor;' : ''}
                    varying float vSliceCoord;
                    #include <clipping_planes_pars_fragment>
                    void main() {
                        #include <clipping_planes_fragment>
                        if (uUseSliceWindow > 0.5 && (vSliceCoord < uSliceMin || vSliceCoord >= uSliceMax)) discard;
                        
                        vec4 color = vec4(diffuse, 1.0);
                        ${hasVertexColors ? 'color *= vec4(vColor, 1.0);' : ''}
                        ${useTexture ? 'color *= texture2D(map, vUv);' : ''}
                        
                        // Round Point
                        vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                        if (dot(cxy, cxy) > 1.0) discard;

                        gl_FragColor = color;
                    }
                `,
                clipping: true,
                transparent: false,
                clippingPlanes: getPointClippingPlanes(!showFullPointCloud)
            });
        };

        const createGaussianSplatMaterial = () => {
            return new THREE.ShaderMaterial({
                uniforms: {
                    size: { value: pointSize },
                    uIsOrtho: { value: 0.0 },
                    uOrthoZoom: { value: 1.0 },
                    uViewport: { value: new THREE.Vector2(1, 1) },
                    uUseSliceWindow: { value: 0.0 },
                    uSliceAxis: { value: new THREE.Vector3(0, 1, 0) },
                    uSliceMin: { value: -1e20 },
                    uSliceMax: { value: 1e20 }
                },
                vertexShader: `
                    attribute vec2 quadPosition;
                    attribute vec3 instancePosition;
                    attribute vec3 instanceColor;
                    attribute float instanceOpacity;
                    attribute vec3 instanceScale;
                    attribute vec4 instanceRotation;
                    uniform float size;
                    uniform float uIsOrtho;
                    uniform float uOrthoZoom;
                    uniform vec2 uViewport;
                    uniform vec3 uSliceAxis;
                    varying vec3 vColor;
                    varying float vOpacity;
                    varying vec2 vGaussian;
                    varying float vSliceCoord;
                    #include <clipping_planes_pars_vertex>

                    mat3 quatToMat3(vec4 q) {
                        q = normalize(q);
                        float x = q.x, y = q.y, z = q.z, w = q.w;
                        float x2 = x + x, y2 = y + y, z2 = z + z;
                        float xx = x * x2, xy = x * y2, xz = x * z2;
                        float yy = y * y2, yz = y * z2, zz = z * z2;
                        float wx = w * x2, wy = w * y2, wz = w * z2;
                        return mat3(
                            1.0 - (yy + zz), xy + wz, xz - wy,
                            xy - wz, 1.0 - (xx + zz), yz + wx,
                            xz + wy, yz - wx, 1.0 - (xx + yy)
                        );
                    }

                    mat3 modelViewRotation() {
                        return mat3(
                            normalize(modelViewMatrix[0].xyz),
                            normalize(modelViewMatrix[1].xyz),
                            normalize(modelViewMatrix[2].xyz)
                        );
                    }

                    mat3 outerProduct3(vec3 a, vec3 b) {
                        return mat3(
                            a.x * b.x, a.y * b.x, a.z * b.x,
                            a.x * b.y, a.y * b.y, a.z * b.y,
                            a.x * b.z, a.y * b.z, a.z * b.z
                        );
                    }

                    void main() {
                        vColor = instanceColor;
                        vOpacity = instanceOpacity;
                        vGaussian = quadPosition * 3.0;

                        vec4 worldPosition = modelMatrix * vec4(instancePosition, 1.0);
                        vSliceCoord = dot(worldPosition.xyz, uSliceAxis);
                        vec4 mvPosition = modelViewMatrix * vec4(instancePosition, 1.0);
                        float sizeScale = max(size / ${DEFAULT_POINT_SIZE.toFixed(3)}, 0.001);
                        vec3 scale = max(instanceScale * sizeScale, vec3(0.00001));
                        mat3 rotation = modelViewRotation() * quatToMat3(instanceRotation);
                        vec3 axisX = rotation[0] * scale.x;
                        vec3 axisY = rotation[1] * scale.y;
                        vec3 axisZ = rotation[2] * scale.z;
                        mat3 cov = outerProduct3(axisX, axisX) + outerProduct3(axisY, axisY) + outerProduct3(axisZ, axisZ);

                        float focalX = projectionMatrix[0][0] * uViewport.x * 0.5;
                        float focalY = projectionMatrix[1][1] * uViewport.y * 0.5;
                        float depth = max(-mvPosition.z, 0.001);
                        vec3 j0;
                        vec3 j1;
                        if (uIsOrtho > 0.5) {
                            j0 = vec3(focalX, 0.0, 0.0);
                            j1 = vec3(0.0, focalY, 0.0);
                        } else {
                            j0 = vec3(focalX / depth, 0.0, focalX * mvPosition.x / (depth * depth));
                            j1 = vec3(0.0, focalY / depth, focalY * mvPosition.y / (depth * depth));
                        }

                        float a = dot(j0, cov * j0) + 0.35;
                        float b = dot(j0, cov * j1);
                        float c = dot(j1, cov * j1) + 0.35;
                        float mid = 0.5 * (a + c);
                        float radius = length(vec2(0.5 * (a - c), b));
                        float lambda1 = clamp(mid + radius, 0.01, 65536.0);
                        float lambda2 = clamp(mid - radius, 0.01, 65536.0);
                        vec2 axis1 = abs(b) > 0.00001 || abs(lambda1 - a) > 0.00001
                            ? normalize(vec2(b, lambda1 - a))
                            : vec2(1.0, 0.0);
                        vec2 axis2 = vec2(-axis1.y, axis1.x);
                        vec2 pixelOffset = 3.0 * (
                            axis1 * quadPosition.x * sqrt(lambda1) +
                            axis2 * quadPosition.y * sqrt(lambda2)
                        );

                        vec4 clip = projectionMatrix * mvPosition;
                        clip.xy += (pixelOffset / uViewport) * 2.0 * clip.w;
                        gl_Position = clip;
                        #include <clipping_planes_vertex>
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vOpacity;
                    varying vec2 vGaussian;
                    varying float vSliceCoord;
                    uniform float uUseSliceWindow;
                    uniform float uSliceMin;
                    uniform float uSliceMax;
                    #include <clipping_planes_pars_fragment>
                    void main() {
                        #include <clipping_planes_fragment>
                        if (uUseSliceWindow > 0.5 && (vSliceCoord < uSliceMin || vSliceCoord >= uSliceMax)) discard;
                        float r2 = dot(vGaussian, vGaussian);
                        if (r2 > 9.0) discard;
                        float alpha = exp(-0.5 * r2) * vOpacity;
                        if (alpha < 0.003) discard;
                        gl_FragColor = vec4(vColor, alpha);
                    }
                `,
                clipping: true,
                clippingPlanes: getPointClippingPlanes(!showFullPointCloud),
                transparent: true,
                depthTest: true,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
        };
        
        // --- SAMPLER UTILS ---
        function createSamplingGeometry(mesh, count) {
            const geom = mesh.geometry;
            const posAttr = geom.attributes.position;
            if (!posAttr || count <= 0) return new THREE.BufferGeometry();

            const uvAttr = geom.attributes.uv;
            const colorAttr = geom.attributes.color;
            const indexAttr = geom.index;
            const faces = Math.floor((indexAttr ? indexAttr.count : posAttr.count) / 3);
            if (faces <= 0) return new THREE.BufferGeometry();
            
            const areas = new Float32Array(faces);
            let totalArea = 0;
            const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
            const ab = new THREE.Vector3(), ac = new THREE.Vector3();
            const vertexIndex = (offset) => indexAttr ? indexAttr.getX(offset) : offset;
            
            for(let i=0; i<faces; i++) {
                const i3 = i*3;
                const a = vertexIndex(i3);
                const b = vertexIndex(i3+1);
                const c = vertexIndex(i3+2);
                
                va.fromBufferAttribute(posAttr, a);
                vb.fromBufferAttribute(posAttr, b);
                vc.fromBufferAttribute(posAttr, c);
                
                ab.subVectors(vb, va);
                ac.subVectors(vc, va);
                const area = ab.cross(ac).length() * 0.5;
                areas[i] = area;
                totalArea += area;
            }

            if (totalArea <= 0) return new THREE.BufferGeometry();

            const finalPos = new Float32Array(count * 3);
            const finalUV = uvAttr ? new Float32Array(count * 2) : null;
            const finalColor = colorAttr ? new Float32Array(count * 3) : null;
            
            const cdf = new Float32Array(faces);
            let acc = 0;
            for(let i=0; i<faces; i++) {
                acc += areas[i];
                cdf[i] = acc;
            }
            
            for(let i=0; i<count; i++) {
                const r = Math.random() * totalArea;
                let start = 0, end = faces - 1;
                let faceIdx = -1;
                while(start <= end) {
                    const mid = (start + end) >> 1;
                    if(r < cdf[mid]) {
                        faceIdx = mid;
                        end = mid - 1;
                    } else {
                        start = mid + 1;
                    }
                }
                if(faceIdx === -1) faceIdx = faces - 1; 
                
                const r1 = Math.random();
                const r2 = Math.random();
                const sqrtR1 = Math.sqrt(r1);
                const u = 1 - sqrtR1;
                const v = sqrtR1 * (1 - r2);
                const w = sqrtR1 * r2;
                
                const i3 = faceIdx * 3;
                const ia = vertexIndex(i3);
                const ib = vertexIndex(i3+1);
                const ic = vertexIndex(i3+2);
                
                finalPos[i*3] = posAttr.getX(ia)*u + posAttr.getX(ib)*v + posAttr.getX(ic)*w;
                finalPos[i*3+1] = posAttr.getY(ia)*u + posAttr.getY(ib)*v + posAttr.getY(ic)*w;
                finalPos[i*3+2] = posAttr.getZ(ia)*u + posAttr.getZ(ib)*v + posAttr.getZ(ic)*w;
                
                if(uvAttr) {
                    finalUV[i*2] = uvAttr.getX(ia)*u + uvAttr.getX(ib)*v + uvAttr.getX(ic)*w;
                    finalUV[i*2+1] = uvAttr.getY(ia)*u + uvAttr.getY(ib)*v + uvAttr.getY(ic)*w;
                }

                if(colorAttr) {
                    finalColor[i*3] = colorAttr.getX(ia)*u + colorAttr.getX(ib)*v + colorAttr.getX(ic)*w;
                    finalColor[i*3+1] = colorAttr.getY(ia)*u + colorAttr.getY(ib)*v + colorAttr.getY(ic)*w;
                    finalColor[i*3+2] = colorAttr.getZ(ia)*u + colorAttr.getZ(ib)*v + colorAttr.getZ(ic)*w;
                }
            }
            
            const bufferGeo = new THREE.BufferGeometry();
            bufferGeo.setAttribute('position', new THREE.BufferAttribute(finalPos, 3));
            if(uvAttr) bufferGeo.setAttribute('uv', new THREE.BufferAttribute(finalUV, 2));
            if(colorAttr) bufferGeo.setAttribute('color', new THREE.BufferAttribute(finalColor, 3));
            
            return bufferGeo;
        }

        function createSplatGeometry(buffer) {
            const bytesPerSplat = 32;
            const count = Math.floor(buffer.byteLength / bytesPerSplat);
            if (count <= 0) return new THREE.BufferGeometry();

            const view = new DataView(buffer);
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const scales = new Float32Array(count * 3);
            const rotations = new Float32Array(count * 4);

            for (let i = 0; i < count; i++) {
                const offset = i * bytesPerSplat;
                positions[i * 3] = view.getFloat32(offset, true);
                positions[i * 3 + 1] = view.getFloat32(offset + 4, true);
                positions[i * 3 + 2] = view.getFloat32(offset + 8, true);

                const sx = Math.abs(view.getFloat32(offset + 12, true));
                const sy = Math.abs(view.getFloat32(offset + 16, true));
                const sz = Math.abs(view.getFloat32(offset + 20, true));
                scales[i * 3] = sx;
                scales[i * 3 + 1] = sy;
                scales[i * 3 + 2] = sz;
                sizes[i] = Math.max(sx, sy, sz, 0.0001);

                colors[i * 3] = view.getUint8(offset + 24) / 255;
                colors[i * 3 + 1] = view.getUint8(offset + 25) / 255;
                colors[i * 3 + 2] = view.getUint8(offset + 26) / 255;
                opacities[i] = view.getUint8(offset + 27) / 255;
                decodeByteQuaternion(view, offset + 28, rotations, i);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = true;
            return geometry;
        }

        function findPlyHeaderEnd(bytes) {
            const marker = [101, 110, 100, 95, 104, 101, 97, 100, 101, 114];
            for (let i = 0; i <= bytes.length - marker.length; i++) {
                let found = true;
                for (let j = 0; j < marker.length; j++) {
                    if (bytes[i + j] !== marker[j]) {
                        found = false;
                        break;
                    }
                }
                if (found) {
                    let end = i + marker.length;
                    if (bytes[end] === 13) end++;
                    if (bytes[end] === 10) end++;
                    return end;
                }
            }
            return -1;
        }

        function plyPropertyReader(type) {
            const readers = {
                char: { size: 1, read: (view, offset) => view.getInt8(offset) },
                int8: { size: 1, read: (view, offset) => view.getInt8(offset) },
                uchar: { size: 1, read: (view, offset) => view.getUint8(offset) },
                uint8: { size: 1, read: (view, offset) => view.getUint8(offset) },
                short: { size: 2, read: (view, offset, little) => view.getInt16(offset, little) },
                int16: { size: 2, read: (view, offset, little) => view.getInt16(offset, little) },
                ushort: { size: 2, read: (view, offset, little) => view.getUint16(offset, little) },
                uint16: { size: 2, read: (view, offset, little) => view.getUint16(offset, little) },
                int: { size: 4, read: (view, offset, little) => view.getInt32(offset, little) },
                int32: { size: 4, read: (view, offset, little) => view.getInt32(offset, little) },
                uint: { size: 4, read: (view, offset, little) => view.getUint32(offset, little) },
                uint32: { size: 4, read: (view, offset, little) => view.getUint32(offset, little) },
                float: { size: 4, read: (view, offset, little) => view.getFloat32(offset, little) },
                float32: { size: 4, read: (view, offset, little) => view.getFloat32(offset, little) },
                double: { size: 8, read: (view, offset, little) => view.getFloat64(offset, little) },
                float64: { size: 8, read: (view, offset, little) => view.getFloat64(offset, little) }
            };
            return readers[type.toLowerCase()] || null;
        }

        function parsePlyHeader(buffer) {
            const bytes = new Uint8Array(buffer);
            const headerEnd = findPlyHeaderEnd(bytes);
            if (headerEnd < 0) return null;

            const header = new TextDecoder().decode(bytes.subarray(0, headerEnd));
            const lines = header.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            let format = 'ascii';
            let vertexCount = 0;
            let inVertex = false;
            const vertexProperties = [];

            lines.forEach((line) => {
                const parts = line.split(/\s+/);
                if (parts[0] === 'format') format = parts[1];
                if (parts[0] === 'element') {
                    inVertex = parts[1] === 'vertex';
                    if (inVertex) vertexCount = finiteInteger(parts[2], 0);
                    return;
                }
                if (inVertex && parts[0] === 'property' && parts[1] !== 'list') {
                    vertexProperties.push({ type: parts[1], name: parts[2] });
                }
            });

            return { format, headerEnd, vertexCount, vertexProperties };
        }

        function createGaussianPlyGeometry(buffer) {
            const header = parsePlyHeader(buffer);
            if (!header || header.vertexCount <= 0) return null;

            const names = header.vertexProperties.map(prop => prop.name);
            const hasPosition = ['x', 'y', 'z'].every(name => names.includes(name));
            const hasFdcColor = ['f_dc_0', 'f_dc_1', 'f_dc_2'].every(name => names.includes(name));
            const hasRgbColor = ['red', 'green', 'blue'].every(name => names.includes(name));
            const hasScale = ['scale_0', 'scale_1', 'scale_2'].every(name => names.includes(name));
            const hasRotation = ['rot_0', 'rot_1', 'rot_2', 'rot_3'].every(name => names.includes(name));
            const hasGaussianProps = hasFdcColor || names.includes('opacity') || names.includes('scale_0') || names.includes('rot_0');
            if (!hasPosition || (!hasGaussianProps && !hasRgbColor)) return null;

            const positions = new Float32Array(header.vertexCount * 3);
            const colors = new Float32Array(header.vertexCount * 3);
            const sizes = new Float32Array(header.vertexCount);
            const opacities = new Float32Array(header.vertexCount);
            const scales = new Float32Array(header.vertexCount * 3);
            const rotations = new Float32Array(header.vertexCount * 4);
            const propIndex = (name) => names.indexOf(name);
            const xIndex = propIndex('x');
            const yIndex = propIndex('y');
            const zIndex = propIndex('z');
            const s0Index = propIndex('scale_0');
            const s1Index = propIndex('scale_1');
            const s2Index = propIndex('scale_2');
            const r0Index = propIndex('rot_0');
            const r1Index = propIndex('rot_1');
            const r2Index = propIndex('rot_2');
            const r3Index = propIndex('rot_3');
            const f0Index = propIndex('f_dc_0');
            const f1Index = propIndex('f_dc_1');
            const f2Index = propIndex('f_dc_2');
            const redIndex = propIndex('red');
            const greenIndex = propIndex('green');
            const blueIndex = propIndex('blue');
            const opacityIndex = propIndex('opacity');
            const shC0 = 0.28209479177387814;

            const writeVertex = (i, values) => {
                positions[i * 3] = values[xIndex];
                positions[i * 3 + 1] = values[yIndex];
                positions[i * 3 + 2] = values[zIndex];

                const opacity = opacityIndex >= 0 ? sigmoid(values[opacityIndex]) : 1;
                opacities[i] = opacity;
                if (hasScale) {
                    const sx = Math.exp(values[s0Index]);
                    const sy = Math.exp(values[s1Index]);
                    const sz = Math.exp(values[s2Index]);
                    scales[i * 3] = sx;
                    scales[i * 3 + 1] = sy;
                    scales[i * 3 + 2] = sz;
                    sizes[i] = Math.max(sx, sy, sz, 0.0001);
                } else {
                    scales[i * 3] = 0.01;
                    scales[i * 3 + 1] = 0.01;
                    scales[i * 3 + 2] = 0.01;
                    sizes[i] = 0.01;
                }

                if (hasRotation) {
                    writeNormalizedQuaternion(rotations, i, values[r1Index], values[r2Index], values[r3Index], values[r0Index]);
                } else {
                    writeNormalizedQuaternion(rotations, i, 0, 0, 0, 1);
                }

                if (hasFdcColor) {
                    colors[i * 3] = clamp(0.5 + shC0 * values[f0Index], 0, 1);
                    colors[i * 3 + 1] = clamp(0.5 + shC0 * values[f1Index], 0, 1);
                    colors[i * 3 + 2] = clamp(0.5 + shC0 * values[f2Index], 0, 1);
                } else {
                    colors[i * 3] = clamp(values[redIndex] / 255, 0, 1);
                    colors[i * 3 + 1] = clamp(values[greenIndex] / 255, 0, 1);
                    colors[i * 3 + 2] = clamp(values[blueIndex] / 255, 0, 1);
                }
            };

            if (header.format === 'ascii') {
                const body = new TextDecoder().decode(new Uint8Array(buffer, header.headerEnd));
                const rows = body.split(/\r?\n/).filter(Boolean);
                for (let i = 0; i < header.vertexCount && i < rows.length; i++) {
                    writeVertex(i, rows[i].trim().split(/\s+/).map(Number));
                }
            } else if (header.format === 'binary_little_endian' || header.format === 'binary_big_endian') {
                const little = header.format === 'binary_little_endian';
                const propReaders = header.vertexProperties.map(prop => plyPropertyReader(prop.type));
                if (propReaders.some(reader => !reader)) return null;

                const stride = propReaders.reduce((sum, reader) => sum + reader.size, 0);
                const view = new DataView(buffer, header.headerEnd);
                const values = new Array(propReaders.length);
                for (let i = 0; i < header.vertexCount; i++) {
                    let offset = i * stride;
                    for (let j = 0; j < propReaders.length; j++) {
                        const reader = propReaders[j];
                        values[j] = reader.read(view, offset, little);
                        offset += reader.size;
                    }
                    writeVertex(i, values);
                }
            } else {
                return null;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = hasGaussianProps;
            return geometry;
        }

        function normalizeZipPath(path) {
            return String(path || '').replace(/\\/g, '/').replace(/^\/+/, '');
        }

        function findSogMetaFile(zip) {
            const rootMeta = zip.file('meta.json');
            if (rootMeta) return { file: rootMeta, basePath: '' };

            const metaPath = Object.keys(zip.files).find(name => {
                const entry = zip.files[name];
                return !entry.dir && normalizeZipPath(name).toLowerCase().endsWith('/meta.json');
            });
            if (!metaPath) throw new Error('SOG archive is missing meta.json.');

            return {
                file: zip.files[metaPath],
                basePath: normalizeZipPath(metaPath).replace(/\/?meta\.json$/i, '')
            };
        }

        function findSogZipFile(zip, basePath, fileName) {
            const relativePath = normalizeZipPath(fileName);
            const candidates = [
                normalizeZipPath(basePath ? `${basePath}/${relativePath}` : relativePath),
                relativePath
            ].filter(Boolean);

            for (const candidate of candidates) {
                const file = zip.file(candidate);
                if (file) return { file, name: candidate };
            }

            const lowerPath = relativePath.toLowerCase();
            const match = Object.keys(zip.files).find(name => {
                const entry = zip.files[name];
                const normalized = normalizeZipPath(name).toLowerCase();
                return !entry.dir && (normalized === lowerPath || normalized.endsWith(`/${lowerPath}`));
            });
            if (match) return { file: zip.files[match], name: match };

            throw new Error(`SOG archive is missing ${fileName}.`);
        }

        function guessImageMimeType(fileName) {
            const extension = getImportExtension('', fileName);
            if (extension === 'png') return 'image/png';
            if (extension === 'jpg' || extension === 'jpeg') return 'image/jpeg';
            return 'image/webp';
        }

        async function loadImageElement(blob) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const url = URL.createObjectURL(blob);
                image.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(image);
                };
                image.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Could not decode SOG image.'));
                };
                image.src = url;
            });
        }

        async function decodeImageData(blob) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) throw new Error('Could not create SOG image decoder.');

            let bitmap = null;
            let source = null;
            try {
                if (window.createImageBitmap) {
                    try {
                        bitmap = await createImageBitmap(blob, { colorSpaceConversion: 'none' });
                    } catch (error) {
                        bitmap = await createImageBitmap(blob);
                    }
                    source = bitmap;
                } else {
                    source = await loadImageElement(blob);
                }
            } catch (error) {
                source = await loadImageElement(blob);
            }

            canvas.width = source.width;
            canvas.height = source.height;
            ctx.drawImage(source, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (bitmap && bitmap.close) bitmap.close();
            return imageData;
        }

        async function decodeSogImage(zip, basePath, fileName) {
            const entry = findSogZipFile(zip, basePath, fileName);
            const imageBuffer = await entry.file.async('arraybuffer');
            const blob = new Blob([imageBuffer], { type: guessImageMimeType(entry.name) });
            return decodeImageData(blob);
        }

        function requireArray(value, length, label) {
            if (!Array.isArray(value) || value.length < length) {
                throw new Error(`SOG ${label} is missing or incomplete.`);
            }
            return value;
        }

        function unlogSogPosition(value) {
            return Math.sign(value) * (Math.exp(Math.abs(value)) - 1);
        }

        function decodeSogQuaternion(data, offset, target, index) {
            const toComponent = (value) => (value / 255 - 0.5) * 2.0 / Math.SQRT2;
            const a = toComponent(data[offset]);
            const b = toComponent(data[offset + 1]);
            const c = toComponent(data[offset + 2]);
            const mode = data[offset + 3] - 252;
            const d = Math.sqrt(Math.max(0, 1 - a * a - b * b - c * c));

            if (mode === 0) writeNormalizedQuaternion(target, index, d, a, b, c);
            else if (mode === 1) writeNormalizedQuaternion(target, index, a, d, b, c);
            else if (mode === 2) writeNormalizedQuaternion(target, index, a, b, d, c);
            else if (mode === 3) writeNormalizedQuaternion(target, index, a, b, c, d);
            else writeNormalizedQuaternion(target, index, 0, 0, 0, 1);
        }

        async function createSogGeometry(buffer) {
            const JSZip = await loadJSZip();
            const zip = await JSZip.loadAsync(buffer);
            const { file: metaFile, basePath } = findSogMetaFile(zip);
            const meta = JSON.parse(await metaFile.async('string'));
            if (meta.version !== 2) {
                throw new Error(`Unsupported SOG version ${meta.version || 'unknown'}.`);
            }

            const meansFiles = requireArray(meta.means?.files, 2, 'means files');
            const scalesFiles = requireArray(meta.scales?.files, 1, 'scales files');
            const quatsFiles = requireArray(meta.quats?.files, 1, 'quats files');
            const sh0Files = requireArray(meta.sh0?.files, 1, 'sh0 files');
            const meansMins = requireArray(meta.means?.mins, 3, 'means mins');
            const meansMaxs = requireArray(meta.means?.maxs, 3, 'means maxs');
            const scalesCodebook = requireArray(meta.scales?.codebook, 256, 'scales codebook');
            const sh0Codebook = requireArray(meta.sh0?.codebook, 256, 'sh0 codebook');

            const [meansL, meansU, scalesImage, quatsImage, sh0Image] = await Promise.all([
                decodeSogImage(zip, basePath, meansFiles[0]),
                decodeSogImage(zip, basePath, meansFiles[1]),
                decodeSogImage(zip, basePath, scalesFiles[0]),
                decodeSogImage(zip, basePath, quatsFiles[0]),
                decodeSogImage(zip, basePath, sh0Files[0])
            ]);

            const capacity = Math.min(
                meansL.width * meansL.height,
                meansU.width * meansU.height,
                scalesImage.width * scalesImage.height,
                quatsImage.width * quatsImage.height,
                sh0Image.width * sh0Image.height
            );
            const count = finiteInteger(meta.count, capacity);
            if (count <= 0) throw new Error('SOG contains no splats.');
            if (count > capacity) throw new Error('SOG count exceeds image capacity.');

            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const scales = new Float32Array(count * 3);
            const rotations = new Float32Array(count * 4);
            const shC0 = 0.28209479177387814;
            const meansLData = meansL.data;
            const meansUData = meansU.data;
            const scalesData = scalesImage.data;
            const quatsData = quatsImage.data;
            const sh0Data = sh0Image.data;

            for (let i = 0; i < count; i++) {
                const p = i * 4;
                const qx = (meansUData[p] << 8) | meansLData[p];
                const qy = (meansUData[p + 1] << 8) | meansLData[p + 1];
                const qz = (meansUData[p + 2] << 8) | meansLData[p + 2];
                const nx = lerp(meansMins[0], meansMaxs[0], qx / 65535);
                const ny = lerp(meansMins[1], meansMaxs[1], qy / 65535);
                const nz = lerp(meansMins[2], meansMaxs[2], qz / 65535);

                positions[i * 3] = unlogSogPosition(nx);
                positions[i * 3 + 1] = unlogSogPosition(ny);
                positions[i * 3 + 2] = unlogSogPosition(nz);

                const sx = Math.abs(scalesCodebook[scalesData[p]] ?? 0);
                const sy = Math.abs(scalesCodebook[scalesData[p + 1]] ?? 0);
                const sz = Math.abs(scalesCodebook[scalesData[p + 2]] ?? 0);
                scales[i * 3] = sx;
                scales[i * 3 + 1] = sy;
                scales[i * 3 + 2] = sz;
                sizes[i] = Math.max(sx, sy, sz, 0.0001);
                decodeSogQuaternion(quatsData, p, rotations, i);

                colors[i * 3] = clamp(0.5 + (sh0Codebook[sh0Data[p]] ?? 0) * shC0, 0, 1);
                colors[i * 3 + 1] = clamp(0.5 + (sh0Codebook[sh0Data[p + 1]] ?? 0) * shC0, 0, 1);
                colors[i * 3 + 2] = clamp(0.5 + (sh0Codebook[sh0Data[p + 2]] ?? 0) * shC0, 0, 1);
                opacities[i] = sh0Data[p + 3] / 255;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = true;
            geometry.userData.sourceFormat = 'sog';
            return geometry;
        }

        function canUsePreviewIndex(count) {
            if (count <= 65535) return true;
            return !!(
                renderer &&
                (
                    renderer.capabilities?.isWebGL2 ||
                    renderer.extensions?.get?.('OES_element_index_uint')
                )
            );
        }

        function createPreviewIndexAttribute(count) {
            const IndexArray = count > 65535 ? Uint32Array : Uint16Array;
            const indices = new IndexArray(count);
            let stride = Math.max(1, Math.floor(count * 0.618033988749895));
            if (stride % 2 === 0) stride++;
            while (greatestCommonDivisor(stride, count) !== 1) {
                stride += 2;
                if (stride >= count) stride = (stride % count) || 1;
            }

            let value = 0;
            for (let i = 0; i < count; i++) {
                indices[i] = value;
                value = (value + stride) % count;
            }

            return new THREE.BufferAttribute(indices, 1);
        }

        function preparePreviewDensityGeometry(geometry) {
            const position = geometry.attributes.position;
            if (!position) return 0;

            const count = position.count;
            if (count <= 0) {
                geometry.userData.previewCount = 0;
                geometry.setDrawRange(0, 0);
                return 0;
            }
            if (!geometry.userData.previewIndexReady && count > 1 && canUsePreviewIndex(count)) {
                geometry.setIndex(createPreviewIndexAttribute(count));
                geometry.userData.previewIndexReady = true;
            }

            geometry.userData.previewCount = geometry.index ? geometry.index.count : count;
            geometry.setDrawRange(0, Math.max(1, Math.floor(geometry.userData.previewCount * pointDrawFraction)));
            return geometry.userData.previewCount;
        }

        function createBufferGeometryLoader(parseGeometry) {
            return {
                load: (url, onLoad, onProgress, onError) => {
                    fetch(url)
                        .then((response) => {
                            if (!response.ok) throw new Error(`Could not load ${url}`);
                            return response.arrayBuffer();
                        })
                        .then((buffer) => Promise.resolve(parseGeometry(buffer)))
                        .then((geometry) => onLoad(geometry))
                        .catch((error) => {
                            if (onError) onError(error);
                            else throw error;
                        });
                }
            };
        }

        function createPlyLoader() {
            const fallbackLoader = new THREE.PLYLoader();
            return createBufferGeometryLoader((buffer) => {
                if (getImportMode() !== 'mesh') {
                    const gaussianGeometry = createGaussianPlyGeometry(buffer);
                    if (gaussianGeometry) return gaussianGeometry;
                }
                return fallbackLoader.parse(buffer);
            });
        }

        function getImportExtension(url, fileName = '') {
            const source = fileName || (url && !url.startsWith('blob:') ? url.split('?')[0] : '');
            const match = source.toLowerCase().match(/\.([a-z0-9]+)$/);
            return match ? match[1] : 'glb';
        }

        function getImportMode() {
            return document.getElementById('import-mode')?.value || 'auto';
        }

        function createImportLoader(extension) {
            if (extension === 'glb' || extension === 'gltf') return new THREE.GLTFLoader();
            if (extension === 'obj') return new THREE.OBJLoader();
            if (extension === 'stl') return new THREE.STLLoader();
            if (extension === 'ply') return createPlyLoader();
            if (extension === 'splat') return createBufferGeometryLoader(createSplatGeometry);
            if (extension === 'sog') return createBufferGeometryLoader(createSogGeometry);
            return null;
        }

        function createMeshRootFromGeometry(geometry, color = 0xb8c7d9) {
            if (!geometry.attributes.normal) geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({
                color,
                roughness: 0.65,
                metalness: 0.0,
                vertexColors: !!geometry.attributes.color
            });
            const root = new THREE.Group();
            root.add(new THREE.Mesh(geometry, material));
            return root;
        }

        function createPointRootFromGeometry(geometry, color = 0xffffff) {
            if (!geometry.attributes.position) return null;
            const maxCount = preparePreviewDensityGeometry(geometry);
            const material = createPointMaterial(null, color, !!geometry.attributes.color, false);
            pointMaterials.push(material);

            const points = new THREE.Points(geometry, material);
            points.userData.maxCount = maxCount;
            points.frustumCulled = false;

            const root = new THREE.Group();
            root.add(points);
            return root;
        }

        function createDynamicInstanceAttribute(array, itemSize) {
            const attr = new THREE.InstancedBufferAttribute(array, itemSize);
            if (THREE.DynamicDrawUsage) attr.setUsage(THREE.DynamicDrawUsage);
            return attr;
        }

        function createGaussianInstanceGeometry(count) {
            const geometry = new THREE.InstancedBufferGeometry();
            geometry.setIndex(new THREE.BufferAttribute(new Uint16Array([0, 1, 2, 0, 2, 3]), 1));
            geometry.setAttribute('quadPosition', new THREE.BufferAttribute(new Float32Array([
                -1, -1,
                 1, -1,
                 1,  1,
                -1,  1
            ]), 2));
            geometry.setAttribute('instancePosition', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceColor', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceOpacity', createDynamicInstanceAttribute(new Float32Array(count), 1));
            geometry.setAttribute('instanceScale', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceRotation', createDynamicInstanceAttribute(new Float32Array(count * 4), 4));
            geometry.instanceCount = count;
            geometry.maxInstancedCount = count;
            return geometry;
        }

        function copyGaussianInstances(mesh, count) {
            const data = mesh.userData;
            const attrs = mesh.geometry.attributes;
            const positions = attrs.instancePosition.array;
            const colors = attrs.instanceColor.array;
            const opacities = attrs.instanceOpacity.array;
            const scales = attrs.instanceScale.array;
            const rotations = attrs.instanceRotation.array;
            const source = data.source;

            for (let out = 0; out < count; out++) {
                const src = data.order[out];
                positions[out * 3] = source.positions[src * 3];
                positions[out * 3 + 1] = source.positions[src * 3 + 1];
                positions[out * 3 + 2] = source.positions[src * 3 + 2];
                colors[out * 3] = source.colors[src * 3];
                colors[out * 3 + 1] = source.colors[src * 3 + 1];
                colors[out * 3 + 2] = source.colors[src * 3 + 2];
                opacities[out] = source.opacities[src];
                scales[out * 3] = source.scales[src * 3];
                scales[out * 3 + 1] = source.scales[src * 3 + 1];
                scales[out * 3 + 2] = source.scales[src * 3 + 2];
                rotations[out * 4] = source.rotations[src * 4];
                rotations[out * 4 + 1] = source.rotations[src * 4 + 1];
                rotations[out * 4 + 2] = source.rotations[src * 4 + 2];
                rotations[out * 4 + 3] = source.rotations[src * 4 + 3];
            }

            attrs.instancePosition.needsUpdate = true;
            attrs.instanceColor.needsUpdate = true;
            attrs.instanceOpacity.needsUpdate = true;
            attrs.instanceScale.needsUpdate = true;
            attrs.instanceRotation.needsUpdate = true;
        }

        function setGaussianRendererDrawCount(mesh, count) {
            const maxCount = Math.max(0, mesh.userData.maxCount || 0);
            const clamped = maxCount <= 0 ? 0 : Math.max(1, Math.min(maxCount, count));
            mesh.userData.drawCount = clamped;
            mesh.userData.needsSort = true;
            mesh.geometry.instanceCount = clamped;
            mesh.geometry.maxInstancedCount = clamped;
        }

        function sortGaussianRenderer(mesh, force = false) {
            const data = mesh.userData;
            const count = Math.min(data.drawCount || data.maxCount, data.maxCount);
            if (count <= 0) return;

            const now = performance.now();
            if (!force && !data.needsSort && now - data.lastSortTime < 160) return;

            mesh.updateMatrixWorld(true);
            activeCamera.updateMatrixWorld(true);
            gaussianSortMatrix.multiplyMatrices(activeCamera.matrixWorldInverse, mesh.matrixWorld);
            const e = gaussianSortMatrix.elements;
            const positions = data.source.positions;
            const preview = data.previewIndices;

            for (let i = 0; i < count; i++) {
                const src = preview ? preview[i] : i;
                const x = positions[src * 3];
                const y = positions[src * 3 + 1];
                const z = positions[src * 3 + 2];
                data.order[i] = src;
                data.depths[src] = e[2] * x + e[6] * y + e[10] * z + e[14];
            }

            data.order.subarray(0, count).sort((a, b) => data.depths[a] - data.depths[b]);
            copyGaussianInstances(mesh, count);
            data.lastSortTime = now;
            data.needsSort = false;
        }

        function updateGaussianDepthSorting(force = false) {
            gaussianGroup.updateMatrixWorld(true);
            gaussianGroup.traverse((node) => {
                if (node.userData.isGaussianSplatRenderer) sortGaussianRenderer(node, force);
            });
        }

        function createGaussianRootFromGeometry(geometry) {
            if (
                !geometry.attributes.position ||
                !geometry.attributes.splatScale ||
                !geometry.attributes.splatRotation ||
                !geometry.attributes.opacity ||
                !geometry.attributes.color
            ) return null;
            const maxCount = preparePreviewDensityGeometry(geometry);
            const material = createGaussianSplatMaterial();
            gaussianMaterials.push(material);

            const instanceGeometry = createGaussianInstanceGeometry(maxCount);
            const splats = new THREE.Mesh(instanceGeometry, material);
            splats.userData.isGaussianSplatRenderer = true;
            splats.userData.sourceGeometry = geometry;
            splats.userData.maxCount = maxCount;
            splats.userData.drawCount = Math.max(1, Math.floor(maxCount * pointDrawFraction));
            splats.userData.previewIndices = geometry.index?.array || null;
            splats.userData.order = new Uint32Array(maxCount);
            splats.userData.depths = new Float32Array(maxCount);
            splats.userData.lastSortTime = 0;
            splats.userData.needsSort = true;
            splats.userData.source = {
                positions: geometry.attributes.position.array,
                colors: geometry.attributes.color.array,
                opacities: geometry.attributes.opacity.array,
                scales: geometry.attributes.splatScale.array,
                rotations: geometry.attributes.splatRotation.array
            };
            setGaussianRendererDrawCount(splats, splats.userData.drawCount);
            for (let i = 0; i < splats.userData.drawCount; i++) {
                splats.userData.order[i] = splats.userData.previewIndices ? splats.userData.previewIndices[i] : i;
            }
            copyGaussianInstances(splats, splats.userData.drawCount);
            splats.frustumCulled = false;

            const root = new THREE.Group();
            root.add(splats);
            return root;
        }

        function normalizeImportedAsset(asset, extension, importMode) {
            if (extension === 'glb' || extension === 'gltf') {
                return { root: asset.scene, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'obj') {
                return { root: asset, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'stl') {
                if (importMode === 'points') {
                    return { root: createPointRootFromGeometry(asset), isPointCloud: true, gaussianRoot: null, preferGaussian: false };
                }
                return { root: createMeshRootFromGeometry(asset), isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'ply') {
                if (importMode === 'mesh') {
                    return { root: createMeshRootFromGeometry(asset), isPointCloud: false, gaussianRoot: null, preferGaussian: false };
                }
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: !!asset.userData.isGaussianSplat
                };
            }

            if (extension === 'splat') {
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: true
                };
            }

            if (extension === 'sog') {
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: true
                };
            }

            return { root: null, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
        }

        function disposeLoadedAsset(asset, extension) {
            if (!asset) return;
            if (asset.scene) disposeObject(asset.scene);
            else if (asset.isObject3D) disposeObject(asset);
            else if (asset.isBufferGeometry) asset.dispose();
        }

        function setLoadingError(statusText, spinner, message) {
            statusText.textContent = message;
            statusText.classList.remove('text-amber-400');
            statusText.classList.add('text-red-500');
            spinner.classList.add('hidden');
        }

        function applyToMaterials(material, callback) {
            const materials = Array.isArray(material) ? material : [material];
            materials.forEach((m) => { if (m) callback(m); });
        }

        function getOrientationEuler() {
            const rx = clamp(finiteNumber(document.getElementById('rot-x').value, 0), 0, 360) * (Math.PI / 180);
            const ry = clamp(finiteNumber(document.getElementById('rot-y').value, 0), 0, 360) * (Math.PI / 180);
            const rz = clamp(finiteNumber(document.getElementById('rot-z').value, 0), 0, 360) * (Math.PI / 180);
            return new THREE.Euler(rx, ry, rz, 'XYZ');
        }

        function getModelTranslation() {
            const px = finiteNumber(document.getElementById('pos-model-x')?.value, 0);
            const py = finiteNumber(document.getElementById('pos-model-y')?.value, 0);
            const pz = finiteNumber(document.getElementById('pos-model-z')?.value, 0);
            return new THREE.Vector3(px, py, pz);
        }

        function forEachActiveWrapper(callback) {
            const seen = new Set();
            Object.values(activeWrappers).forEach((wrapper) => {
                if (!wrapper || seen.has(wrapper)) return;
                seen.add(wrapper);
                callback(wrapper);
            });
        }

        function applyWrapperTransform(wrapper, euler, translation = null) {
            const baseScale = wrapper.userData.baseScale || Math.abs(wrapper.scale.x) || 1;
            wrapper.rotation.copy(euler);
            wrapper.scale.set(baseScale, flipModelVertical ? -baseScale : baseScale, baseScale);
            if (translation) {
                // Apply translation, considering we can shift it before or after scaling
                // multiplyScalar makes it act in "normalized model" magnitude
                wrapper.position.copy(translation).multiplyScalar(baseScale);
            }
        }

        function setWrapperBaseScale(wrapper, scale) {
            wrapper.userData.baseScale = scale;
            applyWrapperTransform(wrapper, new THREE.Euler(), new THREE.Vector3());
        }

        function finishModelLoad(status, statusText, spinner) {
            updateBounds();
            fitCropBoxToModel();
            controls.target.set(0, 0, 0);
            controls.update();

            status.classList.add('hidden');

            const meshCheck = document.getElementById('show-mesh');
            visualGroup.visible = meshCheck.checked;
            if(viewMode === '2d' || renderStyle === 'points') {
                meshCheck.checked = false;
                visualGroup.visible = false;
            }

            toggleOutlineMode(document.getElementById('outline-mode').checked);
            setRenderStyle(renderStyle);
            resetOrientationUI();
            refreshSliceThicknessFromMode();
            updateFrameHelper();
            updateCropHelperVisibility();
            updatePointDensity();
        }

        function percentile(values, pct) {
            if (!values.length) return 0;
            values.sort((a, b) => a - b);
            const index = Math.min(values.length - 1, Math.max(0, Math.floor((values.length - 1) * pct)));
            return values[index];
        }

        function normalizeGaussianSplatSizes(root, modelScale) {
            const records = [];
            const seen = new Set();
            root.traverse((node) => {
                const sourceGeometry = node.userData.sourceGeometry || node.geometry;
                const sizeAttr = sourceGeometry?.attributes?.splatSize;
                if (!sizeAttr || seen.has(sizeAttr.array)) return;
                seen.add(sizeAttr.array);
                records.push({
                    sizeAttr,
                    scaleAttr: sourceGeometry.attributes.splatScale || null,
                    renderer: node.userData.isGaussianSplatRenderer ? node : null
                });
            });
            if (!records.length) return;

            const samples = [];
            records.forEach(({ sizeAttr }) => {
                const stride = Math.max(1, Math.floor(sizeAttr.array.length / 20000));
                for (let i = 0; i < sizeAttr.array.length; i += stride) {
                    const size = sizeAttr.array[i] * modelScale;
                    if (Number.isFinite(size) && size > 0) samples.push(size);
                }
            });

            const reference = percentile(samples, 0.75) || GAUSSIAN_REFERENCE_RADIUS;
            const normalization = GAUSSIAN_REFERENCE_RADIUS / reference;
            records.forEach(({ sizeAttr, scaleAttr, renderer }) => {
                if (scaleAttr) {
                    for (let i = 0; i < sizeAttr.array.length; i++) {
                        const sx = clamp(scaleAttr.array[i * 3] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        const sy = clamp(scaleAttr.array[i * 3 + 1] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        const sz = clamp(scaleAttr.array[i * 3 + 2] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        scaleAttr.array[i * 3] = sx;
                        scaleAttr.array[i * 3 + 1] = sy;
                        scaleAttr.array[i * 3 + 2] = sz;
                        sizeAttr.array[i] = Math.max(sx, sy, sz);
                    }
                    scaleAttr.needsUpdate = true;
                } else {
                    for (let i = 0; i < sizeAttr.array.length; i++) {
                        sizeAttr.array[i] = clamp(sizeAttr.array[i] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                    }
                }
                sizeAttr.needsUpdate = true;
                if (renderer) renderer.userData.needsSort = true;
            });
        }

        function installPointCloudRoot(root, rawBox, scale, gaussianRoot = null) {
            const center = rawBox.getCenter(new THREE.Vector3());
            const pointWrapper = new THREE.Group();
            if (gaussianRoot) normalizeGaussianSplatSizes(gaussianRoot, scale);

            root.position.copy(center).negate();
            pointWrapper.add(root);
            setWrapperBaseScale(pointWrapper, scale);
            pointGroup.add(pointWrapper);

            let gaussianWrapper = null;
            if (gaussianRoot) {
                gaussianWrapper = new THREE.Group();
                gaussianRoot.position.copy(center).negate();
                gaussianWrapper.add(gaussianRoot);
                setWrapperBaseScale(gaussianWrapper, scale);
                gaussianGroup.add(gaussianWrapper);
            }

            activeWrappers.visual = pointWrapper;
            activeWrappers.back = null;
            activeWrappers.front = null;
            activeWrappers.points = pointWrapper;
            activeWrappers.gaussian = gaussianWrapper;
        }

        function installMeshRoot(root, rawBox, scale) {
            const center = rawBox.getCenter(new THREE.Vector3());

            const visWrapper = new THREE.Group();
            root.position.copy(center).negate();
            visWrapper.add(root);
            setWrapperBaseScale(visWrapper, scale);

            const backWrapper = new THREE.Group();
            const backRoot = root.clone();
            backWrapper.add(backRoot);
            setWrapperBaseScale(backWrapper, scale);

            const frontWrapper = new THREE.Group();
            const frontRoot = root.clone();
            frontWrapper.add(frontRoot);
            setWrapperBaseScale(frontWrapper, scale);

            const pointWrapper = new THREE.Group();
            pointWrapper.position.copy(visWrapper.position);
            pointWrapper.rotation.copy(visWrapper.rotation);
            setWrapperBaseScale(pointWrapper, scale);

            const setupStencil = (mesh, mat) => {
                mesh.material = mat;
                mesh.material.clippingPlanes = [clippingPlane];
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                mesh.frustumCulled = false;
            };
            backRoot.traverse((o) => { if (o.isMesh) setupStencil(o, backMat); });
            frontRoot.traverse((o) => { if (o.isMesh) setupStencil(o, frontMat); });
            root.traverse((o) => {
                if (o.isMesh) {
                    applyToMaterials(o.material, (material) => {
                        material.clippingPlanes = [clippingPlane];
                        material.side = THREE.DoubleSide;
                    });
                }
            });

            const getMeshArea = (mesh) => {
                if(!mesh.geometry.attributes.position) return 0;
                const idx = mesh.geometry.index;
                const pos = mesh.geometry.attributes.position;
                let a = 0;
                const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
                const ab = new THREE.Vector3(), ac = new THREE.Vector3();
                const total = Math.floor((idx ? idx.count : pos.count) / 3) * 3;
                const vertexIndex = (offset) => idx ? idx.getX(offset) : offset;
                for(let i=0; i<total; i+=3) {
                    va.fromBufferAttribute(pos, vertexIndex(i));
                    vb.fromBufferAttribute(pos, vertexIndex(i+1));
                    vc.fromBufferAttribute(pos, vertexIndex(i+2));
                    ab.subVectors(vb, va);
                    ac.subVectors(vc, va);
                    a += ab.cross(ac).length() * 0.5;
                }
                return a;
            };

            const pointRoot = root.clone();
            let cloneTotalArea = 0;
            const cloneList = [];

            pointRoot.traverse(o => {
                if(o.isMesh && o.geometry) {
                    const area = getMeshArea(o);
                    if (area > 0) {
                        cloneTotalArea += area;
                        cloneList.push({obj: o, area: area});
                    }
                }
            });

            if (cloneTotalArea > 0) {
                cloneList.forEach(item => {
                    const ratio = item.area / cloneTotalArea;
                    const count = Math.floor(MAX_POINTS * ratio);
                    if(count > 0) {
                        const sourceMaterial = Array.isArray(item.obj.material) ? item.obj.material[0] : item.obj.material;
                        const sampledGeo = createSamplingGeometry(item.obj, count);
                        const mat = createPointMaterial(sourceMaterial?.map, sourceMaterial?.color || 0xffffff, !!sampledGeo.attributes.color, !!sampledGeo.attributes.uv);
                        pointMaterials.push(mat);

                        const maxCount = preparePreviewDensityGeometry(sampledGeo);
                        const p = new THREE.Points(sampledGeo, mat);
                        p.userData.maxCount = maxCount;

                        item.obj.geometry = sampledGeo;
                        item.obj.material = mat;
                        const parent = item.obj.parent;
                        if(parent) {
                            p.position.copy(item.obj.position);
                            p.rotation.copy(item.obj.rotation);
                            p.scale.copy(item.obj.scale);
                            p.matrixAutoUpdate = true;
                            parent.add(p);
                            parent.remove(item.obj);
                        }
                    }
                });
            }

            pointRoot.traverse(o => { if(o.isMesh) o.visible = false; });

            pointWrapper.add(pointRoot);

            visualGroup.add(visWrapper);
            stencilGroup.add(backWrapper);
            stencilGroup.add(frontWrapper);
            pointGroup.add(pointWrapper);

            activeWrappers.visual = visWrapper;
            activeWrappers.back = backWrapper;
            activeWrappers.front = frontWrapper;
            activeWrappers.points = pointWrapper;
            activeWrappers.gaussian = null;
        }

        function installImportedRoot(root, isPointCloud, gaussianRoot, status, statusText, spinner) {
            if (!root) {
                setLoadingError(statusText, spinner, "Unsupported import.");
                return;
            }

            root.updateMatrixWorld(true);
            const rawBox = new THREE.Box3().setFromObject(root);

            if (rawBox.isEmpty()) {
                disposeObject(root);
                setLoadingError(statusText, spinner, "Warning: Empty model.");
                return;
            }

            const size = rawBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1.0;
            const scale = 2 / maxDim;

            if (isPointCloud) installPointCloudRoot(root, rawBox, scale, gaussianRoot);
            else installMeshRoot(root, rawBox, scale);

            finishModelLoad(status, statusText, spinner);
        }

        function loadModel(url, fileName = '') {
            const loadId = ++modelLoadId;
            const extension = getImportExtension(url, fileName);
            const loader = createImportLoader(extension);
            const status = document.getElementById('loading-status');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('loading-spinner');

            status.classList.remove('hidden');
            statusText.classList.remove('text-red-500');
            statusText.classList.add('text-amber-400');
            spinner.classList.remove('hidden');
            statusText.textContent = "Loading...";

            if (!loader) {
                setLoadingError(statusText, spinner, "Unsupported file type.");
                return;
            }

            loader.load(url, (asset) => {
                if (loadId !== modelLoadId) {
                    disposeLoadedAsset(asset, extension);
                    return;
                }

                clearGroup(visualGroup);
                clearGroup(stencilGroup);
                clearGroup(pointGroup);
                clearGroup(gaussianGroup);

                pointMaterials = [];
                gaussianMaterials = [];
                activeWrappers = { visual: null, back: null, front: null, points: null, gaussian: null };
                cropBoxInitialized = false;

                const imported = normalizeImportedAsset(asset, extension, getImportMode());
                if (imported.preferGaussian && getImportMode() !== 'points') {
                    renderStyle = 'gaussian';
                }
                installImportedRoot(imported.root, imported.isPointCloud, imported.gaussianRoot, status, statusText, spinner);

            }, undefined, (e) => {
                if (loadId !== modelLoadId) return;
                console.error(e);
                setLoadingError(statusText, spinner, "Error loading model.");
            });
        }
        
        function setPointDrawFraction(fraction) {
            pointDrawFraction = clamp(finiteNumber(fraction, DEFAULT_POINT_DENSITY), 0.01, 1.0);
            pointGroup.traverse(o => {
                if(o.isPoints && typeof o.userData.maxCount === 'number') {
                    const count = o.userData.maxCount <= 0 ? 0 : Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    o.geometry.setDrawRange(0, count);
                }
            });
            gaussianGroup.traverse(o => {
                if (o.userData.isGaussianSplatRenderer && typeof o.userData.maxCount === 'number') {
                    const count = o.userData.maxCount <= 0 ? 0 : Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    setGaussianRendererDrawCount(o, count);
                } else if(o.isPoints && typeof o.userData.maxCount === 'number') {
                    const count = o.userData.maxCount <= 0 ? 0 : Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    o.geometry.setDrawRange(0, count);
                }
            });
            return pointDrawFraction;
        }

        function updatePointDensity() {
            const pct = setPointDrawFraction(document.getElementById('point-count').value);
            document.getElementById('point-count-val').textContent = Math.round(pct * 100) + '%';
        }

        function applyPointClippingPlanes(useSlab) {
            const planes = getPointClippingPlanes(useSlab);
            pointMaterials.forEach((material) => {
                material.clippingPlanes = planes;
                material.needsUpdate = true;
            });
            gaussianMaterials.forEach((material) => {
                material.clippingPlanes = planes;
                material.needsUpdate = true;
            });
        }

        function setFullPointCloudVisible(visible) {
            showFullPointCloud = visible;
            applyPointClippingPlanes(!showFullPointCloud);
            updatePlaneHeight(document.getElementById('slice-slider').value);
        }

        function getBoundsWrapper() {
            if (renderStyle === 'gaussian' && activeWrappers.gaussian) return activeWrappers.gaussian;
            if (renderStyle === 'points' && activeWrappers.points) return activeWrappers.points;
            return activeWrappers.visual || activeWrappers.points || activeWrappers.gaussian;
        }
        
        function updateBounds() {
            const boundsWrapper = getBoundsWrapper();
            if (!boundsWrapper) return;
            boundsWrapper.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(boundsWrapper);
            if (box.isEmpty()) return;
            const min = getAxisComponent(box.min);
            const max = getAxisComponent(box.max);
            const height = max - min;
            const buffer = height * 0.1;
            modelBounds.min = min - buffer;
            modelBounds.max = max + buffer;
            const slider = document.getElementById('slice-slider');
            slider.min = modelBounds.min;
            slider.max = modelBounds.max;
            slider.step = height / 1000;
        }

        function updateOrientation() {
            if (!activeWrappers.visual) return;
            flipModelVertical = document.getElementById('flip-model').checked;
            const euler = getOrientationEuler();
            const translation = getModelTranslation();
            forEachActiveWrapper((wrapper) => applyWrapperTransform(wrapper, euler, translation));
            gaussianGroup.traverse((node) => {
                if (node.userData.isGaussianSplatRenderer) node.userData.needsSort = true;
            });
            
            updateBounds();
            if (!cropEnabled) fitCropBoxToModel();
            else {
                updateCropPlanes();
                syncCropControlsFromBox();
            }
            updateCropHelperVisibility();
            if (!isAnimate) {
                refreshSliceThicknessFromMode();
            }
        }
        
        window.resetOrientation = function() {
            resetOrientationUI();
            updateOrientation();
        }
        
        function resetOrientationUI() {
            ['x', 'y', 'z'].forEach(axis => {
                document.getElementById(`rot-${axis}`).value = 0;
                document.getElementById(`num-rot-${axis}`).value = 0;
            });
            document.getElementById('flip-model').checked = false;
        }

        window.centerModel = function() {
            if (!activeWrappers.visual) return;
            
            // Set offset to zero momentarily to measure natural center
