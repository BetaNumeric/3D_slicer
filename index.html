                return fallbackLoader.parse(buffer);
            });
        }

        function getImportExtension(url, fileName = '') {
            const source = fileName || (url && !url.startsWith('blob:') ? url.split('?')[0] : '');
            const match = source.toLowerCase().match(/\.([a-z0-9]+)$/);
            return match ? match[1] : 'glb';
        }

        function getImportMode() {
            return document.getElementById('import-mode')?.value || 'auto';
        }

        function createImportLoader(extension) {
            if (extension === 'glb' || extension === 'gltf') return new THREE.GLTFLoader();
            if (extension === 'obj') return new THREE.OBJLoader();
            if (extension === 'stl') return new THREE.STLLoader();
            if (extension === 'ply') return createPlyLoader();
            if (extension === 'splat') return createBufferGeometryLoader(createSplatGeometry);
            if (extension === 'sog') return createBufferGeometryLoader(createSogGeometry);
            return null;
        }

        function createMeshRootFromGeometry(geometry, color = 0xb8c7d9) {
            if (!geometry.attributes.normal) geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({
                color,
                roughness: 0.65,
                metalness: 0.0,
                vertexColors: !!geometry.attributes.color
            });
            const root = new THREE.Group();
            root.add(new THREE.Mesh(geometry, material));
            return root;
        }

        function createPointRootFromGeometry(geometry, color = 0xffffff) {
            if (!geometry.attributes.position) return null;
            const maxCount = preparePreviewDensityGeometry(geometry);
            const material = createPointMaterial(null, color, !!geometry.attributes.color, false);
            pointMaterials.push(material);

            const points = new THREE.Points(geometry, material);
            points.userData.maxCount = maxCount;
            points.frustumCulled = false;

            const root = new THREE.Group();
            root.add(points);
            return root;
        }

        function createDynamicInstanceAttribute(array, itemSize) {
            const attr = new THREE.InstancedBufferAttribute(array, itemSize);
            if (THREE.DynamicDrawUsage) attr.setUsage(THREE.DynamicDrawUsage);
            return attr;
        }

        function createGaussianInstanceGeometry(count) {
            const geometry = new THREE.InstancedBufferGeometry();
            geometry.setIndex(new THREE.BufferAttribute(new Uint16Array([0, 1, 2, 0, 2, 3]), 1));
            geometry.setAttribute('quadPosition', new THREE.BufferAttribute(new Float32Array([
                -1, -1,
                 1, -1,
                 1,  1,
                -1,  1
            ]), 2));
            geometry.setAttribute('instancePosition', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceColor', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceOpacity', createDynamicInstanceAttribute(new Float32Array(count), 1));
            geometry.setAttribute('instanceScale', createDynamicInstanceAttribute(new Float32Array(count * 3), 3));
            geometry.setAttribute('instanceRotation', createDynamicInstanceAttribute(new Float32Array(count * 4), 4));
            geometry.instanceCount = count;
            geometry.maxInstancedCount = count;
            return geometry;
        }

        function copyGaussianInstances(mesh, count) {
            const data = mesh.userData;
            const attrs = mesh.geometry.attributes;
            const positions = attrs.instancePosition.array;
            const colors = attrs.instanceColor.array;
            const opacities = attrs.instanceOpacity.array;
            const scales = attrs.instanceScale.array;
            const rotations = attrs.instanceRotation.array;
            const source = data.source;

            for (let out = 0; out < count; out++) {
                const src = data.order[out];
                positions[out * 3] = source.positions[src * 3];
                positions[out * 3 + 1] = source.positions[src * 3 + 1];
                positions[out * 3 + 2] = source.positions[src * 3 + 2];
                colors[out * 3] = source.colors[src * 3];
                colors[out * 3 + 1] = source.colors[src * 3 + 1];
                colors[out * 3 + 2] = source.colors[src * 3 + 2];
                opacities[out] = source.opacities[src];
                scales[out * 3] = source.scales[src * 3];
                scales[out * 3 + 1] = source.scales[src * 3 + 1];
                scales[out * 3 + 2] = source.scales[src * 3 + 2];
                rotations[out * 4] = source.rotations[src * 4];
                rotations[out * 4 + 1] = source.rotations[src * 4 + 1];
                rotations[out * 4 + 2] = source.rotations[src * 4 + 2];
                rotations[out * 4 + 3] = source.rotations[src * 4 + 3];
            }

            attrs.instancePosition.needsUpdate = true;
            attrs.instanceColor.needsUpdate = true;
            attrs.instanceOpacity.needsUpdate = true;
            attrs.instanceScale.needsUpdate = true;
            attrs.instanceRotation.needsUpdate = true;
        }

        function setGaussianRendererDrawCount(mesh, count) {
            const clamped = Math.max(1, Math.min(mesh.userData.maxCount, count));
            mesh.userData.drawCount = clamped;
            mesh.userData.needsSort = true;
            mesh.geometry.instanceCount = clamped;
            mesh.geometry.maxInstancedCount = clamped;
        }

        function sortGaussianRenderer(mesh, force = false) {
            const data = mesh.userData;
            const count = Math.min(data.drawCount || data.maxCount, data.maxCount);
            if (count <= 0) return;

            const now = performance.now();
            if (!force && !data.needsSort && now - data.lastSortTime < 160) return;

            mesh.updateMatrixWorld(true);
            activeCamera.updateMatrixWorld(true);
            gaussianSortMatrix.multiplyMatrices(activeCamera.matrixWorldInverse, mesh.matrixWorld);
            const e = gaussianSortMatrix.elements;
            const positions = data.source.positions;
            const preview = data.previewIndices;

            for (let i = 0; i < count; i++) {
                const src = preview ? preview[i] : i;
                const x = positions[src * 3];
                const y = positions[src * 3 + 1];
                const z = positions[src * 3 + 2];
                data.order[i] = src;
                data.depths[src] = e[2] * x + e[6] * y + e[10] * z + e[14];
            }

            data.order.subarray(0, count).sort((a, b) => data.depths[a] - data.depths[b]);
            copyGaussianInstances(mesh, count);
            data.lastSortTime = now;
            data.needsSort = false;
        }

        function updateGaussianDepthSorting(force = false) {
            gaussianGroup.updateMatrixWorld(true);
            gaussianGroup.traverse((node) => {
                if (node.userData.isGaussianSplatRenderer) sortGaussianRenderer(node, force);
            });
        }

        function createGaussianRootFromGeometry(geometry) {
            if (
                !geometry.attributes.position ||
                !geometry.attributes.splatScale ||
                !geometry.attributes.splatRotation ||
                !geometry.attributes.opacity ||
                !geometry.attributes.color
            ) return null;
            const maxCount = preparePreviewDensityGeometry(geometry);
            const material = createGaussianSplatMaterial();
            gaussianMaterials.push(material);

            const instanceGeometry = createGaussianInstanceGeometry(maxCount);
            const splats = new THREE.Mesh(instanceGeometry, material);
            splats.userData.isGaussianSplatRenderer = true;
            splats.userData.sourceGeometry = geometry;
            splats.userData.maxCount = maxCount;
            splats.userData.drawCount = Math.max(1, Math.floor(maxCount * pointDrawFraction));
            splats.userData.previewIndices = geometry.index?.array || null;
            splats.userData.order = new Uint32Array(maxCount);
            splats.userData.depths = new Float32Array(maxCount);
            splats.userData.lastSortTime = 0;
            splats.userData.needsSort = true;
            splats.userData.source = {
                positions: geometry.attributes.position.array,
                colors: geometry.attributes.color.array,
                opacities: geometry.attributes.opacity.array,
                scales: geometry.attributes.splatScale.array,
                rotations: geometry.attributes.splatRotation.array
            };
            setGaussianRendererDrawCount(splats, splats.userData.drawCount);
            for (let i = 0; i < splats.userData.drawCount; i++) {
                splats.userData.order[i] = splats.userData.previewIndices ? splats.userData.previewIndices[i] : i;
            }
            copyGaussianInstances(splats, splats.userData.drawCount);
            splats.frustumCulled = false;

            const root = new THREE.Group();
            root.add(splats);
            return root;
        }

        function normalizeImportedAsset(asset, extension, importMode) {
            if (extension === 'glb' || extension === 'gltf') {
                return { root: asset.scene, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'obj') {
                return { root: asset, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'stl') {
                if (importMode === 'points') {
                    return { root: createPointRootFromGeometry(asset), isPointCloud: true, gaussianRoot: null, preferGaussian: false };
                }
                return { root: createMeshRootFromGeometry(asset), isPointCloud: false, gaussianRoot: null, preferGaussian: false };
            }

            if (extension === 'ply') {
                if (importMode === 'mesh') {
                    return { root: createMeshRootFromGeometry(asset), isPointCloud: false, gaussianRoot: null, preferGaussian: false };
                }
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: !!asset.userData.isGaussianSplat
                };
            }

            if (extension === 'splat') {
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: true
                };
            }

            if (extension === 'sog') {
                return {
                    root: createPointRootFromGeometry(asset),
                    isPointCloud: true,
                    gaussianRoot: createGaussianRootFromGeometry(asset),
                    preferGaussian: true
                };
            }

            return { root: null, isPointCloud: false, gaussianRoot: null, preferGaussian: false };
        }

        function disposeLoadedAsset(asset, extension) {
            if (!asset) return;
            if (asset.scene) disposeObject(asset.scene);
            else if (asset.isObject3D) disposeObject(asset);
            else if (asset.isBufferGeometry) asset.dispose();
        }

        function setLoadingError(statusText, spinner, message) {
            statusText.textContent = message;
            statusText.classList.remove('text-amber-400');
            statusText.classList.add('text-red-500');
            spinner.classList.add('hidden');
        }

        function applyToMaterials(material, callback) {
            const materials = Array.isArray(material) ? material : [material];
            materials.forEach((m) => { if (m) callback(m); });
        }

        function getOrientationEuler() {
            const rx = clamp(finiteNumber(document.getElementById('rot-x').value, 0), 0, 360) * (Math.PI / 180);
            const ry = clamp(finiteNumber(document.getElementById('rot-y').value, 0), 0, 360) * (Math.PI / 180);
            const rz = clamp(finiteNumber(document.getElementById('rot-z').value, 0), 0, 360) * (Math.PI / 180);
            return new THREE.Euler(rx, ry, rz, 'XYZ');
        }

        function forEachActiveWrapper(callback) {
            const seen = new Set();
            Object.values(activeWrappers).forEach((wrapper) => {
                if (!wrapper || seen.has(wrapper)) return;
                seen.add(wrapper);
                callback(wrapper);
            });
        }

        function applyWrapperTransform(wrapper, euler) {
            const baseScale = wrapper.userData.baseScale || Math.abs(wrapper.scale.x) || 1;
            wrapper.rotation.copy(euler);
            wrapper.scale.set(baseScale, flipModelVertical ? -baseScale : baseScale, baseScale);
        }

        function setWrapperBaseScale(wrapper, scale) {
            wrapper.userData.baseScale = scale;
            applyWrapperTransform(wrapper, new THREE.Euler());
        }

        function finishModelLoad(status, statusText, spinner) {
            updateBounds();
            controls.target.set(0, 0, 0);
            controls.update();

            status.classList.add('hidden');

            const meshCheck = document.getElementById('show-mesh');
            visualGroup.visible = meshCheck.checked;
            if(viewMode === '2d' || renderStyle === 'points') {
                meshCheck.checked = false;
                visualGroup.visible = false;
            }

            toggleOutlineMode(document.getElementById('outline-mode').checked);
            setRenderStyle(renderStyle);
            resetOrientationUI();
            updateFrameHelper();
            updatePointDensity();
        }

        function percentile(values, pct) {
            if (!values.length) return 0;
            values.sort((a, b) => a - b);
            const index = Math.min(values.length - 1, Math.max(0, Math.floor((values.length - 1) * pct)));
            return values[index];
        }

        function normalizeGaussianSplatSizes(root, modelScale) {
            const records = [];
            const seen = new Set();
            root.traverse((node) => {
                const sourceGeometry = node.userData.sourceGeometry || node.geometry;
                const sizeAttr = sourceGeometry?.attributes?.splatSize;
                if (!sizeAttr || seen.has(sizeAttr.array)) return;
                seen.add(sizeAttr.array);
                records.push({
                    sizeAttr,
                    scaleAttr: sourceGeometry.attributes.splatScale || null,
                    renderer: node.userData.isGaussianSplatRenderer ? node : null
                });
            });
            if (!records.length) return;

            const samples = [];
            records.forEach(({ sizeAttr }) => {
                const stride = Math.max(1, Math.floor(sizeAttr.array.length / 20000));
                for (let i = 0; i < sizeAttr.array.length; i += stride) {
                    const size = sizeAttr.array[i] * modelScale;
                    if (Number.isFinite(size) && size > 0) samples.push(size);
                }
            });

            const reference = percentile(samples, 0.75) || GAUSSIAN_REFERENCE_RADIUS;
            const normalization = GAUSSIAN_REFERENCE_RADIUS / reference;
            records.forEach(({ sizeAttr, scaleAttr, renderer }) => {
                if (scaleAttr) {
                    for (let i = 0; i < sizeAttr.array.length; i++) {
                        const sx = clamp(scaleAttr.array[i * 3] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        const sy = clamp(scaleAttr.array[i * 3 + 1] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        const sz = clamp(scaleAttr.array[i * 3 + 2] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                        scaleAttr.array[i * 3] = sx;
                        scaleAttr.array[i * 3 + 1] = sy;
                        scaleAttr.array[i * 3 + 2] = sz;
                        sizeAttr.array[i] = Math.max(sx, sy, sz);
                    }
                    scaleAttr.needsUpdate = true;
                } else {
                    for (let i = 0; i < sizeAttr.array.length; i++) {
                        sizeAttr.array[i] = clamp(sizeAttr.array[i] * modelScale * normalization, GAUSSIAN_MIN_RADIUS, GAUSSIAN_MAX_RADIUS);
                    }
                }
                sizeAttr.needsUpdate = true;
                if (renderer) renderer.userData.needsSort = true;
            });
        }

        function installPointCloudRoot(root, rawBox, scale, gaussianRoot = null) {
            const center = rawBox.getCenter(new THREE.Vector3());
            const pointWrapper = new THREE.Group();
            if (gaussianRoot) normalizeGaussianSplatSizes(gaussianRoot, scale);

            root.position.copy(center).negate();
            pointWrapper.add(root);
            setWrapperBaseScale(pointWrapper, scale);
            pointGroup.add(pointWrapper);

            let gaussianWrapper = null;
            if (gaussianRoot) {
                gaussianWrapper = new THREE.Group();
                gaussianRoot.position.copy(center).negate();
                gaussianWrapper.add(gaussianRoot);
                setWrapperBaseScale(gaussianWrapper, scale);
                gaussianGroup.add(gaussianWrapper);
            }

            activeWrappers.visual = pointWrapper;
            activeWrappers.back = null;
            activeWrappers.front = null;
            activeWrappers.points = pointWrapper;
            activeWrappers.gaussian = gaussianWrapper;
        }

        function installMeshRoot(root, rawBox, scale) {
            const center = rawBox.getCenter(new THREE.Vector3());

            const visWrapper = new THREE.Group();
            root.position.copy(center).negate();
            visWrapper.add(root);
            setWrapperBaseScale(visWrapper, scale);

            const backWrapper = new THREE.Group();
            const backRoot = root.clone();
            backWrapper.add(backRoot);
            setWrapperBaseScale(backWrapper, scale);

            const frontWrapper = new THREE.Group();
            const frontRoot = root.clone();
            frontWrapper.add(frontRoot);
            setWrapperBaseScale(frontWrapper, scale);

            const pointWrapper = new THREE.Group();
            pointWrapper.position.copy(visWrapper.position);
            pointWrapper.rotation.copy(visWrapper.rotation);
            setWrapperBaseScale(pointWrapper, scale);

            const setupStencil = (mesh, mat) => {
                mesh.material = mat;
                mesh.material.clippingPlanes = [clippingPlane];
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                mesh.frustumCulled = false;
            };
            backRoot.traverse((o) => { if (o.isMesh) setupStencil(o, backMat); });
            frontRoot.traverse((o) => { if (o.isMesh) setupStencil(o, frontMat); });
            root.traverse((o) => {
                if (o.isMesh) {
                    applyToMaterials(o.material, (material) => {
                        material.clippingPlanes = [clippingPlane];
                        material.side = THREE.DoubleSide;
                    });
                }
            });

            const getMeshArea = (mesh) => {
                if(!mesh.geometry.attributes.position) return 0;
                const idx = mesh.geometry.index;
                const pos = mesh.geometry.attributes.position;
                let a = 0;
                const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
                const ab = new THREE.Vector3(), ac = new THREE.Vector3();
                const total = Math.floor((idx ? idx.count : pos.count) / 3) * 3;
                const vertexIndex = (offset) => idx ? idx.getX(offset) : offset;
                for(let i=0; i<total; i+=3) {
                    va.fromBufferAttribute(pos, vertexIndex(i));
                    vb.fromBufferAttribute(pos, vertexIndex(i+1));
                    vc.fromBufferAttribute(pos, vertexIndex(i+2));
                    ab.subVectors(vb, va);
                    ac.subVectors(vc, va);
                    a += ab.cross(ac).length() * 0.5;
                }
                return a;
            };

            const pointRoot = root.clone();
            let cloneTotalArea = 0;
            const cloneList = [];

            pointRoot.traverse(o => {
                if(o.isMesh && o.geometry) {
                    const area = getMeshArea(o);
                    if (area > 0) {
                        cloneTotalArea += area;
                        cloneList.push({obj: o, area: area});
                    }
                }
            });

            if (cloneTotalArea > 0) {
                cloneList.forEach(item => {
                    const ratio = item.area / cloneTotalArea;
                    const count = Math.floor(MAX_POINTS * ratio);
                    if(count > 0) {
                        const sourceMaterial = Array.isArray(item.obj.material) ? item.obj.material[0] : item.obj.material;
                        const sampledGeo = createSamplingGeometry(item.obj, count);
                        const mat = createPointMaterial(sourceMaterial?.map, sourceMaterial?.color || 0xffffff, !!sampledGeo.attributes.color, !!sampledGeo.attributes.uv);
                        pointMaterials.push(mat);

                        const maxCount = preparePreviewDensityGeometry(sampledGeo);
                        const p = new THREE.Points(sampledGeo, mat);
                        p.userData.maxCount = maxCount;

                        item.obj.geometry = sampledGeo;
                        item.obj.material = mat;
                        const parent = item.obj.parent;
                        if(parent) {
                            p.position.copy(item.obj.position);
                            p.rotation.copy(item.obj.rotation);
                            p.scale.copy(item.obj.scale);
                            p.matrixAutoUpdate = true;
                            parent.add(p);
                            parent.remove(item.obj);
                        }
                    }
                });
            }

            pointRoot.traverse(o => { if(o.isMesh) o.visible = false; });

            pointWrapper.add(pointRoot);

            visualGroup.add(visWrapper);
            stencilGroup.add(backWrapper);
            stencilGroup.add(frontWrapper);
            pointGroup.add(pointWrapper);

            activeWrappers.visual = visWrapper;
            activeWrappers.back = backWrapper;
            activeWrappers.front = frontWrapper;
            activeWrappers.points = pointWrapper;
            activeWrappers.gaussian = null;
        }

        function installImportedRoot(root, isPointCloud, gaussianRoot, status, statusText, spinner) {
            if (!root) {
                setLoadingError(statusText, spinner, "Unsupported import.");
                return;
            }

            root.updateMatrixWorld(true);
            const rawBox = new THREE.Box3().setFromObject(root);

            if (rawBox.isEmpty()) {
                disposeObject(root);
                setLoadingError(statusText, spinner, "Warning: Empty model.");
                return;
            }

            const size = rawBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1.0;
            const scale = 2 / maxDim;

            if (isPointCloud) installPointCloudRoot(root, rawBox, scale, gaussianRoot);
            else installMeshRoot(root, rawBox, scale);

            finishModelLoad(status, statusText, spinner);
        }

        function loadModel(url, fileName = '') {
            const loadId = ++modelLoadId;
            const extension = getImportExtension(url, fileName);
            const loader = createImportLoader(extension);
            const status = document.getElementById('loading-status');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('loading-spinner');

            status.classList.remove('hidden');
            statusText.classList.remove('text-red-500');
            statusText.classList.add('text-amber-400');
            spinner.classList.remove('hidden');
            statusText.textContent = "Loading...";

            if (!loader) {
                setLoadingError(statusText, spinner, "Unsupported file type.");
                return;
            }

            loader.load(url, (asset) => {
                if (loadId !== modelLoadId) {
                    disposeLoadedAsset(asset, extension);
                    return;
                }

                clearGroup(visualGroup);
                clearGroup(stencilGroup);
                clearGroup(pointGroup);
                clearGroup(gaussianGroup);

                pointMaterials = [];
                gaussianMaterials = [];
                activeWrappers = { visual: null, back: null, front: null, points: null, gaussian: null };

                const imported = normalizeImportedAsset(asset, extension, getImportMode());
                if (imported.preferGaussian && getImportMode() !== 'points') {
                    renderStyle = 'gaussian';
                }
                installImportedRoot(imported.root, imported.isPointCloud, imported.gaussianRoot, status, statusText, spinner);

            }, undefined, (e) => {
                if (loadId !== modelLoadId) return;
                console.error(e);
                setLoadingError(statusText, spinner, "Error loading model.");
            });
        }
        
        function setPointDrawFraction(fraction) {
            pointDrawFraction = clamp(finiteNumber(fraction, DEFAULT_POINT_DENSITY), 0.01, 1.0);
            pointGroup.traverse(o => {
                if(o.isPoints && o.userData.maxCount) {
                    const count = Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    o.geometry.setDrawRange(0, count);
                }
            });
            gaussianGroup.traverse(o => {
                if (o.userData.isGaussianSplatRenderer && o.userData.maxCount) {
                    const count = Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    setGaussianRendererDrawCount(o, count);
                } else if(o.isPoints && o.userData.maxCount) {
                    const count = Math.max(1, Math.floor(o.userData.maxCount * pointDrawFraction));
                    o.geometry.setDrawRange(0, count);
                }
            });
            return pointDrawFraction;
        }

        function updatePointDensity() {
            const pct = setPointDrawFraction(document.getElementById('point-count').value);
            document.getElementById('point-count-val').textContent = Math.round(pct * 100) + '%';
        }

        function setFullPointCloudVisible(visible) {
            showFullPointCloud = visible;
            const planes = showFullPointCloud ? [] : [slabPlaneTop, slabPlaneBottom];
            pointMaterials.forEach((material) => {
                material.clippingPlanes = planes;
                material.needsUpdate = true;
            });
            gaussianMaterials.forEach((material) => {
                material.clippingPlanes = planes;
                material.needsUpdate = true;
            });
            updatePlaneHeight(document.getElementById('slice-slider').value);
        }
        
        function updateBounds() {
            if (!activeWrappers.visual) return;
            activeWrappers.visual.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(activeWrappers.visual);
            const height = box.max.y - box.min.y;
            const buffer = height * 0.1;
            modelBounds.min = box.min.y - buffer;
            modelBounds.max = box.max.y + buffer;
            const slider = document.getElementById('slice-slider');
            slider.min = modelBounds.min;
            slider.max = modelBounds.max;
            slider.step = height / 1000;
        }

        function updateOrientation() {
            if (!activeWrappers.visual) return;
            flipModelVertical = document.getElementById('flip-model').checked;
            const euler = getOrientationEuler();
            forEachActiveWrapper((wrapper) => applyWrapperTransform(wrapper, euler));
            gaussianGroup.traverse((node) => {
                if (node.userData.isGaussianSplatRenderer) node.userData.needsSort = true;
            });
            
            updateBounds();
            if (!isAnimate) {
                const currentY = finiteNumber(document.getElementById('slice-slider').value, 0);
                updatePlaneHeight(currentY);
            }
        }
        
        window.resetOrientation = function() {
            resetOrientationUI();
            updateOrientation();
        }
        
        function resetOrientationUI() {
            ['x', 'y', 'z'].forEach(axis => {
                document.getElementById(`rot-${axis}`).value = 0;
                document.getElementById(`num-rot-${axis}`).value = 0;
            });
        }
        
        window.toggleMesh = function(visible) {
            if (visualGroup) visualGroup.visible = visible;
        }
        
        window.toggleOutlineMode = function(isOutline) {
            outlineMode = isOutline;
            const settings = document.getElementById('outline-settings');
            if(isOutline) settings.classList.remove('hidden');
            else settings.classList.add('hidden');
        }
        
        window.setRenderStyle = function(style) {
            if (style === 'mesh' && activeWrappers.visual && (!activeWrappers.back || !activeWrappers.front)) {
                style = 'points';
            }
            if (style === 'gaussian' && !activeWrappers.gaussian) {
                style = 'points';
            }
            renderStyle = style;
            const btnMesh = document.getElementById('style-mesh');
            const btnPoints = document.getElementById('style-points');
            const btnGaussian = document.getElementById('style-gaussian');
            const meshOpts = document.getElementById('mesh-options');
            const pointOpts = document.getElementById('point-options');

            btnMesh.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";
            btnPoints.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";
            btnGaussian.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";

            if (style === 'mesh') {
                btnMesh.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                meshOpts.classList.remove('hidden');
                pointOpts.classList.add('hidden');
                
                pointGroup.visible = false;
                gaussianGroup.visible = false;
                visualGroup.visible = document.getElementById('show-mesh').checked;
                stencilGroup.visible = true;
                capGroup.visible = true;
            } else if (style === 'gaussian') {
                btnGaussian.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                pointOpts.classList.remove('hidden');
                meshOpts.classList.add('hidden');

                pointGroup.visible = false;
                gaussianGroup.visible = true;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;

                updatePlaneHeight(document.getElementById('slice-slider').value);
            } else {
                btnPoints.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                pointOpts.classList.remove('hidden');
                meshOpts.classList.add('hidden');

                pointGroup.visible = true;
                gaussianGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;

                updatePlaneHeight(document.getElementById('slice-slider').value);
            }
        }
        function updateFrameHelper() {
            if (!frameHelper) return;
            const w = Math.max(2, finiteInteger(document.getElementById('export-w').value, 1080));
            const h = Math.max(2, finiteInteger(document.getElementById('export-h').value, 1080));
            const aspect = w / h;
            const visHeight = FRUSTUM_SIZE * captureScale;
            const visWidth = visHeight * aspect;
            frameHelper.scale.set(visWidth, visHeight, 1);
            frameHelper.position.y = finiteNumber(document.getElementById('slice-slider').value, 0);
            frameHelper.visible = document.getElementById('show-frame').checked;
        }

        function updateExportButtonLabel() {
            const format = document.getElementById('export-format').value;
            const label = format === 'png-sequence' ? 'Export PNG Frames (.zip)' : 'Offline Render (MP4)';
            document.getElementById('export-button-label').textContent = label;
        }

        function getExportSettings() {
            return {
                format: document.getElementById('export-format').value,
                width: evenPositiveInteger(document.getElementById('export-w').value, 1080),
                height: evenPositiveInteger(document.getElementById('export-h').value, 1080),
                duration: clamp(finiteInteger(document.getElementById('export-duration').value, 5), 1, 60),
                fps: clamp(finiteInteger(document.getElementById('export-fps').value, 60), 1, 120)
            };
        }

        function prepareExportRenderState(width, height) {
            renderer.setPixelRatio(1);
            renderer.setSize(width, height);
            disposeRenderTarget();

            renderTarget = new THREE.WebGLRenderTarget(width, height, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });
            postMaterial.uniforms.uResolution.value.set(width, height);

            activeCamera = orthoCamera;
            const aspect = width / height;
            const fH = FRUSTUM_SIZE * captureScale;
            const fW = fH * aspect;
            orthoCamera.left = -fW / 2;
            orthoCamera.right = fW / 2;
            orthoCamera.top = fH / 2;
            orthoCamera.bottom = -fH / 2;
            orthoCamera.zoom = 1;
            orthoCamera.updateProjectionMatrix();
            orthoCamera.position.set(0, 10, 0);
            orthoCamera.lookAt(0, 0, 0);

            frameHelper.visible = false;
            if (renderStyle === 'mesh') {
                visualGroup.visible = false;
                pointGroup.visible = false;
                gaussianGroup.visible = false;
            } else if (renderStyle === 'gaussian') {
                gaussianGroup.visible = true;
                pointGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;
                setPointDrawFraction(EXPORT_POINT_DENSITY);
            } else {
                pointGroup.visible = true;
                gaussianGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;
                setPointDrawFraction(EXPORT_POINT_DENSITY);
            }
        }

        function renderPointExportFrame() {
            renderer.setRenderTarget(null);
            renderer.autoClear = true;
            renderer.clear(true, true, true);
            renderer.render(scene, activeCamera);
            renderer.getContext().flush();
        }

        function renderExportFrame(progress) {
            pointMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = 1.0;
                m.uniforms.uOrthoZoom.value = 1.0;
            });
            gaussianMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = 1.0;
                m.uniforms.uOrthoZoom.value = 1.0;
                m.uniforms.uViewport.value.set(renderer.domElement.width, renderer.domElement.height);
            });

            const yPos = THREE.MathUtils.lerp(modelBounds.min, modelBounds.max, progress);
            updatePlaneHeight(yPos);

            if (renderStyle === 'mesh') {
                performMultiPassRender();
            } else {
                if (renderStyle === 'gaussian') updateGaussianDepthSorting(true);
                renderPointExportFrame();
            }
        }

        function updateExportProgress(progress, percentEl, barEl) {
            const pct = Math.round(progress * 100) + '%';
            percentEl.textContent = pct;
            barEl.style.width = pct;
        }

        function canvasToPngBlob() {
            return new Promise((resolve, reject) => {
                renderer.domElement.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('Could not capture PNG frame.'));
                }, 'image/png');
            });
        }

        // --- OFFLINE RENDERING LOGIC ---
        async function startExport() {
            if (isProcessingVideo) return;

            const settings = getExportSettings();
            if (settings.format === 'mp4' && typeof VideoEncoder === 'undefined') {
                alert("Your browser does not support WebCodecs.");
                return;
            }

            const maxTex = renderer.capabilities.maxTextureSize;
            if(settings.width > maxTex || settings.height > maxTex) {
                alert(`Resolution too high. Maximum texture size is ${maxTex}px.`);
                return;
            }

            const wasFrameVisible = frameHelper.visible;
            const wasMeshVisible = visualGroup.visible;
            const previousPointDrawFraction = pointDrawFraction;
            let didPrepareRenderState = false;

            isProcessingVideo = true;

            try {
                // Save State
                preExportState.width = window.innerWidth;
                preExportState.height = window.innerHeight;
                preExportState.pixelRatio = renderer.getPixelRatio();
                didPrepareRenderState = true;

                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;

                document.getElementById('rec-overlay').classList.remove('hidden');
                const percentEl = document.getElementById('rec-percentage');
                const barEl = document.getElementById('rec-progress-bar');
                updateExportProgress(0, percentEl, barEl);

                prepareExportRenderState(settings.width, settings.height);

                if (settings.format === 'png-sequence') {
                    await exportPngSequence(settings, percentEl, barEl);
                } else {
                    await exportMp4(settings, percentEl, barEl);
                }
            } catch (e) {
                console.error("Export failed:", e);
                alert("Export failed.");
            } finally {
                if (didPrepareRenderState) {
                    restoreState(wasFrameVisible, wasMeshVisible);
                } else {
                    document.getElementById('rec-overlay').classList.add('hidden');
                }
                isProcessingVideo = false;
                setPointDrawFraction(previousPointDrawFraction);
            }
        }

        async function exportMp4(settings, percentEl, barEl) {
            const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/+esm');
            const muxer = new Muxer({
                target: new ArrayBufferTarget(),
                video: { codec: 'avc', width: settings.width, height: settings.height },
                fastStart: 'in-memory'
            });
            const videoEncoder = new VideoEncoder({
                output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                error: e => { console.error("Encoding error:", e); isProcessingVideo = false; }
            });

            const pixelCount = settings.width * settings.height;
            const codec = pixelCount > 2228224 ? 'avc1.4d0033' : 'avc1.4d002a';
            const targetBitrate = clamp(Math.round(pixelCount * settings.fps * 0.35), 24_000_000, 140_000_000);
            const encoderConfig = {
                codec,
                width: settings.width,
                height: settings.height,
                bitrate: targetBitrate,
                framerate: settings.fps,
                latencyMode: 'quality'
            };

            try {
                videoEncoder.configure(encoderConfig);
            } catch (e) {
                delete encoderConfig.latencyMode;
                videoEncoder.configure(encoderConfig);
            }

            const totalFrames = Math.max(1, settings.fps * settings.duration);
            const frameDurationUs = 1e6 / settings.fps;

            for (let i = 0; i < totalFrames; i++) {
                if (!isProcessingVideo || videoEncoder.state === 'closed') break;

                const progress = totalFrames === 1 ? 0 : i / (totalFrames - 1);
                renderExportFrame(progress);

                const timestamp = i * frameDurationUs;
                const frame = new VideoFrame(renderer.domElement, { timestamp: timestamp });
                videoEncoder.encode(frame, { keyFrame: renderStyle === 'points' || renderStyle === 'gaussian' || i % settings.fps === 0 });
                frame.close();

                updateExportProgress(progress, percentEl, barEl);

                if (i % 5 === 0) await new Promise(resolve => requestAnimationFrame(resolve));
            }

            if (videoEncoder.state !== 'closed') {
                await videoEncoder.flush();
            }
            muxer.finalize();

            const { buffer } = muxer.target;
            const blob = new Blob([buffer], { type: 'video/mp4' });
            downloadBlob(blob, `slice_render_${settings.width}x${settings.height}_${settings.fps}fps.mp4`);
        }

        async function exportPngSequence(settings, percentEl, barEl) {
            const JSZip = await loadJSZip();
            const zip = new JSZip();
            const folder = zip.folder('frames');
            const totalFrames = Math.max(1, settings.fps * settings.duration);
            const digits = String(totalFrames - 1).length;

            for (let i = 0; i < totalFrames; i++) {
                if (!isProcessingVideo) break;

                const progress = totalFrames === 1 ? 0 : i / (totalFrames - 1);
                renderExportFrame(progress);

                const blob = await canvasToPngBlob();
                const filename = `frame_${String(i).padStart(digits, '0')}.png`;
                folder.file(filename, blob, { binary: true, compression: 'STORE' });

                updateExportProgress(progress, percentEl, barEl);

                if (i % 3 === 0) await new Promise(resolve => requestAnimationFrame(resolve));
            }

            const zipBlob = await zip.generateAsync({
                type: 'blob',
                compression: 'STORE',
                streamFiles: true
            }, (metadata) => {
                const progress = clamp(metadata.percent / 100, 0, 1);
                updateExportProgress(progress, percentEl, barEl);
            });

            downloadBlob(zipBlob, `slice_frames_${settings.width}x${settings.height}_${settings.fps}fps.zip`);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            revokeBlobUrl(activeDownloadUrl);
            activeDownloadUrl = url;
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => {
                revokeBlobUrl(url);
                if (activeDownloadUrl === url) activeDownloadUrl = null;
            }, 10000);
        }

        function restoreState(restoreFrame, restoreMesh) {
            renderer.setPixelRatio(preExportState.pixelRatio);
            renderer.setSize(preExportState.width, preExportState.height);
            
            disposeRenderTarget();

            const w = preExportState.width;
            const h = preExportState.height;
            renderTarget = new THREE.WebGLRenderTarget(w * preExportState.pixelRatio, h * preExportState.pixelRatio, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });
            postMaterial.uniforms.uResolution.value.set(w * preExportState.pixelRatio, h * preExportState.pixelRatio);

            onWindowResize(); 
            document.getElementById('rec-overlay').classList.add('hidden');

            if (viewMode === '3d') setMode('3d'); else setMode('2d');
            setRenderStyle(renderStyle);
            if(frameHelper) frameHelper.visible = restoreFrame;
            if (typeof restoreMesh !== 'undefined' && renderStyle === 'mesh') {
                visualGroup.visible = restoreMesh;
                document.getElementById('show-mesh').checked = restoreMesh;
            } else {
                document.getElementById('show-mesh').checked = visualGroup.visible;
            }
        }

        function updatePlaneHeight(val) {
            const fallback = finiteNumber(document.getElementById('slice-slider').value, 0);
            const v = clamp(finiteNumber(val, fallback), modelBounds.min, modelBounds.max);
            // Mesh Slice
            clippingPlane.constant = v;
            capMesh.position.y = v;
            
            // Point Slab
            const half = sliceThickness / 2;
            slabPlaneBottom.constant = -v + half;
            slabPlaneTop.constant = v + half;
            
            if(!isProcessingVideo) {
                const slider = document.getElementById('slice-slider');
                if (document.activeElement !== slider) slider.value = v;
                const input = document.getElementById('slice-input');
                if (document.activeElement !== input) input.value = v.toFixed(2);
            }
        }

        function setupUI() {
            document.getElementById('slice-slider').addEventListener('input', (e) => {
                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;
                updatePlaneHeight(e.target.value);
            });
            document.getElementById('slice-input').addEventListener('input', (e) => {
                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;
                updatePlaneHeight(e.target.value);
            });
            document.getElementById('anim-toggle').addEventListener('change', (e) => isAnimate = e.target.checked);
            document.getElementById('speed-slider').addEventListener('input', (e) => scanSpeed = clamp(finiteNumber(e.target.value, scanSpeed), 0.1, 2.0));
            document.getElementById('btn-3d').addEventListener('click', () => setMode('3d'));
            document.getElementById('btn-2d').addEventListener('click', () => setMode('2d'));
            document.getElementById('btn-export').addEventListener('click', startExport);
            document.getElementById('export-format').addEventListener('change', updateExportButtonLabel);
            document.getElementById('btn-reset').addEventListener('click', () => {
                revokeActiveUploadUrl();
                loadModel(DEFAULT_MODEL);
            });
            document.getElementById('flip-model').addEventListener('change', (e) => {
                flipModelVertical = e.target.checked;
                updateOrientation();
            });
            
            ['x', 'y', 'z'].forEach(axis => {
                const slider = document.getElementById(`rot-${axis}`);
                const number = document.getElementById(`num-rot-${axis}`);
                slider.addEventListener('input', () => { number.value = slider.value; updateOrientation(); });
                number.addEventListener('input', () => {
                    const val = clamp(finiteNumber(number.value, 0), 0, 360);
                    number.value = val;
                    slider.value = val; updateOrientation();
                });
            });
            
            document.getElementById('outline-mode').addEventListener('change', (e) => toggleOutlineMode(e.target.checked));
            document.getElementById('outline-width').addEventListener('input', (e) => {
                outlineWidth = clamp(finiteNumber(e.target.value, outlineWidth), 1, 10);
                postMaterial.uniforms.uOutlineWidth.value = outlineWidth;
                document.getElementById('outline-val').textContent = outlineWidth.toFixed(0) + ' px';
            });
            
            // Point UI
            document.getElementById('point-size').addEventListener('input', (e) => {
                pointSize = clamp(finiteNumber(e.target.value, pointSize), POINT_SIZE_MIN, POINT_SIZE_MAX);
                document.getElementById('point-size-val').textContent = pointSize.toFixed(2);
                pointMaterials.forEach(m => m.uniforms.size.value = pointSize);
                gaussianMaterials.forEach(m => m.uniforms.size.value = pointSize);
            });
            document.getElementById('point-count').addEventListener('input', (e) => {
                updatePointDensity();
            });
            document.getElementById('point-thick').addEventListener('input', (e) => {
                sliceThickness = clamp(finiteNumber(e.target.value, sliceThickness), SLICE_THICKNESS_MIN, SLICE_THICKNESS_MAX);
                document.getElementById('point-thick-val').textContent = sliceThickness.toFixed(3);
                updatePlaneHeight(document.getElementById('slice-slider').value);
            });
            document.getElementById('show-full-cloud').addEventListener('change', (e) => {
                setFullPointCloudVisible(e.target.checked);
            });

            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                captureScale = clamp(finiteNumber(e.target.value, captureScale), 0.2, 2.0);
                document.getElementById('zoom-val').textContent = captureScale.toFixed(1) + 'x';
                document.getElementById('show-frame').checked = true;
                updateFrameHelper();
            });
            document.getElementById('show-frame').addEventListener('change', updateFrameHelper);
            document.getElementById('export-w').addEventListener('input', updateFrameHelper);
            document.getElementById('export-h').addEventListener('input', updateFrameHelper);
            document.getElementById('file-input').addEventListener('change', (e) => {
                if(e.target.files[0]) {
                    const file = e.target.files[0];
                    revokeActiveUploadUrl();
                    activeUploadUrl = URL.createObjectURL(file);
                    loadModel(activeUploadUrl, file.name);
                    e.target.value = '';
                }
            });
            updateExportButtonLabel();
        }

        function setMode(mode) {
            viewMode = mode;
            const b3 = document.getElementById('btn-3d');
            const b2 = document.getElementById('btn-2d');
            const projToggle = document.getElementById('projection-toggle');
            const meshCheckbox = document.getElementById('show-mesh');

            if (mode === '3d') {
                b3.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                b2.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800";
                
                // Show toggle
                projToggle.classList.remove('hidden');
                
                if (isOrtho3D) {
                    activeCamera = orthoCamera3D;
                } else {
                    activeCamera = perspectiveCamera;
                }
                
                activeCamera.position.set(3, 2, 4);
                activeCamera.lookAt(0,0,0);
                controls.object = activeCamera;
                controls.enabled = true;
                controls.enableRotate = true;
                controls.enableZoom = true;
                
                if (renderStyle === 'mesh') {
                    meshCheckbox.checked = true;
                    visualGroup.visible = true; 
                }
            } else {
                b2.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                b3.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800";
                
                // Hide toggle in 2D
                projToggle.classList.add('hidden');

                activeCamera = orthoCamera;
                activeCamera.position.set(0, 10, 0); 
                activeCamera.lookAt(0,0,0);
                activeCamera.zoom = 1; 
                activeCamera.updateProjectionMatrix();
                controls.object = activeCamera;
                controls.enabled = true;
                controls.enableRotate = false; 
                controls.enableZoom = true;    
                controls.enablePan = true;
                
                if (renderStyle === 'mesh') {
                    meshCheckbox.checked = false;
                    visualGroup.visible = false; 
                }
            }
        }
        
        window.toggle3DProjection = function(isOrtho) {
            isOrtho3D = isOrtho;
            if (viewMode !== '3d') return; 

            const target = controls.target.clone();
            
            if (isOrtho) {
                // Switch to Ortho
                activeCamera = orthoCamera3D;
                // Sync View based on current perspective camera
                const dist = perspectiveCamera.position.distanceTo(target);
                const vFOV = perspectiveCamera.fov * Math.PI / 180;
                const height = 2 * dist * Math.tan(vFOV / 2);
                const width = height * perspectiveCamera.aspect;
                
                orthoCamera3D.left = -width / 2;
                orthoCamera3D.right = width / 2;
                orthoCamera3D.top = height / 2;
                orthoCamera3D.bottom = -height / 2;
                orthoCamera3D.zoom = 1; 
                orthoCamera3D.updateProjectionMatrix();
                
                orthoCamera3D.position.copy(perspectiveCamera.position);
                orthoCamera3D.quaternion.copy(perspectiveCamera.quaternion);
            } else {
                // Switch to Perspective
                activeCamera = perspectiveCamera;
                perspectiveCamera.position.copy(orthoCamera3D.position);
                perspectiveCamera.quaternion.copy(orthoCamera3D.quaternion);
            }
            
            controls.object = activeCamera;
            controls.update();
        }

        window.setCapColor = function(hexStr) {
            sliceColor.set(hexStr);
            postMaterial.uniforms.uColor.value.set(hexStr);
        }
        
        window.togglePanel = function() {
            const content = document.getElementById('panel-content');
            const btn = document.getElementById('minimize-btn');
            isPanelOpen = !isPanelOpen;
            if(isPanelOpen) {
                content.style.display = 'block';
                btn.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                btn.style.transform = 'rotate(180deg)';
            }
        }

        function onWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const aspect = w / h;
            perspectiveCamera.aspect = aspect;
            perspectiveCamera.updateProjectionMatrix();
            const fH = FRUSTUM_SIZE; 
            const fW = fH * aspect;
            orthoCamera.left = -fW / 2;
            orthoCamera.right = fW / 2;
            orthoCamera.top = fH / 2;
            orthoCamera.bottom = -fH / 2;
            orthoCamera.updateProjectionMatrix();
            if (orthoCamera3D) {
                const h3d = orthoCamera3D.top - orthoCamera3D.bottom;
                const w3d = h3d * aspect;
                orthoCamera3D.left = -w3d / 2;
                orthoCamera3D.right = w3d / 2;
                orthoCamera3D.updateProjectionMatrix();
            }
            
            renderer.setSize(w, h);
            if (renderTarget) {
                renderTarget.setSize(w * window.devicePixelRatio, h * window.devicePixelRatio);
                postMaterial.uniforms.uResolution.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
            }
            
            updateFrameHelper();
        }

        init();
    </script>
</body>
