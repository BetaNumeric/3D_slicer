            ['x', 'y', 'z'].forEach(axis => {
                const el = document.getElementById(`pos-model-${axis}`);
                if (el) el.value = 0;
            });
            updateOrientation();

            const box = new THREE.Box3().setFromObject(getBoundsWrapper());
            if (box.isEmpty()) return;
            
            const center = new THREE.Vector3();
            box.getCenter(center);
            
            const baseScale = activeWrappers.visual.userData.baseScale || 1;
            const tx = -center.x / baseScale;
            const ty = -center.y / baseScale;
            const tz = -center.z / baseScale;

            ['x', 'y', 'z'].forEach(axis => {
                const val = axis === 'x' ? tx : (axis === 'y' ? ty : tz);
                const fixed = val.toFixed(2);
                const slider = document.getElementById(`pos-model-${axis}`);
                if (slider) slider.value = fixed;
                const num = document.getElementById(`num-pos-model-${axis}`);
                if (num) num.value = fixed;
            });
            
            updateOrientation();
        }
        
        window.toggleMesh = function(visible) {
            if (visualGroup) visualGroup.visible = visible;
        }
        
        window.toggleOutlineMode = function(isOutline) {
            outlineMode = isOutline;
            const settings = document.getElementById('outline-settings');
            if(isOutline) settings.classList.remove('hidden');
            else settings.classList.add('hidden');
        }
        
        window.setRenderStyle = function(style) {
            if (style === 'mesh' && activeWrappers.visual && (!activeWrappers.back || !activeWrappers.front)) {
                style = 'points';
            }
            if (style === 'gaussian' && !activeWrappers.gaussian) {
                style = 'points';
            }
            renderStyle = style;
            const btnMesh = document.getElementById('style-mesh');
            const btnPoints = document.getElementById('style-points');
            const btnGaussian = document.getElementById('style-gaussian');
            const meshOpts = document.getElementById('mesh-options');
            const pointOpts = document.getElementById('point-options');

            btnMesh.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";
            btnPoints.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";
            btnGaussian.className = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";

            if (style === 'mesh') {
                btnMesh.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                meshOpts.classList.remove('hidden');
                pointOpts.classList.add('hidden');
                
                pointGroup.visible = false;
                gaussianGroup.visible = false;
                visualGroup.visible = document.getElementById('show-mesh').checked;
                stencilGroup.visible = true;
                capGroup.visible = true;
            } else if (style === 'gaussian') {
                btnGaussian.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                pointOpts.classList.remove('hidden');
                meshOpts.classList.add('hidden');

                pointGroup.visible = false;
                gaussianGroup.visible = true;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;

                updatePlaneHeight(document.getElementById('slice-slider').value);
            } else {
                btnPoints.className = "text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow";
                pointOpts.classList.remove('hidden');
                meshOpts.classList.add('hidden');

                pointGroup.visible = true;
                gaussianGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;

                updatePlaneHeight(document.getElementById('slice-slider').value);
            }
            updateBounds();
            updatePlaneHeight(document.getElementById('slice-slider').value);
            if (!cropEnabled) fitCropBoxToModel();
            updateCropHelperVisibility();
        }
        function updateFrameHelper() {
            if (!frameHelper) return;
            const w = Math.max(2, finiteInteger(document.getElementById('export-w').value, 1080));
            const h = Math.max(2, finiteInteger(document.getElementById('export-h').value, 1080));
            const aspect = w / h;
            const visHeight = FRUSTUM_SIZE * captureScale;
            const visWidth = visHeight * aspect;
            frameHelper.scale.set(visWidth, visHeight, 1);
            setObjectSlicePosition(frameHelper, finiteNumber(document.getElementById('slice-slider').value, 0));
            frameHelper.visible = document.getElementById('show-frame').checked;
        }

        function updateExportButtonLabel() {
            const format = document.getElementById('export-format').value;
            const label = format === 'png-sequence' ? 'Export PNG Frames (.zip)' : 'Offline Render (MP4)';
            document.getElementById('export-button-label').textContent = label;
        }

        function getTotalExportFrames(settings) {
            return Math.max(1, Math.round(settings.fps * settings.duration));
        }

        function applyMotionProfile(baseProgress, profile) {
            const t = clamp(baseProgress, 0, 1);
            if (profile === 'reverse') return 1 - t;
            if (profile === 'pingpong') return t <= 0.5 ? t * 2 : (1 - t) * 2;
            return t;
        }

        function resolveExportRenderStyle(sliceMode) {
            const warnings = [];
            if (sliceMode === 'filled') {
                if (activeWrappers.back && activeWrappers.front) return { renderStyle: 'mesh', warnings };
                warnings.push('Filled mesh slices were requested, but this import has no mesh volume; exported surface slabs instead.');
                return { renderStyle: activeWrappers.gaussian ? 'gaussian' : 'points', warnings };
            }
            if (sliceMode === 'surface') return { renderStyle: 'points', warnings };
            if (sliceMode === 'gaussian') {
                if (activeWrappers.gaussian) return { renderStyle: 'gaussian', warnings };
                warnings.push('Gaussian surface slabs were requested, but this import has no Gaussian splats; exported point slabs instead.');
                return { renderStyle: 'points', warnings };
            }
            return { renderStyle, warnings };
        }

        function estimateExportBytes(settings) {
            const frames = getTotalExportFrames(settings);
            if (settings.format === 'png-sequence') return settings.width * settings.height * 4 * frames;
            return Math.max(0, (settings.estimatedBitrate || 0) * settings.duration / 8);
        }

        function getExportFrameInfo(index, settings) {
            const totalFrames = getTotalExportFrames(settings);
            const blankFrames = clamp(settings.blankFrames, 0, Math.max(0, Math.floor((totalFrames - 1) / 2)));
            const activeFrames = Math.max(1, totalFrames - blankFrames * 2);
            const blank = index < blankFrames || index >= totalFrames - blankFrames;
            const timeSeconds = index / settings.fps;

            if (blank) {
                return {
                    index,
                    timeSeconds,
                    blank: true,
                    sweepProgress: null,
                    sliceProgress: null,
                    sliceValueModelUnits: null,
                    physicalPositionMm: null
                };
            }

            const activeIndex = index - blankFrames;
            const baseProgress = activeFrames === 1 ? 0 : activeIndex / (activeFrames - 1);
            const profileProgress = applyMotionProfile(baseProgress, settings.motionProfile);
            const sliceValueModelUnits = THREE.MathUtils.lerp(modelBounds.min, modelBounds.max, profileProgress);
            return {
                index,
                timeSeconds,
                blank: false,
                sweepProgress: baseProgress,
                sliceProgress: profileProgress,
                sliceValueModelUnits,
                physicalPositionMm: settings.physicalTravelMm * profileProgress
            };
        }

        function createManifestFrame(frameInfo, fileName = null, settings = null) {
            const thickness = settings && !frameInfo.blank && settings.renderStyle !== 'mesh'
                ? settings.sliceThicknessModelUnits
                : null;
            return {
                index: frameInfo.index,
                file: fileName,
                timeSeconds: frameInfo.timeSeconds,
                blank: frameInfo.blank,
                sweepProgress: frameInfo.sweepProgress,
                sliceProgress: frameInfo.sliceProgress,
                sliceValueModelUnits: frameInfo.sliceValueModelUnits,
                sliceThicknessModelUnits: thickness,
                sliceMinModelUnits: thickness === null ? null : frameInfo.sliceValueModelUnits - thickness / 2,
                sliceMaxModelUnits: thickness === null ? null : frameInfo.sliceValueModelUnits + thickness / 2,
                physicalPositionMm: frameInfo.physicalPositionMm
            };
        }

        function buildExportManifest(settings, frames) {
            const span = modelBounds.max - modelBounds.min;
            return {
                schema: '3d-slicer-export-manifest-v1',
                generatedAt: new Date().toISOString(),
                app: {
                    name: '3D Slicer & Exporter',
                    uiVersion: '6.2'
                },
                export: {
                    format: settings.format,
                    width: settings.width,
                    height: settings.height,
                    fps: settings.fps,
                    durationSeconds: settings.duration,
                    totalFrames: getTotalExportFrames(settings),
                    activeFrames: Math.max(1, getTotalExportFrames(settings) - settings.blankFrames * 2),
                    blankFramesAtEachEnd: settings.blankFrames,
                    requestedSliceMode: settings.sliceMode,
                    resolvedRenderStyle: settings.renderStyle,
                    estimatedBytes: estimateExportBytes(settings)
                },
                slicing: {
                    axis: getSliceAxisDefinition().label,
                    modelUnitBounds: { min: modelBounds.min, max: modelBounds.max },
                    modelUnitSpan: span,
                    sliceThicknessMode: settings.renderStyle === 'mesh' ? null : settings.sliceThicknessMode,
                    sliceThicknessModelUnits: settings.renderStyle === 'mesh' ? null : settings.sliceThicknessModelUnits,
                    framePitchModelUnits: settings.renderStyle === 'mesh' ? null : settings.framePitchModelUnits,
                    contentType: settings.renderStyle === 'mesh' ? 'filled-mesh-section' : 'surface-slab'
                },
                displayCalibration: {
                    physicalTravelMm: settings.physicalTravelMm,
                    motionProfile: settings.motionProfile,
                    mmPerModelUnit: span !== 0 ? settings.physicalTravelMm / span : null
                },
                warnings: settings.warnings,
                frames
            };
        }

        function manifestBlob(settings, frames) {
            return new Blob([JSON.stringify(buildExportManifest(settings, frames), null, 2)], { type: 'application/json' });
        }

        function getExportSettings() {
            const duration = clamp(finiteInteger(document.getElementById('export-duration').value, 5), 1, 60);
            const fps = clamp(finiteInteger(document.getElementById('export-fps').value, 60), 1, 120);
            const totalFrames = Math.max(1, Math.round(fps * duration));
            const maxBlankFrames = Math.max(0, Math.floor((totalFrames - 1) / 2));
            const resolved = resolveExportRenderStyle(document.getElementById('export-slice-mode').value);
            const pixelCount = evenPositiveInteger(document.getElementById('export-w').value, 1080) * evenPositiveInteger(document.getElementById('export-h').value, 1080);
            const estimatedBitrate = clamp(Math.round(pixelCount * fps * 0.35), 24_000_000, 140_000_000);
            const thicknessMode = document.getElementById('slice-thickness-mode')?.value || sliceThicknessMode;
            const settings = {
                format: document.getElementById('export-format').value,
                width: evenPositiveInteger(document.getElementById('export-w').value, 1080),
                height: evenPositiveInteger(document.getElementById('export-h').value, 1080),
                duration,
                fps,
                sliceMode: document.getElementById('export-slice-mode').value,
                renderStyle: resolved.renderStyle,
                warnings: resolved.warnings,
                physicalTravelMm: Math.max(0, finiteNumber(document.getElementById('calibration-travel-mm').value, 100)),
                blankFrames: clamp(finiteInteger(document.getElementById('calibration-blank-frames').value, 0), 0, maxBlankFrames),
                motionProfile: document.getElementById('calibration-motion-profile').value,
                sliceThicknessMode: thicknessMode,
                estimatedBitrate
            };
            settings.framePitchModelUnits = getPitchMatchedSliceThickness(settings);
            settings.sliceThicknessModelUnits = resolveSliceThicknessForSettings(settings);
            if (settings.sliceThicknessMode === 'frame-pitch' && settings.motionProfile === 'pingpong') {
                settings.warnings = settings.warnings.concat('Ping-pong motion intentionally revisits slice positions on the return sweep; frame-pitch thickness is matched to adjacent frame travel.');
            }
            return settings;
        }

        function prepareExportRenderState(settings) {
            const width = settings.width;
            const height = settings.height;
            renderer.setPixelRatio(1);
            renderer.setSize(width, height);
            disposeRenderTarget();

            renderTarget = new THREE.WebGLRenderTarget(width, height, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });
            postMaterial.uniforms.uResolution.value.set(width, height);

            activeCamera = orthoCamera;
            const aspect = width / height;
            const fH = FRUSTUM_SIZE * captureScale;
            const fW = fH * aspect;
            orthoCamera.left = -fW / 2;
            orthoCamera.right = fW / 2;
            orthoCamera.top = fH / 2;
            orthoCamera.bottom = -fH / 2;
            orthoCamera.zoom = 1;
            configureCameraForSliceAxis(orthoCamera);

            frameHelper.visible = false;
            updateCropPlanes();
            if (cropBox) cropBox.visible = false;
            if (cropTransformControls) {
                cropTransformControls.visible = false;
                cropTransformControls.enabled = false;
            }
            if (settings.renderStyle === 'mesh') {
                visualGroup.visible = false;
                pointGroup.visible = false;
                gaussianGroup.visible = false;
            } else if (settings.renderStyle === 'gaussian') {
                gaussianGroup.visible = true;
                pointGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;
                applyPointClippingPlanes(true);
                setPointDrawFraction(EXPORT_POINT_DENSITY);
            } else {
                pointGroup.visible = true;
                gaussianGroup.visible = false;
                visualGroup.visible = false;
                stencilGroup.visible = false;
                capGroup.visible = false;
                applyPointClippingPlanes(true);
                setPointDrawFraction(EXPORT_POINT_DENSITY);
            }
        }

        function renderPointExportFrame() {
            renderer.setRenderTarget(null);
            renderer.autoClear = true;
            renderer.clear(true, true, true);
            renderer.render(scene, activeCamera);
            renderer.getContext().flush();
        }

        function renderBlankExportFrame() {
            setSliceWindowUniforms(false);
            renderer.setRenderTarget(null);
            renderer.autoClear = true;
            renderer.clear(true, true, true);
            renderer.getContext().flush();
        }

        function renderExportFrame(frameInfo, settings) {
            pointMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = 1.0;
                m.uniforms.uOrthoZoom.value = 1.0;
            });
            gaussianMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = 1.0;
                m.uniforms.uOrthoZoom.value = 1.0;
                m.uniforms.uViewport.value.set(renderer.domElement.width, renderer.domElement.height);
            });

            if (frameInfo.blank) {
                renderBlankExportFrame();
                return;
            }

            if (settings.renderStyle !== 'mesh') {
                sliceThickness = settings.sliceThicknessModelUnits;
                setSliceWindowUniforms(
                    settings.sliceThicknessMode === 'frame-pitch',
                    frameInfo.sliceValueModelUnits,
                    settings.sliceThicknessModelUnits
                );
            } else {
                setSliceWindowUniforms(false);
            }
            updatePlaneHeight(frameInfo.sliceValueModelUnits);

            if (settings.renderStyle === 'mesh') {
                performMultiPassRender();
            } else {
                if (settings.renderStyle === 'gaussian') updateGaussianDepthSorting(true);
                renderPointExportFrame();
            }
        }

        function updateExportProgress(progress, percentEl, barEl) {
            const pct = Math.round(progress * 100) + '%';
            percentEl.textContent = pct;
            barEl.style.width = pct;
        }

        function canvasToPngBlob() {
            return new Promise((resolve, reject) => {
                renderer.domElement.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('Could not capture PNG frame.'));
                }, 'image/png');
            });
        }

        async function configureVideoEncoder(videoEncoder, encoderConfig) {
            const candidates = [
                encoderConfig,
                { ...encoderConfig, latencyMode: undefined },
                { ...encoderConfig, codec: 'avc1.42002a', latencyMode: undefined }
            ];

            for (const candidate of candidates) {
                const config = { ...candidate };
                if (config.latencyMode === undefined) delete config.latencyMode;
                try {
                    if (VideoEncoder.isConfigSupported) {
                        const support = await VideoEncoder.isConfigSupported(config);
                        if (!support.supported) continue;
                    }
                    videoEncoder.configure(config);
                    return config;
                } catch (error) {
                    // Try the next conservative H.264 config.
                }
            }

            throw new Error('No supported MP4 encoder configuration was found.');
        }

        async function waitForEncoderQueue(videoEncoder) {
            while (
                videoEncoder.state !== 'closed' &&
                typeof videoEncoder.encodeQueueSize === 'number' &&
                videoEncoder.encodeQueueSize > EXPORT_ENCODER_QUEUE_LIMIT
            ) {
                await yieldToBrowser();
            }
        }

        // --- OFFLINE RENDERING LOGIC ---
        async function startExport() {
            if (isProcessingVideo) return;
            if (!activeWrappers.visual) {
                alert("No model is loaded yet.");
                return;
            }

            const settings = getExportSettings();
            if (settings.format === 'mp4' && typeof VideoEncoder === 'undefined') {
                alert("Your browser does not support WebCodecs.");
                return;
            }

            const maxTex = renderer.capabilities.maxTextureSize;
            if(settings.width > maxTex || settings.height > maxTex) {
                alert(`Resolution too high. Maximum texture size is ${maxTex}px.`);
                return;
            }

            const estimatedBytes = estimateExportBytes(settings);
            if (estimatedBytes > EXPORT_LARGE_WARNING_BYTES) {
                const ok = confirm(`This export may use about ${formatBytes(estimatedBytes)} in memory before download. Continue?`);
                if (!ok) return;
            }

            const wasFrameVisible = frameHelper.visible;
            const wasMeshVisible = visualGroup.visible;
            const previousPointDrawFraction = pointDrawFraction;
            let didPrepareRenderState = false;

            isProcessingVideo = true;

            try {
                // Save State
                preExportState.width = window.innerWidth;
                preExportState.height = window.innerHeight;
                preExportState.pixelRatio = renderer.getPixelRatio();
                didPrepareRenderState = true;

                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;

                document.getElementById('rec-overlay').classList.remove('hidden');
                const percentEl = document.getElementById('rec-percentage');
                const barEl = document.getElementById('rec-progress-bar');
                updateExportProgress(0, percentEl, barEl);

                prepareExportRenderState(settings);

                if (settings.format === 'png-sequence') {
                    await exportPngSequence(settings, percentEl, barEl);
                } else {
                    await exportMp4(settings, percentEl, barEl);
                }
            } catch (e) {
                console.error("Export failed:", e);
                alert("Export failed.");
            } finally {
                if (didPrepareRenderState) {
                    restoreState(wasFrameVisible, wasMeshVisible);
                } else {
                    document.getElementById('rec-overlay').classList.add('hidden');
                }
                isProcessingVideo = false;
                setPointDrawFraction(previousPointDrawFraction);
                refreshSliceThicknessFromMode();
                setFullPointCloudVisible(showFullPointCloud);
                updateCropHelperVisibility();
            }
        }

        async function exportMp4(settings, percentEl, barEl) {
            const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/+esm');
            const muxer = new Muxer({
                target: new ArrayBufferTarget(),
                video: { codec: 'avc', width: settings.width, height: settings.height },
                fastStart: 'in-memory'
            });
            const videoEncoder = new VideoEncoder({
                output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                error: e => { console.error("Encoding error:", e); isProcessingVideo = false; }
            });

            const pixelCount = settings.width * settings.height;
            const codec = pixelCount > 2228224 ? 'avc1.4d0033' : 'avc1.4d002a';
            const targetBitrate = clamp(Math.round(pixelCount * settings.fps * 0.35), 24_000_000, 140_000_000);
            const encoderConfig = {
                codec,
                width: settings.width,
                height: settings.height,
                bitrate: targetBitrate,
                framerate: settings.fps,
                latencyMode: 'quality'
            };

            await configureVideoEncoder(videoEncoder, encoderConfig);

            const totalFrames = getTotalExportFrames(settings);
            const frameDurationUs = 1e6 / settings.fps;
            const manifestFrames = [];

            for (let i = 0; i < totalFrames; i++) {
                if (!isProcessingVideo || videoEncoder.state === 'closed') break;

                const frameInfo = getExportFrameInfo(i, settings);
                renderExportFrame(frameInfo, settings);

                const timestamp = i * frameDurationUs;
                const frame = new VideoFrame(renderer.domElement, { timestamp: timestamp });
                videoEncoder.encode(frame, { keyFrame: settings.renderStyle === 'points' || settings.renderStyle === 'gaussian' || i % settings.fps === 0 });
                frame.close();

                manifestFrames.push(createManifestFrame(frameInfo, null, settings));
                updateExportProgress(totalFrames === 1 ? 1 : i / (totalFrames - 1), percentEl, barEl);

                await waitForEncoderQueue(videoEncoder);
                if (i % 3 === 0) await yieldToBrowser();
            }

            if (videoEncoder.state !== 'closed') {
                await videoEncoder.flush();
            }
            muxer.finalize();

            const { buffer } = muxer.target;
            const blob = new Blob([buffer], { type: 'video/mp4' });
            downloadBlob(blob, `slice_render_${settings.width}x${settings.height}_${settings.fps}fps.mp4`);
            downloadBlob(manifestBlob(settings, manifestFrames), `slice_render_${settings.width}x${settings.height}_${settings.fps}fps.manifest.json`);
        }

        async function exportPngSequence(settings, percentEl, barEl) {
            const JSZip = await loadJSZip();
            const zip = new JSZip();
            const folder = zip.folder('frames');
            const totalFrames = getTotalExportFrames(settings);
            const digits = String(totalFrames - 1).length;
            const manifestFrames = [];

            for (let i = 0; i < totalFrames; i++) {
                if (!isProcessingVideo) break;

                const frameInfo = getExportFrameInfo(i, settings);
                renderExportFrame(frameInfo, settings);

                const blob = await canvasToPngBlob();
                const filename = `frame_${String(i).padStart(digits, '0')}.png`;
                folder.file(filename, blob, { binary: true, compression: 'STORE' });
                manifestFrames.push(createManifestFrame(frameInfo, `frames/${filename}`, settings));

                updateExportProgress(totalFrames === 1 ? 1 : i / (totalFrames - 1), percentEl, barEl);

                await yieldToBrowser();
            }

            zip.file('manifest.json', manifestBlob(settings, manifestFrames));

            const zipBlob = await zip.generateAsync({
                type: 'blob',
                compression: 'STORE',
                streamFiles: true
            }, (metadata) => {
                const progress = clamp(metadata.percent / 100, 0, 1);
                updateExportProgress(progress, percentEl, barEl);
            });

            downloadBlob(zipBlob, `slice_frames_${settings.width}x${settings.height}_${settings.fps}fps.zip`);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => {
                revokeBlobUrl(url);
            }, 60000);
        }

        function restoreState(restoreFrame, restoreMesh) {
            renderer.setPixelRatio(preExportState.pixelRatio);
            renderer.setSize(preExportState.width, preExportState.height);
            
            disposeRenderTarget();

            const w = preExportState.width;
            const h = preExportState.height;
            renderTarget = new THREE.WebGLRenderTarget(w * preExportState.pixelRatio, h * preExportState.pixelRatio, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });
            postMaterial.uniforms.uResolution.value.set(w * preExportState.pixelRatio, h * preExportState.pixelRatio);

            onWindowResize(); 
            document.getElementById('rec-overlay').classList.add('hidden');

            if (viewMode === '3d') setMode('3d'); else setMode('2d');
            setRenderStyle(renderStyle);
            if(frameHelper) frameHelper.visible = restoreFrame;
            if (typeof restoreMesh !== 'undefined' && renderStyle === 'mesh') {
                visualGroup.visible = restoreMesh;
                document.getElementById('show-mesh').checked = restoreMesh;
            } else {
                document.getElementById('show-mesh').checked = visualGroup.visible;
            }
            updateCropHelperVisibility();
        }

        function updatePlaneHeight(val) {
            const fallback = finiteNumber(document.getElementById('slice-slider').value, 0);
            const v = clamp(finiteNumber(val, fallback), modelBounds.min, modelBounds.max);
            // Mesh Slice
            clippingPlane.constant = v;
            setObjectSlicePosition(capMesh, v);
            
            // Point Slab
            const half = sliceThickness / 2;
            slabPlaneBottom.constant = -v + half;
            slabPlaneTop.constant = v + half;
            
            if(!isProcessingVideo) {
                const slider = document.getElementById('slice-slider');
                if (document.activeElement !== slider) slider.value = v;
                const input = document.getElementById('slice-input');
                if (document.activeElement !== input) input.value = v.toFixed(2);
            }
        }

        function setupUI() {
            document.getElementById('slice-slider').addEventListener('input', (e) => {
                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;
                updatePlaneHeight(e.target.value);
            });
            document.getElementById('slice-input').addEventListener('input', (e) => {
                isAnimate = false;
                document.getElementById('anim-toggle').checked = false;
                updatePlaneHeight(e.target.value);
            });
            document.getElementById('anim-toggle').addEventListener('change', (e) => isAnimate = e.target.checked);
            document.getElementById('speed-slider').addEventListener('input', (e) => scanSpeed = clamp(finiteNumber(e.target.value, scanSpeed), 0.1, 2.0));
            document.getElementById('slice-axis').addEventListener('change', (e) => setSliceAxis(e.target.value));
            document.getElementById('btn-3d').addEventListener('click', () => setMode('3d'));
            document.getElementById('btn-2d').addEventListener('click', () => setMode('2d'));
            document.getElementById('btn-export').addEventListener('click', startExport);
            document.getElementById('export-format').addEventListener('change', updateExportButtonLabel);
            const refreshAutoThickness = () => {
                if (sliceThicknessMode === 'frame-pitch') refreshSliceThicknessFromMode();
            };
            document.getElementById('export-duration').addEventListener('input', refreshAutoThickness);
            document.getElementById('export-fps').addEventListener('change', refreshAutoThickness);
            document.getElementById('calibration-blank-frames').addEventListener('input', refreshAutoThickness);
            document.getElementById('calibration-motion-profile').addEventListener('change', refreshAutoThickness);
            document.getElementById('btn-reset').addEventListener('click', () => {
                revokeActiveUploadUrl();
                loadModel(DEFAULT_MODEL);
            });
            document.getElementById('flip-model').addEventListener('change', (e) => {
                flipModelVertical = e.target.checked;
                updateOrientation();
            });
            
            ['x', 'y', 'z'].forEach(axis => {
                const rotSlider = document.getElementById(`rot-${axis}`);
                const rotNumber = document.getElementById(`num-rot-${axis}`);
                rotSlider.addEventListener('input', () => { rotNumber.value = rotSlider.value; updateOrientation(); });
                rotNumber.addEventListener('input', () => {
                    const val = clamp(finiteNumber(rotNumber.value, 0), 0, 360);
                    rotNumber.value = val;
                    rotSlider.value = val; updateOrientation();
                });

                const posSlider = document.getElementById(`pos-model-${axis}`);
                const posNumber = document.getElementById(`num-pos-model-${axis}`);
                if (posSlider && posNumber) {
                    posSlider.addEventListener('input', () => { posNumber.value = posSlider.value; updateOrientation(); });
                    posNumber.addEventListener('input', () => {
                        const val = finiteNumber(posNumber.value, 0);
                        posSlider.value = val; updateOrientation();
                    });
                }
            });
            
            document.getElementById('outline-mode').addEventListener('change', (e) => toggleOutlineMode(e.target.checked));
            document.getElementById('outline-width').addEventListener('input', (e) => {
                outlineWidth = clamp(finiteNumber(e.target.value, outlineWidth), 1, 10);
                postMaterial.uniforms.uOutlineWidth.value = outlineWidth;
                document.getElementById('outline-val').textContent = outlineWidth.toFixed(0) + ' px';
            });
            
            // Point UI
            document.getElementById('point-size').addEventListener('input', (e) => {
                setPointSize(logSliderToValue(e.target.value, POINT_SIZE_MIN, POINT_SIZE_MAX), 'slider');
            });
            document.getElementById('point-size-val').addEventListener('input', (e) => {
                setPointSize(e.target.value, 'input');
            });
            document.getElementById('point-size-val').addEventListener('change', () => {
                setPointSize(pointSize);
            });
            document.getElementById('point-count').addEventListener('input', (e) => {
                updatePointDensity();
            });
            document.getElementById('slice-thickness-mode').addEventListener('change', () => {
                refreshSliceThicknessFromMode();
            });
            document.getElementById('point-thick').addEventListener('input', (e) => {
                manualSliceThickness = clamp(finiteNumber(e.target.value, manualSliceThickness), SLICE_THICKNESS_MIN, SLICE_THICKNESS_MAX);
                sliceThicknessMode = 'manual';
                document.getElementById('slice-thickness-mode').value = 'manual';
                refreshSliceThicknessFromMode();
            });
            document.getElementById('show-full-cloud').addEventListener('change', (e) => {
                setFullPointCloudVisible(e.target.checked);
            });
            document.getElementById('crop-enabled').addEventListener('change', (e) => {
                setCropEnabled(e.target.checked);
            });
            ['move', 'scale', 'rotate'].forEach((mode) => {
                document.getElementById(`crop-mode-${mode}`).addEventListener('click', () => setCropControlsMode(mode));
            });
            ['pos-x', 'pos-y', 'pos-z', 'size-x', 'size-y', 'size-z', 'rot-x', 'rot-y', 'rot-z'].forEach((id) => {
                document.getElementById(`crop-${id}`).addEventListener('input', applyCropControlsToBox);
            });
            document.getElementById('crop-fit').addEventListener('click', () => {
                fitCropBoxToModel();
                if (cropEnabled) applyPointClippingPlanes(!showFullPointCloud);
                updateCropHelperVisibility();
            });
            document.getElementById('crop-apply').addEventListener('click', applyCropToPointData);
            document.getElementById('crop-export-ply').addEventListener('click', exportCurrentPointCloudPly);

            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                setCaptureScale(logSliderToValue(e.target.value, FRAME_SCALE_MIN, FRAME_SCALE_MAX), 'slider');
                document.getElementById('show-frame').checked = true;
            });
            document.getElementById('zoom-val').addEventListener('input', (e) => {
                setCaptureScale(e.target.value, 'input');
                document.getElementById('show-frame').checked = true;
            });
            document.getElementById('zoom-val').addEventListener('change', () => {
                setCaptureScale(captureScale);
            });
            document.getElementById('show-frame').addEventListener('change', updateFrameHelper);
            document.getElementById('export-w').addEventListener('input', updateFrameHelper);
            document.getElementById('export-h').addEventListener('input', updateFrameHelper);
            document.getElementById('file-input').addEventListener('change', (e) => {
                if(e.target.files[0]) {
                    const file = e.target.files[0];
                    revokeActiveUploadUrl();
                    activeUploadUrl = URL.createObjectURL(file);
                    loadModel(activeUploadUrl, file.name);
                    e.target.value = '';
                }
            });
            updateExportButtonLabel();
            updateSliceAxisUI();
            setPointSize(pointSize);
            setCaptureScale(captureScale);
            setCropControlsMode(cropControlsMode);
            syncCropControlsFromBox();
            setCropEnabled(cropEnabled);
            refreshSliceThicknessFromMode();
        }

        function setMode(mode) {
            viewMode = mode;
            const b3 = document.getElementById('btn-3d');
            const b2 = document.getElementById('btn-2d');
            const projToggle = document.getElementById('projection-toggle');
            const meshCheckbox = document.getElementById('show-mesh');

            if (mode === '3d') {
                b3.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                b2.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800";
                
                // Show toggle
                projToggle.classList.remove('hidden');
                
                if (isOrtho3D) {
                    activeCamera = orthoCamera3D;
                } else {
                    activeCamera = perspectiveCamera;
                }
                
                activeCamera.position.set(3, 2, 4);
                activeCamera.lookAt(0,0,0);
                controls.object = activeCamera;
                controls.enabled = true;
                controls.enableRotate = true;
                controls.enableZoom = true;
                
                if (renderStyle === 'mesh') {
                    meshCheckbox.checked = true;
                    visualGroup.visible = true; 
                }
            } else {
                b2.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                b3.className = "flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800";
                
                // Hide toggle in 2D
                projToggle.classList.add('hidden');

                activeCamera = orthoCamera;
                activeCamera.zoom = 1; 
                configureCameraForSliceAxis(activeCamera);
                activeCamera.updateProjectionMatrix();
                controls.object = activeCamera;
                controls.enabled = true;
                controls.enableRotate = false; 
                controls.enableZoom = true;    
                controls.enablePan = true;
                
                if (renderStyle === 'mesh') {
                    meshCheckbox.checked = false;
                    visualGroup.visible = false; 
                }
            }
            updateCropHelperVisibility();
        }
        
        window.toggle3DProjection = function(isOrtho) {
            isOrtho3D = isOrtho;
            if (viewMode !== '3d') return; 

            const target = controls.target.clone();
            
            if (isOrtho) {
                // Switch to Ortho
                activeCamera = orthoCamera3D;
                // Sync View based on current perspective camera
                const dist = perspectiveCamera.position.distanceTo(target);
                const vFOV = perspectiveCamera.fov * Math.PI / 180;
                const height = 2 * dist * Math.tan(vFOV / 2);
                const width = height * perspectiveCamera.aspect;
                
                orthoCamera3D.left = -width / 2;
                orthoCamera3D.right = width / 2;
                orthoCamera3D.top = height / 2;
                orthoCamera3D.bottom = -height / 2;
                orthoCamera3D.zoom = 1; 
                orthoCamera3D.updateProjectionMatrix();
                
                orthoCamera3D.position.copy(perspectiveCamera.position);
                orthoCamera3D.quaternion.copy(perspectiveCamera.quaternion);
            } else {
                // Switch to Perspective
                activeCamera = perspectiveCamera;
                perspectiveCamera.position.copy(orthoCamera3D.position);
                perspectiveCamera.quaternion.copy(orthoCamera3D.quaternion);
            }
            
            controls.object = activeCamera;
            controls.update();
            updateCropHelperVisibility();
        }

        window.setCapColor = function(hexStr) {
            sliceColor.set(hexStr);
            postMaterial.uniforms.uColor.value.set(hexStr);
        }
        
        window.togglePanel = function() {
            const content = document.getElementById('panel-content');
            const btn = document.getElementById('minimize-btn');
            isPanelOpen = !isPanelOpen;
            if(isPanelOpen) {
                content.style.display = 'block';
                btn.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                btn.style.transform = 'rotate(180deg)';
            }
        }

        function onWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const aspect = w / h;
            perspectiveCamera.aspect = aspect;
            perspectiveCamera.updateProjectionMatrix();
            const fH = FRUSTUM_SIZE; 
            const fW = fH * aspect;
            orthoCamera.left = -fW / 2;
            orthoCamera.right = fW / 2;
            orthoCamera.top = fH / 2;
            orthoCamera.bottom = -fH / 2;
            orthoCamera.updateProjectionMatrix();
            if (viewMode === '2d') configureCameraForSliceAxis(orthoCamera);
            if (orthoCamera3D) {
                const h3d = orthoCamera3D.top - orthoCamera3D.bottom;
                const w3d = h3d * aspect;
                orthoCamera3D.left = -w3d / 2;
                orthoCamera3D.right = w3d / 2;
                orthoCamera3D.updateProjectionMatrix();
            }
            
            renderer.setSize(w, h);
            if (renderTarget) {
                renderTarget.setSize(w * window.devicePixelRatio, h * window.devicePixelRatio);
                postMaterial.uniforms.uResolution.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
            }
            
            updateFrameHelper();
        }

        init();
    </script>
