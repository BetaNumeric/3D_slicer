<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Slicer & Exporter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        /* Custom Color Picker Styling */
        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            padding: 0;
            width: 100%;
            height: 32px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #475569;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- UI Container -->
    <div class="absolute top-4 left-4 z-20 w-80 flex flex-col items-start pointer-events-none">
        
        <!-- Main Panel -->
        <div id="controls-panel" class="bg-gray-900/90 backdrop-blur-md rounded-xl shadow-2xl border border-gray-800 pointer-events-auto overflow-hidden transition-all duration-300 w-full">
            
            <!-- Header -->
            <div class="flex items-center justify-between p-4 bg-black/50 border-b border-gray-800 cursor-pointer hover:bg-gray-800/50" onclick="togglePanel()">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                    <h1 class="text-sm font-bold text-gray-100 tracking-wide">SLICE VISUALIZER V6.2</h1>
                </div>
                <button id="minimize-btn" class="text-gray-400 hover:text-white transition-transform transform rotate-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <!-- Content -->
            <div id="panel-content" class="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
                
                <!-- View Mode -->
                <div class="bg-black/40 p-1 rounded-lg border border-gray-800">
                    <div class="flex shadow-inner mb-2">
                        <button id="btn-3d" class="flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md">3D View</button>
                        <button id="btn-2d" class="flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800">2D Map</button>
                    </div>
                    
                    <!-- 3D Projection Toggle -->
                    <div id="projection-toggle" class="flex justify-end px-1">
                        <label class="flex items-center gap-2 text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white transition-colors">
                            <span>Use Orthographic Camera</span>
                            <input type="checkbox" id="ortho-3d-check" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600" onchange="toggle3DProjection(this.checked)">
                        </label>
                    </div>
                </div>

                <!-- Slice Control -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <label id="slice-label" class="text-xs font-bold uppercase text-gray-500">Slice Position (Y)</label>
                            <select id="slice-axis" class="bg-gray-800 text-gray-200 text-[10px] font-bold px-1 py-0.5 rounded border border-gray-700 outline-none">
                                <option value="x">X</option>
                                <option value="y" selected>Y</option>
                                <option value="z">Z</option>
                            </select>
                        </div>
                        <input type="number" id="slice-input" step="0.01" class="w-20 bg-blue-900/20 text-blue-400 text-xs font-mono px-2 py-0.5 rounded border border-blue-900/30 outline-none text-right hover:border-blue-500 focus:border-blue-500 transition-colors" value="0.00">
                    </div>
                    <input type="range" id="slice-slider" min="-1" max="1" step="0.01" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400">
                </div>

                <!-- Automation -->
                <div class="bg-black/20 rounded-lg p-3 border border-gray-800 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-gray-400">Auto Scan</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="anim-toggle" class="sr-only peer">
                            <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-gray-500 mb-1 block">Speed</label>
                        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="0.5" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    </div>
                </div>

                <!-- Transform & Crop Controls -->
                <div class="space-y-2 pt-2 border-t border-gray-800">
                    <div class="flex justify-between items-center cursor-pointer select-none" onclick="document.getElementById('transform-crop-controls').classList.toggle('hidden');">
                         <label class="text-[10px] text-gray-500 uppercase font-bold hover:text-gray-300 transition-colors">Transform & Crop</label>
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    <div id="transform-crop-controls" class="space-y-4 hidden pt-1">
                        <div class="space-y-2">
                            <label class="text-[10px] text-gray-500 uppercase font-bold block">Model Orientation</label>
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Flip Vertical</span>
                                <input type="checkbox" id="flip-model" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600">
                            </label>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-red-500 w-3">X</span>
                                <input type="range" id="rot-x" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-500">
                                <input type="number" id="num-rot-x" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-red-500 transition-colors">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-green-500 w-3">Y</span>
                                <input type="range" id="rot-y" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-500">
                                <input type="number" id="num-rot-y" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-green-500 transition-colors">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-blue-500 w-3">Z</span>
                                <input type="range" id="rot-z" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                                <input type="number" id="num-rot-z" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-blue-500 transition-colors">
                            </div>
                        </div>

                        <!-- Translation -->
                        <div class="space-y-2 pt-3 border-t border-gray-800">
                            <label class="text-[10px] text-gray-500 uppercase font-bold block">Model Position</label>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-red-500 w-3">X</span>
                                <input type="range" id="pos-model-x" min="-5" max="5" step="0.01" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-500">
                                <input type="number" id="num-pos-model-x" step="0.01" value="0" class="w-12 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-red-500 transition-colors">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-green-500 w-3">Y</span>
                                <input type="range" id="pos-model-y" min="-5" max="5" step="0.01" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-500">
                                <input type="number" id="num-pos-model-y" step="0.01" value="0" class="w-12 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-green-500 transition-colors">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-blue-500 w-3">Z</span>
                                <input type="range" id="pos-model-z" min="-5" max="5" step="0.01" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                                <input type="number" id="num-pos-model-z" step="0.01" value="0" class="w-12 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-blue-500 transition-colors">
                            </div>
                            <div class="flex gap-2 min-w-0 w-full mt-1">
                                <button onclick="centerModel()" class="flex-1 min-w-0 text-[10px] text-gray-500 hover:text-white bg-gray-800 hover:bg-gray-700 rounded py-1 transition-colors">Center</button>
                                <button onclick="resetOrientationUI(); ['x','y','z'].forEach(a => { const el = document.getElementById(`pos-model-${a}`); if(el) el.value=0; const nel = document.getElementById(`num-pos-model-${a}`); if (nel) nel.value=0; }); updateOrientation();" class="flex-1 min-w-0 text-[10px] text-gray-500 hover:text-white bg-gray-800 hover:bg-gray-700 rounded py-1 transition-colors">Reset</button>
                            </div>
                        </div>

                        <div class="space-y-3 pt-3 border-t border-gray-800">
                            <label class="text-[10px] text-gray-500 uppercase font-bold block">Crop Cuboid</label>
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Enable Crop</span>
                                <input type="checkbox" id="crop-enabled" class="w-3 h-3 accent-cyan-500 rounded bg-gray-700 border-gray-600">
                            </label>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">Viewport Handles</label>
                                <div class="bg-gray-800/50 p-1 rounded grid grid-cols-3 gap-1">
                                    <button type="button" id="crop-mode-move" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors">Move</button>
                                    <button type="button" id="crop-mode-scale" class="text-[10px] font-bold py-1 rounded bg-cyan-600 text-white transition-colors shadow">Scale</button>
                                    <button type="button" id="crop-mode-rotate" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors">Rotate</button>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold">Position</label>
                                    <button type="button" id="crop-fit" class="text-[10px] text-cyan-400 hover:text-cyan-200 font-bold">Fit</button>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <input type="number" id="crop-pos-x" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-red-500" aria-label="Crop position X">
                                    <input type="number" id="crop-pos-y" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-green-500" aria-label="Crop position Y">
                                    <input type="number" id="crop-pos-z" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-blue-500" aria-label="Crop position Z">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">Size</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <input type="number" id="crop-size-x" min="0.01" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-red-500" aria-label="Crop size X">
                                    <input type="number" id="crop-size-y" min="0.01" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-green-500" aria-label="Crop size Y">
                                    <input type="number" id="crop-size-z" min="0.01" step="0.01" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-blue-500" aria-label="Crop size Z">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">Rotation</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <input type="number" id="crop-rot-x" min="-180" max="180" step="1" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-red-500" aria-label="Crop rotation X">
                                    <input type="number" id="crop-rot-y" min="-180" max="180" step="1" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-green-500" aria-label="Crop rotation Y">
                                    <input type="number" id="crop-rot-z" min="-180" max="180" step="1" class="bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-700 outline-none text-right focus:border-blue-500" aria-label="Crop rotation Z">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" id="crop-apply" class="py-1.5 bg-cyan-700 hover:bg-cyan-600 text-white text-[10px] font-bold rounded transition-colors">Apply Crop</button>
                                <button type="button" id="crop-export-ply" class="py-1.5 bg-gray-800 hover:bg-gray-700 text-cyan-100 text-[10px] font-bold rounded border border-cyan-900/60 transition-colors">Export PLY</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Export Video Section -->
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700 space-y-3">
                    <div class="flex justify-between items-center">
                         <label class="text-xs font-bold uppercase text-red-400 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                            Export
                        </label>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold">Duration (s)</label>
                            <input type="number" id="export-duration" value="5" min="1" max="60" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold">FPS</label>
                            <select id="export-fps" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                                <option value="30">30</option>
                                <option value="60" selected>60</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Format</label>
                        <select id="export-format" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                            <option value="mp4" selected>MP4 Video</option>
                            <option value="png-sequence">PNG Frame Sequence (.zip)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Slice Content</label>
                        <select id="export-slice-mode" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                            <option value="current" selected>Current Preview Style</option>
                            <option value="filled">Filled Mesh Slices</option>
                            <option value="surface">Surface Slab Frames</option>
                            <option value="gaussian">Gaussian Surface Slabs</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Resolution (px)</label>
                        <div class="flex gap-2">
                             <input type="number" id="export-w" value="1080" placeholder="W" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                             <span class="text-gray-500 self-center">x</span>
                             <input type="number" id="export-h" value="1080" placeholder="H" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                        </div>
                    </div>
                    
                    <!-- Zoom & Frame Control -->
                    <div class="space-y-2 pt-1 border-t border-gray-700">
                        <div class="flex items-center justify-between">
                             <label class="text-[10px] text-gray-500 uppercase font-bold">Frame Scale</label>
                             <input type="number" id="zoom-val" min="0.001" max="2.0" step="0.0001" value="1.000" class="w-20 bg-blue-900/20 text-blue-400 text-[10px] font-mono px-2 py-0.5 rounded border border-blue-900/30 outline-none text-right hover:border-blue-500 focus:border-blue-500 transition-colors">
                        </div>
                        <input type="range" id="zoom-slider" min="0" max="1" step="0.001" value="0.78" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        
                         <label class="flex items-center gap-2 cursor-pointer mt-1">
                            <input type="checkbox" id="show-frame" class="w-3 h-3 accent-red-500 rounded bg-gray-700 border-gray-600">
                            <span class="text-[10px] text-gray-400 uppercase font-bold select-none">Show Capture Frame</span>
                        </label>
                    </div>

                    <!-- Display Calibration -->
                    <div class="space-y-2 pt-1 border-t border-gray-700">
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Display Calibration</label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Travel (mm)</label>
                                <input type="number" id="calibration-travel-mm" value="100" min="0" step="0.1" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Blank Frames</label>
                                <input type="number" id="calibration-blank-frames" value="0" min="0" step="1" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold">Motion Profile</label>
                            <select id="calibration-motion-profile" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                                <option value="forward" selected>Linear Forward</option>
                                <option value="reverse">Linear Reverse</option>
                                <option value="pingpong">Linear Ping-Pong</option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-export" class="w-full py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded shadow transition-colors flex justify-center items-center gap-2">
                        <span id="export-button-label">Offline Render (MP4)</span>
                    </button>
                </div>

                <!-- Appearance -->
                <div class="space-y-3">
                     <label class="text-xs font-bold uppercase text-gray-500 block">Appearance</label>
                     
                     <!-- Render Style Switch -->
                     <div class="bg-gray-800/50 p-1 rounded grid grid-cols-3 gap-1">
                         <button id="style-mesh" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors" onclick="setRenderStyle('mesh')">Solid Mesh</button>
                         <button id="style-points" class="text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow" onclick="setRenderStyle('points')">Point Cloud</button>
                         <button id="style-gaussian" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors" onclick="setRenderStyle('gaussian')">Gaussian</button>
                     </div>

                     <!-- Mesh Options -->
                     <div id="mesh-options" class="hidden space-y-3">
                         <div id="outline-controls" class="bg-gray-800/50 p-2 rounded border border-gray-700 space-y-2">
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Outline Only</span>
                                <input type="checkbox" id="outline-mode" class="w-3 h-3 accent-purple-500 rounded bg-gray-700 border-gray-600">
                            </label>
                            <div id="outline-settings" class="hidden space-y-1">
                                <div class="flex justify-between">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold">Thickness</label>
                                    <span id="outline-val" class="text-[10px] text-purple-400 font-mono">2 px</span>
                                </div>
                                <input type="range" id="outline-width" min="1" max="10" step="1" value="2" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
                            </div>
                         </div>

                         <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                            <span>Show 3D Mesh</span>
                            <input type="checkbox" id="show-mesh" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600" checked onchange="toggleMesh(this.checked)">
                         </label>

                         <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Slice Color</label>
                            <div class="relative w-full h-8 rounded-md overflow-hidden ring-1 ring-gray-700 hover:ring-gray-500 transition-all">
                                <input type="color" id="color-picker" value="#ffffff" oninput="setCapColor(this.value)">
                            </div>

                     </div>
                     
                     <!-- Point Options -->
                     <div id="point-options" class="space-y-3">
                        <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Point / Splat Size</label>
                                <input type="number" id="point-size-val" min="0.001" max="1.0" step="0.0001" value="0.0100" class="w-20 bg-blue-900/20 text-blue-400 text-[10px] font-mono px-2 py-0.5 rounded border border-blue-900/30 outline-none text-right hover:border-blue-500 focus:border-blue-500 transition-colors">
                            </div>
                            <input type="range" id="point-size" min="0" max="1" step="0.001" value="0.333" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Preview Density</label>
                                <span id="point-count-val" class="text-[10px] text-blue-400 font-mono">10%</span>
                            </div>
                            <input type="range" id="point-count" min="0.01" max="1.0" step="0.01" value="0.10" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Slice Thickness</label>
                                <span id="point-thick-val" class="text-[10px] text-blue-400 font-mono">0.010</span>
                            </div>
                            <select id="slice-thickness-mode" class="w-full bg-gray-800 text-white text-xs p-1 rounded border border-gray-700 outline-none mb-2">
                                <option value="frame-pitch" selected>Frame Pitch</option>
                                <option value="manual">Manual</option>
                            </select>
                            <input type="range" id="point-thick" min="0.00005" max="0.2" step="0.00005" value="0.010" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div class="pt-1 border-t border-gray-800">
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Show Full Point Cloud</span>
                                <input type="checkbox" id="show-full-cloud" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600">
                            </label>
                         </div>
                      </div>
                </div>

                <hr class="border-gray-800">

                <!-- Upload -->
                <div>
                    <div class="mb-2">
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Import As</label>
                        <select id="import-mode" class="w-full bg-gray-800 text-white text-xs p-1 rounded border border-gray-700 outline-none">
                            <option value="auto" selected>Auto Detect</option>
                            <option value="mesh">Mesh Surface</option>
                            <option value="points">Point Cloud</option>

                    </div>
                    <label class="flex flex-col w-full cursor-pointer hover:bg-gray-800/50 transition p-2 rounded border border-dashed border-gray-700 hover:border-blue-500 group mb-2">
                        <span class="text-xs font-bold text-gray-400 group-hover:text-blue-400 mb-1">Load Model or Point Cloud</span>
                        <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.ply,.splat,.sog" class="hidden"/>
                        <span class="text-[10px] text-gray-600 group-hover:text-gray-500">GLB, GLTF, OBJ, STL, PLY, SPLAT, SOG</span>
                    </label>
                    <button id="btn-reset" class="w-full py-1 text-[10px] font-bold text-gray-500 hover:text-white bg-transparent border border-gray-700 hover:bg-gray-700 rounded transition-all">
                        Reset to Default Model
                    </button>
                </div>
                
                 <!-- Status -->
                 <div id="loading-status" class="text-xs text-amber-400 font-mono hidden flex items-center gap-2">
                    <svg id="loading-spinner" class="animate-spin h-3 w-3 text-amber-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="status-text">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Recording Overlay with Progress -->
    <div id="rec-overlay" class="hidden absolute top-4 right-4 z-30 w-64 bg-gray-900/95 border border-gray-700 p-4 rounded-xl shadow-2xl backdrop-blur">
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-red-400 animate-pulse">Rendering...</span>
            <span id="rec-percentage" class="text-xs font-mono text-white">0%</span>
        </div>
        <div class="w-full bg-gray-700 rounded-full h-1.5 overflow-hidden">
            <div id="rec-progress-bar" class="bg-red-500 h-1.5 rounded-full" style="width: 0%"></div>
        </div>
        <p class="text-[10px] text-gray-500 mt-2">Offline Rendering. Safe Mode.</p>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container" class="cursor-move"></div>

    <script>
        // --- CONSTANTS ---
        const DEFAULT_MODEL = 'https://raw.githubusercontent.com/BetaNumeric/3dme/master/model/me.glb';
        const FRUSTUM_SIZE = 3.0;
        const MAX_POINTS = 5000000;
        const DEFAULT_POINT_SIZE = 0.01;
        const POINT_SIZE_MIN = 0.001;
        const POINT_SIZE_MAX = 1.0;
        const GAUSSIAN_REFERENCE_RADIUS = 0.012;
        const GAUSSIAN_MIN_RADIUS = 0.0015;
        const GAUSSIAN_MAX_RADIUS = 0.06;
        const DEFAULT_POINT_DENSITY = 0.1;
        const EXPORT_POINT_DENSITY = 1.0;
        const DEFAULT_SLICE_THICKNESS = 0.010;
        const SLICE_THICKNESS_MIN = 0.00005;
        const SLICE_THICKNESS_MAX = 0.2;
        const FRAME_SCALE_MIN = 0.001;
        const FRAME_SCALE_MAX = 2.0;
        const CROP_MIN_SIZE = 0.01;
        const CROP_FIT_PADDING = 1.02;
        const EXPORT_LARGE_WARNING_BYTES = 1.5 * 1024 * 1024 * 1024;
        const EXPORT_ENCODER_QUEUE_LIMIT = 8;
        const PLANE_NORMAL = new THREE.Vector3(0, 0, 1);
        const SLICE_AXES = {
            x: {
                label: 'X',
                vector: new THREE.Vector3(1, 0, 0),
                negative: new THREE.Vector3(-1, 0, 0),
                cameraPosition: new THREE.Vector3(10, 0, 0),
                cameraUp: new THREE.Vector3(0, 1, 0)
            },
            y: {
                label: 'Y',
                vector: new THREE.Vector3(0, 1, 0),
                negative: new THREE.Vector3(0, -1, 0),
                cameraPosition: new THREE.Vector3(0, 10, 0),
                cameraUp: new THREE.Vector3(0, 0, -1)
            },
            z: {
                label: 'Z',
                vector: new THREE.Vector3(0, 0, 1),
                negative: new THREE.Vector3(0, 0, -1),
                cameraPosition: new THREE.Vector3(0, 0, 10),
                cameraUp: new THREE.Vector3(0, 1, 0)
            }
        };

        // --- VARIABLES ---
        let scene, renderer, controls;
        let perspectiveCamera, orthoCamera, activeCamera;
        let orthoCamera3D; // New camera for 3D ortho view
        let visualGroup, stencilGroup, capGroup;
        let pointGroup, gaussianGroup;
        let activeWrappers = { visual: null, back: null, front: null, points: null, gaussian: null };
        
        let clippingPlane;
        const slabPlaneTop = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
        const slabPlaneBottom = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        let capMesh;
        let frameHelper; 
        let cropBox, cropBoxFill, cropBoxEdges, cropTransformControls;
        let isAnimate = false;
        let scanSpeed = 0.5;
        let time = 0;
        let modelBounds = { min: -1, max: 1 };
        let viewMode = '3d';
        let renderStyle = 'points';
        let flipModelVertical = false;
        let isOrtho3D = false; // Toggle state for 3D projection
        let sliceAxis = 'y';
        
        let capMaterial, backMat, frontMat;
        let pointMaterials = [];
        let gaussianMaterials = [];
        let isPanelOpen = true;
        
        // Post Processing Vars
        let renderTarget;
        let postScene, postCamera, postMesh;
        let postMaterial;

        // Settings
        let outlineMode = false;
        let outlineWidth = 2.0; 
        let sliceColor = new THREE.Color(0xffffff);
        
        // Point Settings
        let pointSize = DEFAULT_POINT_SIZE;
        let pointDrawFraction = DEFAULT_POINT_DENSITY;
        let sliceThickness = DEFAULT_SLICE_THICKNESS;
        let manualSliceThickness = DEFAULT_SLICE_THICKNESS;
        let sliceThicknessMode = 'frame-pitch';
        let showFullPointCloud = false;
        let cropEnabled = false;
        let cropControlsMode = 'scale';
        let cropBoxInitialized = false;
        let isSyncingCropControls = false;
        const cropPlanes = Array.from({ length: 6 }, () => new THREE.Plane());

        // Export State
        let isProcessingVideo = false;
        let captureScale = 1.0; 
        let preExportState = { width: 0, height: 0, pixelRatio: 1 };
        let activeUploadUrl = null;
        let modelLoadId = 0;
        let jsZipPromise = null;
        const gaussianSortMatrix = new THREE.Matrix4();

        function finiteNumber(value, fallback = 0) {
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function finiteInteger(value, fallback = 0) {
            const parsed = Number.parseInt(value, 10);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function sigmoid(value) {
            return 1 / (1 + Math.exp(-value));
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        function getSliceAxisDefinition(axis = sliceAxis) {
            return SLICE_AXES[axis] || SLICE_AXES.y;
        }

        function getAxisComponent(vector, axis = sliceAxis) {
            if (axis === 'x') return vector.x;
            if (axis === 'z') return vector.z;
            return vector.y;
        }

        function setAxisComponent(vector, axis, value) {
            if (axis === 'x') vector.x = value;
            else if (axis === 'z') vector.z = value;
            else vector.y = value;
        }

        function setObjectSlicePosition(object, value) {
            object.position.set(0, 0, 0);
            setAxisComponent(object.position, sliceAxis, value);
        }

        function configureCameraForSliceAxis(camera) {
            const axis = getSliceAxisDefinition();
            camera.position.copy(axis.cameraPosition);
            camera.up.copy(axis.cameraUp);
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
        }

        function configureSliceGeometry() {
            const axis = getSliceAxisDefinition();
            if (clippingPlane) clippingPlane.normal.copy(axis.negative);
            slabPlaneBottom.normal.copy(axis.vector);
            slabPlaneTop.normal.copy(axis.negative);
            if (capMesh) capMesh.quaternion.setFromUnitVectors(PLANE_NORMAL, axis.negative);
            if (frameHelper) frameHelper.quaternion.setFromUnitVectors(PLANE_NORMAL, axis.vector);
        }

        function updateSliceAxisUI() {
            const axis = getSliceAxisDefinition();
            const label = document.getElementById('slice-label');
            if (label) label.textContent = `Slice Position (${axis.label})`;
        }

        function setSliceAxis(axis) {
            if (!SLICE_AXES[axis]) axis = 'y';
            sliceAxis = axis;
            configureSliceGeometry();
            updateBounds();
            refreshSliceThicknessFromMode();
            updateFrameHelper();
            updateSliceAxisUI();
            if (viewMode === '2d') setMode('2d');
        }

        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return '0 MB';
            const units = ['B', 'KB', 'MB', 'GB'];
            let value = bytes;
            let unit = 0;
            while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit++;
            }
            return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
        }

        function formatSliceThickness(value) {
            if (value < 0.001) return value.toFixed(5);
            if (value < 0.01) return value.toFixed(4);
            return value.toFixed(3);
        }

        function formatFineValue(value) {
            if (value < 0.01) return value.toFixed(4);
            if (value < 0.1) return value.toFixed(3);
            return value.toFixed(2);
        }

        function valueToLogSlider(value, min, max) {
            const safeValue = clamp(Math.max(value, min), min, max);
            return clamp(Math.log(safeValue / min) / Math.log(max / min), 0, 1);
        }

        function logSliderToValue(value, min, max) {
            const t = clamp(finiteNumber(value, 0), 0, 1);
            return min * Math.pow(max / min, t);
        }

        function setPointSize(value, source = '') {
            pointSize = clamp(finiteNumber(value, pointSize), POINT_SIZE_MIN, POINT_SIZE_MAX);
            const slider = document.getElementById('point-size');
            const input = document.getElementById('point-size-val');
            if (slider && source !== 'slider') slider.value = valueToLogSlider(pointSize, POINT_SIZE_MIN, POINT_SIZE_MAX).toFixed(3);
            if (input && source !== 'input') input.value = formatFineValue(pointSize);
            pointMaterials.forEach(m => m.uniforms.size.value = pointSize);
            gaussianMaterials.forEach(m => m.uniforms.size.value = pointSize);
        }

        function setCaptureScale(value, source = '') {
            captureScale = clamp(finiteNumber(value, captureScale), FRAME_SCALE_MIN, FRAME_SCALE_MAX);
            const slider = document.getElementById('zoom-slider');
            const input = document.getElementById('zoom-val');
            if (slider && source !== 'slider') slider.value = valueToLogSlider(captureScale, FRAME_SCALE_MIN, FRAME_SCALE_MAX).toFixed(3);
            if (input && source !== 'input') input.value = captureScale.toFixed(3);
            updateFrameHelper();
        }

        function getActiveExportFrameCount(settings) {
            const totalFrames = getTotalExportFrames(settings);
            return Math.max(1, totalFrames - settings.blankFrames * 2);
        }

        function getPitchMatchedSliceThickness(settings) {
            const span = Math.max(0, modelBounds.max - modelBounds.min);
            const activeFrames = getActiveExportFrameCount(settings);
            if (span <= 0) return SLICE_THICKNESS_MIN;
            if (activeFrames <= 1) return Math.max(SLICE_THICKNESS_MIN, span);
            const pathMultiplier = settings.motionProfile === 'pingpong' ? 2 : 1;
            return Math.max(SLICE_THICKNESS_MIN, (span * pathMultiplier) / (activeFrames - 1));
        }

        function resolveSliceThicknessForSettings(settings) {
            if (settings.sliceThicknessMode === 'frame-pitch') {
                return getPitchMatchedSliceThickness(settings);
            }
            return clamp(manualSliceThickness, SLICE_THICKNESS_MIN, SLICE_THICKNESS_MAX);
        }

        function syncSliceThicknessControls() {
            const modeEl = document.getElementById('slice-thickness-mode');
            const slider = document.getElementById('point-thick');
            const valueEl = document.getElementById('point-thick-val');
            if (!modeEl || !slider || !valueEl) return;

            const isAuto = sliceThicknessMode === 'frame-pitch';
            modeEl.value = sliceThicknessMode;
            slider.disabled = isAuto;
            slider.classList.toggle('opacity-50', isAuto);
            slider.classList.toggle('cursor-not-allowed', isAuto);
            slider.value = clamp(manualSliceThickness, SLICE_THICKNESS_MIN, SLICE_THICKNESS_MAX);
            valueEl.textContent = `${formatSliceThickness(sliceThickness)}${isAuto ? ' pitch' : ''}`;
        }

        function refreshSliceThicknessFromMode(updatePlane = true) {
            const modeEl = document.getElementById('slice-thickness-mode');
            sliceThicknessMode = modeEl?.value || sliceThicknessMode;
            const settings = getExportSettings();
            sliceThickness = settings.sliceThicknessModelUnits;
            syncSliceThicknessControls();
            if (updatePlane) updatePlaneHeight(document.getElementById('slice-slider').value);
        }

        function setSliceWindowUniforms(enabled, center = 0, thickness = 0) {
            const axis = getSliceAxisDefinition().vector;
            const half = Math.max(0, thickness) / 2;
            const min = center - half;
            const max = center + half;
            const apply = (material) => {
                if (!material?.uniforms?.uUseSliceWindow) return;
                material.uniforms.uUseSliceWindow.value = enabled ? 1.0 : 0.0;
                material.uniforms.uSliceAxis.value.copy(axis);
                material.uniforms.uSliceMin.value = enabled ? min : -1e20;
                material.uniforms.uSliceMax.value = enabled ? max : 1e20;
            };
            pointMaterials.forEach(apply);
            gaussianMaterials.forEach(apply);
        }

        function getPointClippingPlanes(useSlab) {
            const planes = [];
            if (useSlab) planes.push(slabPlaneTop, slabPlaneBottom);
            if (cropEnabled) planes.push(...cropPlanes);
            return planes;
        }

        function isCropRenderableStyle() {
            return renderStyle === 'points' || renderStyle === 'gaussian';
        }

        function normalizeDegrees(value) {
            return ((((value + 180) % 360) + 360) % 360) - 180;
        }

        function setCropPlane(index, normal, point) {
            cropPlanes[index].normal.copy(normal);
            cropPlanes[index].constant = -normal.dot(point);
        }

        function updateCropPlanes() {
            if (!cropBox) return;
            cropBox.updateMatrixWorld(true);

            const center = cropBox.getWorldPosition(new THREE.Vector3());
            const rotation = cropBox.getWorldQuaternion(new THREE.Quaternion());
            const scale = cropBox.getWorldScale(new THREE.Vector3());
            const axes = [
                new THREE.Vector3(1, 0, 0).applyQuaternion(rotation).normalize(),
                new THREE.Vector3(0, 1, 0).applyQuaternion(rotation).normalize(),
                new THREE.Vector3(0, 0, 1).applyQuaternion(rotation).normalize()
            ];
            const halfExtents = [
                Math.max(CROP_MIN_SIZE, Math.abs(scale.x)) / 2,
                Math.max(CROP_MIN_SIZE, Math.abs(scale.y)) / 2,
                Math.max(CROP_MIN_SIZE, Math.abs(scale.z)) / 2
            ];

            axes.forEach((axis, axisIndex) => {
                const facePoint = center.clone().addScaledVector(axis, halfExtents[axisIndex]);
                setCropPlane(axisIndex * 2, axis.clone().negate(), facePoint);
                const oppositeNormal = axis.clone();
                const oppositePoint = center.clone().addScaledVector(axis, -halfExtents[axisIndex]);
                setCropPlane(axisIndex * 2 + 1, oppositeNormal, oppositePoint);
            });
        }

        function setCropInputValue(id, value) {
            const input = document.getElementById(id);
            if (!input || document.activeElement === input) return;
            input.value = value;
        }

        function syncCropControlsFromBox() {
            if (!cropBox) return;
            isSyncingCropControls = true;
            setCropInputValue('crop-pos-x', cropBox.position.x.toFixed(2));
            setCropInputValue('crop-pos-y', cropBox.position.y.toFixed(2));
            setCropInputValue('crop-pos-z', cropBox.position.z.toFixed(2));
            setCropInputValue('crop-size-x', Math.abs(cropBox.scale.x).toFixed(2));
            setCropInputValue('crop-size-y', Math.abs(cropBox.scale.y).toFixed(2));
            setCropInputValue('crop-size-z', Math.abs(cropBox.scale.z).toFixed(2));
            setCropInputValue('crop-rot-x', normalizeDegrees(THREE.MathUtils.radToDeg(cropBox.rotation.x)).toFixed(0));
            setCropInputValue('crop-rot-y', normalizeDegrees(THREE.MathUtils.radToDeg(cropBox.rotation.y)).toFixed(0));
            setCropInputValue('crop-rot-z', normalizeDegrees(THREE.MathUtils.radToDeg(cropBox.rotation.z)).toFixed(0));
            isSyncingCropControls = false;
        }

        function sanitizeCropBoxTransform() {
            if (!cropBox) return;
            cropBox.scale.set(
                Math.max(CROP_MIN_SIZE, Math.abs(cropBox.scale.x)),
                Math.max(CROP_MIN_SIZE, Math.abs(cropBox.scale.y)),
                Math.max(CROP_MIN_SIZE, Math.abs(cropBox.scale.z))
            );
        }

        function applyCropControlsToBox() {
            if (!cropBox || isSyncingCropControls) return;
            cropBox.position.set(
                finiteNumber(document.getElementById('crop-pos-x').value, cropBox.position.x),
                finiteNumber(document.getElementById('crop-pos-y').value, cropBox.position.y),
                finiteNumber(document.getElementById('crop-pos-z').value, cropBox.position.z)
            );
            cropBox.scale.set(
                Math.max(CROP_MIN_SIZE, finiteNumber(document.getElementById('crop-size-x').value, Math.abs(cropBox.scale.x))),
                Math.max(CROP_MIN_SIZE, finiteNumber(document.getElementById('crop-size-y').value, Math.abs(cropBox.scale.y))),
                Math.max(CROP_MIN_SIZE, finiteNumber(document.getElementById('crop-size-z').value, Math.abs(cropBox.scale.z)))
            );
            cropBox.rotation.set(
                THREE.MathUtils.degToRad(normalizeDegrees(finiteNumber(document.getElementById('crop-rot-x').value, THREE.MathUtils.radToDeg(cropBox.rotation.x)))),
                THREE.MathUtils.degToRad(normalizeDegrees(finiteNumber(document.getElementById('crop-rot-y').value, THREE.MathUtils.radToDeg(cropBox.rotation.y)))),
                THREE.MathUtils.degToRad(normalizeDegrees(finiteNumber(document.getElementById('crop-rot-z').value, THREE.MathUtils.radToDeg(cropBox.rotation.z)))),
                'XYZ'
            );
            cropBoxInitialized = true;
            updateCropPlanes();
            syncCropControlsFromBox();
        }

        function fitCropBoxToModel() {
            const boundsWrapper = getBoundsWrapper();
            if (!cropBox || !boundsWrapper) return;
            boundsWrapper.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(boundsWrapper);
            if (box.isEmpty()) return;

            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3()).multiplyScalar(CROP_FIT_PADDING);
            cropBox.position.copy(center);
            cropBox.rotation.set(0, 0, 0);
            cropBox.scale.set(
                Math.max(CROP_MIN_SIZE, size.x),
                Math.max(CROP_MIN_SIZE, size.y),
                Math.max(CROP_MIN_SIZE, size.z)
            );
            cropBoxInitialized = true;
            updateCropPlanes();
            syncCropControlsFromBox();
        }

        function updateCropModeButtons() {
            const inactive = "text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors";
            const active = "text-[10px] font-bold py-1 rounded bg-cyan-600 text-white transition-colors shadow";
            ['move', 'scale', 'rotate'].forEach((mode) => {
                const button = document.getElementById(`crop-mode-${mode}`);
                if (button) button.className = mode === cropControlsMode ? active : inactive;
            });
        }

        function setCropControlsMode(mode) {
            if (!['move', 'scale', 'rotate'].includes(mode)) mode = 'scale';
            cropControlsMode = mode;
            if (cropTransformControls) {
                cropTransformControls.setMode(mode === 'move' ? 'translate' : mode);
                cropTransformControls.setSpace('local');
            }
            updateCropModeButtons();
        }

        function updateCropTransformCamera() {
            if (!cropTransformControls || !activeCamera) return;
            cropTransformControls.camera = activeCamera;
        }

        function updateCropHelperVisibility() {
            const visible = cropEnabled && isCropRenderableStyle() && !isProcessingVideo;
            if (cropBox) cropBox.visible = visible;
            if (cropTransformControls) {
                updateCropTransformCamera();
                if (cropTransformControls.object !== cropBox && cropBox) cropTransformControls.attach(cropBox);
                cropTransformControls.visible = visible;
                cropTransformControls.enabled = visible;
            }
        }

        function setCropEnabled(enabled) {
            cropEnabled = enabled;
            const checkbox = document.getElementById('crop-enabled');
            if (checkbox) checkbox.checked = cropEnabled;
            if (cropEnabled && !cropBoxInitialized) fitCropBoxToModel();
            updateCropPlanes();
            applyPointClippingPlanes(!showFullPointCloud);
            updateCropHelperVisibility();
            syncCropControlsFromBox();
        }

        function createCropBoxHelper() {
            cropBox = new THREE.Group();
            cropBox.name = 'Crop Cuboid';
            cropBox.renderOrder = 20;
            cropBox.visible = false;

            const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
            const fillMaterial = new THREE.MeshBasicMaterial({
                color: 0x22d3ee,
                transparent: true,
                opacity: 0.08,
                depthTest: false,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            cropBoxFill = new THREE.Mesh(boxGeometry, fillMaterial);
            cropBoxFill.renderOrder = 20;
            cropBox.add(cropBoxFill);

            const edgeGeometry = new THREE.EdgesGeometry(boxGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({
                color: 0x67e8f9,
                transparent: true,
                opacity: 0.95,
                depthTest: false,
                depthWrite: false
            });
            cropBoxEdges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            cropBoxEdges.renderOrder = 21;
            cropBox.add(cropBoxEdges);
            scene.add(cropBox);

            if (THREE.TransformControls) {
                cropTransformControls = new THREE.TransformControls(activeCamera, renderer.domElement);
                cropTransformControls.size = 0.85;
                cropTransformControls.visible = false;
                cropTransformControls.enabled = false;
                cropTransformControls.attach(cropBox);
                cropTransformControls.setSpace('local');
                cropTransformControls.setMode('scale');
                cropTransformControls.addEventListener('dragging-changed', (event) => {
                    controls.enabled = !event.value;
                });
                cropTransformControls.addEventListener('objectChange', () => {
                    sanitizeCropBoxTransform();
                    cropBoxInitialized = true;
                    updateCropPlanes();
                    syncCropControlsFromBox();
                });
                scene.add(cropTransformControls);
            }

            cropBox.scale.set(2, 2, 2);
            updateCropPlanes();
            syncCropControlsFromBox();
        }

        function isPointInsideCropVolume(worldPoint) {
            for (let i = 0; i < cropPlanes.length; i++) {
                if (cropPlanes[i].distanceToPoint(worldPoint) < -1e-6) return false;
            }
            return true;
        }

        function buildCropKeepMaskFromPositions(positionAttr, matrixWorld) {
            const count = positionAttr?.count || 0;
            const keepMask = new Uint8Array(count);
            const worldPoint = new THREE.Vector3();
            let keepCount = 0;

            for (let i = 0; i < count; i++) {
                worldPoint.fromBufferAttribute(positionAttr, i).applyMatrix4(matrixWorld);
                if (isPointInsideCropVolume(worldPoint)) {
                    keepMask[i] = 1;
                    keepCount++;
                }
            }

            return { keepMask, keepCount, sourceCount: count };
        }

        function createFilteredGeometry(sourceGeometry, keepMask, keepCount) {
            const filtered = new THREE.BufferGeometry();
            Object.keys(sourceGeometry.attributes).forEach((name) => {
                const attr = sourceGeometry.attributes[name];
                if (!attr?.array || attr.isInterleavedBufferAttribute) return;

                const SourceArray = attr.array.constructor;
                const itemSize = attr.itemSize;
                const nextArray = new SourceArray(keepCount * itemSize);
                let out = 0;

                for (let i = 0; i < keepMask.length; i++) {
                    if (!keepMask[i]) continue;
                    const src = i * itemSize;
                    for (let j = 0; j < itemSize; j++) {
                        nextArray[out++] = attr.array[src + j];
                    }
                }

                filtered.setAttribute(name, new THREE.BufferAttribute(nextArray, itemSize, attr.normalized));
            });

            filtered.userData = { ...sourceGeometry.userData, previewIndexReady: false, previewCount: 0 };
            return filtered;
        }

        function createPointCropResult(points) {
            const geometry = points.geometry;
            const position = geometry?.attributes?.position;
            if (!position) return null;

            points.updateMatrixWorld(true);
            const { keepMask, keepCount, sourceCount } = buildCropKeepMaskFromPositions(position, points.matrixWorld);
            return {
                type: 'points',
                node: points,
                before: sourceCount,
                after: keepCount,
                geometry: keepCount === sourceCount ? null : createFilteredGeometry(geometry, keepMask, keepCount)
            };
        }

        function createGaussianCropResult(rendererNode) {
            const sourceGeometry = rendererNode.userData.sourceGeometry;
            const position = sourceGeometry?.attributes?.position;
            if (!position) return null;

            rendererNode.updateMatrixWorld(true);
            const { keepMask, keepCount, sourceCount } = buildCropKeepMaskFromPositions(position, rendererNode.matrixWorld);
            return {
                type: 'gaussian',
                node: rendererNode,
                before: sourceCount,
                after: keepCount,
                geometry: keepCount === sourceCount ? null : createFilteredGeometry(sourceGeometry, keepMask, keepCount)
            };
        }

        function applyPointCropResult(result) {
            if (!result.geometry) return;
            const oldGeometry = result.node.geometry;
            result.node.geometry = result.geometry;
            result.node.userData.maxCount = preparePreviewDensityGeometry(result.geometry);
            if (oldGeometry && oldGeometry !== result.geometry) oldGeometry.dispose();
        }

        function applyGaussianCropResult(result) {
            if (!result.geometry) return;
            const node = result.node;
            const oldSourceGeometry = node.userData.sourceGeometry;
            const geometry = result.geometry;
            const maxCount = preparePreviewDensityGeometry(geometry);

            node.userData.sourceGeometry = geometry;
            node.userData.maxCount = maxCount;
            node.userData.drawCount = maxCount <= 0 ? 0 : Math.max(1, Math.floor(maxCount * pointDrawFraction));
            node.userData.previewIndices = geometry.index?.array || null;
            node.userData.order = new Uint32Array(maxCount);
            node.userData.depths = new Float32Array(maxCount);
            node.userData.lastSortTime = 0;
            node.userData.needsSort = true;
            node.userData.source = {
                positions: geometry.attributes.position?.array || new Float32Array(0),
                colors: geometry.attributes.color?.array || new Float32Array(0),
                opacities: geometry.attributes.opacity?.array || new Float32Array(0),
                scales: geometry.attributes.splatScale?.array || new Float32Array(0),
                rotations: geometry.attributes.splatRotation?.array || new Float32Array(0)
            };

            setGaussianRendererDrawCount(node, node.userData.drawCount);
            for (let i = 0; i < node.userData.drawCount; i++) {
                node.userData.order[i] = node.userData.previewIndices ? node.userData.previewIndices[i] : i;
            }
            copyGaussianInstances(node, node.userData.drawCount);
            if (oldSourceGeometry && oldSourceGeometry !== geometry && oldSourceGeometry !== node.geometry) oldSourceGeometry.dispose();
        }

        function collectCropResults() {
            const results = [];
            pointGroup.updateMatrixWorld(true);
            gaussianGroup.updateMatrixWorld(true);

            pointGroup.traverse((node) => {
                if (!node.isPoints) return;
                const result = createPointCropResult(node);
                if (result) results.push(result);
            });

            gaussianGroup.traverse((node) => {
                if (!node.userData.isGaussianSplatRenderer) return;
                const result = createGaussianCropResult(node);
                if (result) results.push(result);
            });

            return results;
        }

        function refreshAfterPointDataChange() {
            updatePointDensity();
            if (renderStyle === 'gaussian') updateGaussianDepthSorting(true);
            updateBounds();
            refreshSliceThicknessFromMode();
            fitCropBoxToModel();
            updateFrameHelper();
            updateCropHelperVisibility();
        }

        function applyCropToPointData() {
            if (!cropBox || !activeWrappers.points) {
                alert("No point cloud data is available to crop.");
                return;
            }

            updateCropPlanes();
            const results = collectCropResults();
            const before = results.reduce((sum, result) => sum + result.before, 0);
            const after = results.reduce((sum, result) => sum + result.after, 0);

            if (before <= 0) {
                alert("No point cloud data is available to crop.");
                return;
            }
            if (after <= 0) {
                alert("The crop cuboid does not contain any points.");
                return;
            }

            results.forEach((result) => {
                if (result.type === 'points') applyPointCropResult(result);
                else if (result.type === 'gaussian') applyGaussianCropResult(result);
            });

            setCropEnabled(false);
            refreshAfterPointDataChange();
        }

        function getPointExportNodes() {
            const nodes = [];
            pointGroup.updateMatrixWorld(true);
            pointGroup.traverse((node) => {
                if (node.isPoints && node.geometry?.attributes?.position) nodes.push(node);
            });
            return nodes;
        }

        function materialDiffuseColor(material) {
            const mat = Array.isArray(material) ? material[0] : material;
            if (mat?.uniforms?.diffuse?.value) return mat.uniforms.diffuse.value;
            if (mat?.color) return mat.color;
            return new THREE.Color(1, 1, 1);
        }

        function colorComponentToByte(value, normalized = false) {
            const scaled = value <= 1 ? value * 255 : value;
            return clamp(Math.round(finiteNumber(scaled, 255)), 0, 255);
        }

        function getTextureImageData(texture) {
            if (!texture || !texture.image) return null;
            if (texture.userData && texture.userData.imageData) return texture.userData.imageData;
            const img = texture.image;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0, img.width, img.height);
                const data = ctx.getImageData(0, 0, img.width, img.height);
                texture.userData = texture.userData || {};
                texture.userData.imageData = data;
                return data;
            } catch (e) {
                return null;
            }
        }

        function pointColorBytes(node, index, fallbackColor) {
            const colorAttr = node.geometry.attributes.color;
            const uvAttr = node.geometry.attributes.uv;
            let r = fallbackColor.r !== undefined ? fallbackColor.r : 1;
            let g = fallbackColor.g !== undefined ? fallbackColor.g : 1;
            let b = fallbackColor.b !== undefined ? fallbackColor.b : 1;

            if (colorAttr) {
                r *= colorAttr.getX(index);
                g *= colorAttr.getY(index);
                b *= colorAttr.getZ(index);
            }

            const map = node.material?.uniforms?.map?.value;
            if (map && uvAttr) {
                const imgData = getTextureImageData(map);
                if (imgData) {
                    let u = uvAttr.getX(index);
                    let v = uvAttr.getY(index);
                    u = u - Math.floor(u);
                    v = v - Math.floor(v);
                    if (map.flipY !== false) v = 1.0 - v;
                    const x = Math.min(imgData.width - 1, Math.max(0, Math.floor(u * imgData.width)));
                    const y = Math.min(imgData.height - 1, Math.max(0, Math.floor(v * imgData.height)));
                    const idx = (y * imgData.width + x) * 4;
                    r *= imgData.data[idx] / 255;
                    g *= imgData.data[idx + 1] / 255;
                    b *= imgData.data[idx + 2] / 255;
                }
            }

            return [
                colorComponentToByte(r, true),
                colorComponentToByte(g, true),
                colorComponentToByte(b, true)
            ];
        }

        function formatPlyNumber(value) {
            return Number.isFinite(value) ? Number(value).toPrecision(8) : '0';
        }

        function countPlyExportPoints(nodes, useCrop) {
            if (useCrop) updateCropPlanes();
            const worldPoint = new THREE.Vector3();
            let count = 0;
            nodes.forEach((node) => {
                const position = node.geometry.attributes.position;
                node.updateMatrixWorld(true);
                for (let i = 0; i < position.count; i++) {
                    worldPoint.fromBufferAttribute(position, i).applyMatrix4(node.matrixWorld);
                    if (!useCrop || isPointInsideCropVolume(worldPoint)) count++;
                }
            });
            return count;
        }

        function buildPlyExportBlob(nodes, vertexCount, useCrop) {
            const chunks = [
                'ply\n',
                'format ascii 1.0\n',
                `element vertex ${vertexCount}\n`,
                'property float x\n',
                'property float y\n',
                'property float z\n',
                'property uchar red\n',
                'property uchar green\n',
                'property uchar blue\n',
                'end_header\n'
            ];
            const worldPoint = new THREE.Vector3();
            let lineBuffer = [];

            nodes.forEach((node) => {
                const position = node.geometry.attributes.position;
                const fallbackColor = materialDiffuseColor(node.material);
                node.updateMatrixWorld(true);

                for (let i = 0; i < position.count; i++) {
                    worldPoint.fromBufferAttribute(position, i).applyMatrix4(node.matrixWorld);
                    if (useCrop && !isPointInsideCropVolume(worldPoint)) continue;

                    const color = pointColorBytes(node, i, fallbackColor);
                    lineBuffer.push(`${formatPlyNumber(worldPoint.x)} ${formatPlyNumber(worldPoint.y)} ${formatPlyNumber(worldPoint.z)} ${color[0]} ${color[1]} ${color[2]}\n`);
                    if (lineBuffer.length >= 50000) {
                        chunks.push(lineBuffer.join(''));
                        lineBuffer = [];
                    }
                }
            });

            if (lineBuffer.length) chunks.push(lineBuffer.join(''));
            return new Blob(chunks, { type: 'application/octet-stream' });
        }

        function exportCurrentPointCloudPly() {
            const nodes = getPointExportNodes();
            if (!nodes.length) {
                alert("No point cloud data is available to export.");
                return;
            }

            const useCrop = cropEnabled && cropBox;
            const vertexCount = countPlyExportPoints(nodes, useCrop);
            if (vertexCount <= 0) {
                alert("The crop cuboid does not contain any points to export.");
                return;
            }

            if (vertexCount > 1000000) {
                const ok = confirm(`This PLY will export ${vertexCount.toLocaleString()} points and may take a moment. Continue?`);
                if (!ok) return;
            }

            const blob = buildPlyExportBlob(nodes, vertexCount, useCrop);
            const suffix = useCrop ? 'cropped_rotated' : 'rotated';
            downloadBlob(blob, `point_cloud_${suffix}_${vertexCount}.ply`);
        }

        function yieldToBrowser() {
            return new Promise(resolve => setTimeout(resolve, 0));
        }

        function writeNormalizedQuaternion(target, index, x, y, z, w) {
            const length = Math.hypot(x, y, z, w) || 1;
            const offset = index * 4;
            target[offset] = x / length;
            target[offset + 1] = y / length;
            target[offset + 2] = z / length;
            target[offset + 3] = w / length;
        }

        function decodeByteQuaternion(view, offset, target, index) {
            const x = (view.getUint8(offset) - 128) / 128;
            const y = (view.getUint8(offset + 1) - 128) / 128;
            const z = (view.getUint8(offset + 2) - 128) / 128;
            const w = (view.getUint8(offset + 3) - 128) / 128;
            writeNormalizedQuaternion(target, index, x, y, z, w);
        }

        function greatestCommonDivisor(a, b) {
            while (b !== 0) {
                const next = a % b;
                a = b;
                b = next;
            }
            return Math.abs(a);
        }

        function loadJSZip() {
            if (!jsZipPromise) {
                jsZipPromise = import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm').then(module => module.default);
            }
            return jsZipPromise;
        }

        function evenPositiveInteger(value, fallback) {
            const next = Math.max(2, finiteInteger(value, fallback));
            return next % 2 === 0 ? next : next - 1;
        }

        function revokeBlobUrl(url) {
            if (url && url.startsWith('blob:')) URL.revokeObjectURL(url);
        }

        function revokeActiveUploadUrl() {
            revokeBlobUrl(activeUploadUrl);
            activeUploadUrl = null;
        }

        function disposeMaterial(material) {
            if (!material || material === backMat || material === frontMat || material === capMaterial || material === postMaterial) return;
            Object.keys(material).forEach((key) => {
                const value = material[key];
                if (value && value.isTexture) value.dispose();
            });
            material.dispose();
        }

        function disposeObject(object) {
            object.traverse((node) => {
                if (node.geometry) node.geometry.dispose();
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                materials.forEach(disposeMaterial);
            });
        }

        function clearGroup(group) {
            while (group.children.length > 0) {
                const child = group.children[group.children.length - 1];
                group.remove(child);
                disposeObject(child);
            }
        }

        function disposeRenderTarget() {
            if (!renderTarget) return;
            renderTarget.dispose();
            renderTarget = null;
        }

        // --- INIT ---
        function init() {
            const container = document.getElementById('canvas-container');
            const aspect = window.innerWidth / window.innerHeight;

            // 1. Main Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); 

            // 2. Cameras
            // A. Perspective (Default 3D)
            perspectiveCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            perspectiveCamera.position.set(3, 2, 4);

            // B. Ortho 2D (Top Down)
            const fH = FRUSTUM_SIZE;
            const fW = fH * aspect;
            orthoCamera = new THREE.OrthographicCamera(-fW / 2, fW / 2, fH / 2, -fH / 2, 0.1, 100);
            configureCameraForSliceAxis(orthoCamera);
            
            // C. Ortho 3D (Interactive)
            // Initial frustum similar to perspective view at distance
            orthoCamera3D = new THREE.OrthographicCamera(-fW / 2, fW / 2, fH / 2, -fH / 2, 0.1, 100);
            orthoCamera3D.position.copy(perspectiveCamera.position);
            orthoCamera3D.lookAt(0,0,0);

            activeCamera = perspectiveCamera;

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.localClippingEnabled = true; 
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Render Target
            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });

            // 5. Post-Processing
            postScene = new THREE.Scene();
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: null },
                    uResolution: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
                    uColor: { value: sliceColor },
                    uOutlineWidth: { value: outlineWidth },
                    uIsOutline: { value: 0 } 
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform vec2 uResolution;
                    uniform vec3 uColor;
                    uniform float uOutlineWidth;
                    uniform float uIsOutline;
                    varying vec2 vUv;

                    void main() {
                        vec4 center = texture2D(tDiffuse, vUv);
                        if (uIsOutline < 0.5) {
                            if (center.a > 0.0) gl_FragColor = vec4(uColor, 1.0);
                            else discard;
                            return;
                        }
                        if (center.a > 0.5) {
                            float w = uOutlineWidth;
                            vec2 pixelSize = vec2(1.0) / uResolution;
                            float n1 = texture2D(tDiffuse, vUv + vec2(0.0, w) * pixelSize).a;
                            float n2 = texture2D(tDiffuse, vUv + vec2(0.0, -w) * pixelSize).a;
                            float n3 = texture2D(tDiffuse, vUv + vec2(w, 0.0) * pixelSize).a;
                            float n4 = texture2D(tDiffuse, vUv + vec2(-w, 0.0) * pixelSize).a;
                            if (n1 < 0.5 || n2 < 0.5 || n3 < 0.5 || n4 < 0.5) gl_FragColor = vec4(uColor, 1.0); 
                            else discard; 
                        } else {
                            discard; 
                        }
                    }
                `,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            postMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
            postScene.add(postMesh);

            // 6. Controls
            controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
