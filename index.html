<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Slicer & Exporter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        /* Custom Color Picker Styling */
        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            padding: 0;
            width: 100%;
            height: 32px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #475569;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- UI Container -->
    <div class="absolute top-4 left-4 z-20 w-80 flex flex-col items-start pointer-events-none">
        
        <!-- Main Panel -->
        <div id="controls-panel" class="bg-gray-900/90 backdrop-blur-md rounded-xl shadow-2xl border border-gray-800 pointer-events-auto overflow-hidden transition-all duration-300 w-full">
            
            <!-- Header -->
            <div class="flex items-center justify-between p-4 bg-black/50 border-b border-gray-800 cursor-pointer hover:bg-gray-800/50" onclick="togglePanel()">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                    <h1 class="text-sm font-bold text-gray-100 tracking-wide">SLICE VISUALIZER V6.1</h1>
                </div>
                <button id="minimize-btn" class="text-gray-400 hover:text-white transition-transform transform rotate-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <!-- Content -->
            <div id="panel-content" class="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
                
                <!-- View Mode -->
                <div class="bg-black/40 p-1 rounded-lg border border-gray-800">
                    <div class="flex shadow-inner mb-2">
                        <button id="btn-3d" class="flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all bg-blue-600 text-white shadow-md">3D View</button>
                        <button id="btn-2d" class="flex-1 py-1.5 px-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white hover:bg-gray-800">2D Map</button>
                    </div>
                    
                    <!-- 3D Projection Toggle -->
                    <div id="projection-toggle" class="flex justify-end px-1">
                        <label class="flex items-center gap-2 text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white transition-colors">
                            <span>Use Orthographic Camera</span>
                            <input type="checkbox" id="ortho-3d-check" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600" onchange="toggle3DProjection(this.checked)">
                        </label>
                    </div>
                </div>

                <!-- Slice Control -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold uppercase text-gray-500">Z-Height</label>
                        <input type="number" id="slice-input" step="0.01" class="w-20 bg-blue-900/20 text-blue-400 text-xs font-mono px-2 py-0.5 rounded border border-blue-900/30 outline-none text-right hover:border-blue-500 focus:border-blue-500 transition-colors" value="0.00">
                    </div>
                    <input type="range" id="slice-slider" min="-1" max="1" step="0.01" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400">
                </div>

                <!-- Automation -->
                <div class="bg-black/20 rounded-lg p-3 border border-gray-800 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-gray-400">Auto Scan</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="anim-toggle" class="sr-only peer">
                            <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-gray-500 mb-1 block">Speed</label>
                        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="0.5" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    </div>
                </div>

                <!-- Orientation Controls -->
                <div class="space-y-2 pt-2 border-t border-gray-800">
                    <div class="flex justify-between items-center cursor-pointer select-none" onclick="document.getElementById('orientation-controls').classList.toggle('hidden');">
                         <label class="text-[10px] text-gray-500 uppercase font-bold hover:text-gray-300 transition-colors">Model Orientation</label>
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    <div id="orientation-controls" class="space-y-2 hidden pt-1">
                        <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                            <span>Flip Vertical</span>
                            <input type="checkbox" id="flip-model" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600">
                        </label>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-red-500 w-3">X</span>
                            <input type="range" id="rot-x" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-500">
                            <input type="number" id="num-rot-x" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-red-500 transition-colors">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-green-500 w-3">Y</span>
                            <input type="range" id="rot-y" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-500">
                            <input type="number" id="num-rot-y" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-green-500 transition-colors">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-blue-500 w-3">Z</span>
                            <input type="range" id="rot-z" min="0" max="360" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                            <input type="number" id="num-rot-z" min="0" max="360" value="0" class="w-10 bg-gray-800 text-white text-[10px] p-1 rounded border border-gray-600 outline-none text-right focus:border-blue-500 transition-colors">
                        </div>
                        <button onclick="resetOrientation()" class="w-full text-[10px] text-gray-500 hover:text-white bg-gray-800 hover:bg-gray-700 rounded py-1 mt-1 transition-colors">Reset Rotation</button>
                    </div>
                </div>

                <!-- Export Video Section -->
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700 space-y-3">
                    <div class="flex justify-between items-center">
                         <label class="text-xs font-bold uppercase text-red-400 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                            Export
                        </label>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold">Duration (s)</label>
                            <input type="number" id="export-duration" value="5" min="1" max="60" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold">FPS</label>
                            <select id="export-fps" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                                <option value="30">30</option>
                                <option value="60" selected>60</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Format</label>
                        <select id="export-format" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                            <option value="mp4" selected>MP4 Video</option>
                            <option value="png-sequence">PNG Frame Sequence (.zip)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Resolution (px)</label>
                        <div class="flex gap-2">
                             <input type="number" id="export-w" value="1080" placeholder="W" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                             <span class="text-gray-500 self-center">x</span>
                             <input type="number" id="export-h" value="1080" placeholder="H" class="w-full bg-gray-700 text-white text-xs p-1 rounded border border-gray-600 focus:border-blue-500 outline-none">
                        </div>
                    </div>
                    
                    <!-- Zoom & Frame Control -->
                    <div class="space-y-2 pt-1 border-t border-gray-700">
                        <div class="flex items-center justify-between">
                             <label class="text-[10px] text-gray-500 uppercase font-bold">Frame Scale</label>
                             <span id="zoom-val" class="text-[10px] text-blue-400 font-mono">1.0x</span>
                        </div>
                        <input type="range" id="zoom-slider" min="0.2" max="2.0" step="0.1" value="1.0" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        
                         <label class="flex items-center gap-2 cursor-pointer mt-1">
                            <input type="checkbox" id="show-frame" class="w-3 h-3 accent-red-500 rounded bg-gray-700 border-gray-600">
                            <span class="text-[10px] text-gray-400 uppercase font-bold select-none">Show Capture Frame</span>
                        </label>
                    </div>

                    <button id="btn-export" class="w-full py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded shadow transition-colors flex justify-center items-center gap-2">
                        <span id="export-button-label">Offline Render (MP4)</span>
                    </button>
                </div>

                <!-- Appearance -->
                <div class="space-y-3">
                     <label class="text-xs font-bold uppercase text-gray-500 block">Appearance</label>
                     
                     <!-- Render Style Switch -->
                     <div class="bg-gray-800/50 p-1 rounded grid grid-cols-3 gap-1">
                         <button id="style-mesh" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors" onclick="setRenderStyle('mesh')">Solid Mesh</button>
                         <button id="style-points" class="text-[10px] font-bold py-1 rounded bg-blue-600 text-white transition-colors shadow" onclick="setRenderStyle('points')">Point Cloud</button>
                         <button id="style-gaussian" class="text-[10px] font-bold py-1 rounded hover:bg-gray-700 text-gray-400 transition-colors" onclick="setRenderStyle('gaussian')">Gaussian</button>
                     </div>

                     <!-- Mesh Options -->
                     <div id="mesh-options" class="hidden space-y-3">
                         <div id="outline-controls" class="bg-gray-800/50 p-2 rounded border border-gray-700 space-y-2">
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Outline Only</span>
                                <input type="checkbox" id="outline-mode" class="w-3 h-3 accent-purple-500 rounded bg-gray-700 border-gray-600">
                            </label>
                            <div id="outline-settings" class="hidden space-y-1">
                                <div class="flex justify-between">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold">Thickness</label>
                                    <span id="outline-val" class="text-[10px] text-purple-400 font-mono">2 px</span>
                                </div>
                                <input type="range" id="outline-width" min="1" max="10" step="1" value="2" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
                            </div>
                         </div>

                         <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                            <span>Show 3D Mesh</span>
                            <input type="checkbox" id="show-mesh" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600" checked onchange="toggleMesh(this.checked)">
                         </label>

                         <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Slice Color</label>
                            <div class="relative w-full h-8 rounded-md overflow-hidden ring-1 ring-gray-700 hover:ring-gray-500 transition-all">
                                <input type="color" id="color-picker" value="#ffffff" oninput="setCapColor(this.value)">
                            </div>
                         </div>
                     </div>
                     
                     <!-- Point Options -->
                     <div id="point-options" class="space-y-3">
                        <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Point / Splat Size</label>
                                <span id="point-size-val" class="text-[10px] text-blue-400 font-mono">0.10</span>
                            </div>
                            <input type="range" id="point-size" min="0.02" max="1.0" step="0.005" value="0.10" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Preview Density</label>
                                <span id="point-count-val" class="text-[10px] text-blue-400 font-mono">10%</span>
                            </div>
                            <input type="range" id="point-count" min="0.01" max="1.0" step="0.01" value="0.10" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div>
                            <div class="flex justify-between">
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Slice Thickness</label>
                                <span id="point-thick-val" class="text-[10px] text-blue-400 font-mono">0.001</span>
                            </div>
                            <input type="range" id="point-thick" min="0.001" max="0.08" step="0.001" value="0.001" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                         </div>
                         <div class="pt-1 border-t border-gray-800">
                            <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                <span>Show Full Point Cloud</span>
                                <input type="checkbox" id="show-full-cloud" class="w-3 h-3 accent-blue-500 rounded bg-gray-700 border-gray-600">
                            </label>
                         </div>
                      </div>
                </div>

                <hr class="border-gray-800">

                <!-- Upload -->
                <div>
                    <div class="mb-2">
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Import As</label>
                        <select id="import-mode" class="w-full bg-gray-800 text-white text-xs p-1 rounded border border-gray-700 outline-none">
                            <option value="auto" selected>Auto Detect</option>
                            <option value="mesh">Mesh Surface</option>
                            <option value="points">Point Cloud</option>
                        </select>
                    </div>
                    <label class="flex flex-col w-full cursor-pointer hover:bg-gray-800/50 transition p-2 rounded border border-dashed border-gray-700 hover:border-blue-500 group mb-2">
                        <span class="text-xs font-bold text-gray-400 group-hover:text-blue-400 mb-1">Load Model or Point Cloud</span>
                        <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.ply,.splat,.sog" class="hidden"/>
                        <span class="text-[10px] text-gray-600 group-hover:text-gray-500">GLB, GLTF, OBJ, STL, PLY, SPLAT, SOG</span>
                    </label>
                    <button id="btn-reset" class="w-full py-1 text-[10px] font-bold text-gray-500 hover:text-white bg-transparent border border-gray-700 hover:bg-gray-700 rounded transition-all">
                        Reset to Default Model
                    </button>
                </div>
                
                 <!-- Status -->
                 <div id="loading-status" class="text-xs text-amber-400 font-mono hidden flex items-center gap-2">
                    <svg id="loading-spinner" class="animate-spin h-3 w-3 text-amber-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="status-text">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Recording Overlay with Progress -->
    <div id="rec-overlay" class="hidden absolute top-4 right-4 z-30 w-64 bg-gray-900/95 border border-gray-700 p-4 rounded-xl shadow-2xl backdrop-blur">
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-red-400 animate-pulse">Rendering...</span>
            <span id="rec-percentage" class="text-xs font-mono text-white">0%</span>
        </div>
        <div class="w-full bg-gray-700 rounded-full h-1.5 overflow-hidden">
            <div id="rec-progress-bar" class="bg-red-500 h-1.5 rounded-full" style="width: 0%"></div>
        </div>
        <p class="text-[10px] text-gray-500 mt-2">Offline Rendering. Safe Mode.</p>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container" class="cursor-move"></div>

    <script>
        // --- CONSTANTS ---
        const DEFAULT_MODEL = 'https://raw.githubusercontent.com/BetaNumeric/3dme/master/model/me.glb';
        const FRUSTUM_SIZE = 3.0;
        const MAX_POINTS = 5000000;
        const DEFAULT_POINT_SIZE = 0.1;
        const POINT_SIZE_MIN = 0.02;
        const POINT_SIZE_MAX = 1.0;
        const GAUSSIAN_REFERENCE_RADIUS = 0.012;
        const GAUSSIAN_MIN_RADIUS = 0.0015;
        const GAUSSIAN_MAX_RADIUS = 0.06;
        const DEFAULT_POINT_DENSITY = 0.1;
        const EXPORT_POINT_DENSITY = 1.0;
        const DEFAULT_SLICE_THICKNESS = 0.001;
        const SLICE_THICKNESS_MIN = 0.001;
        const SLICE_THICKNESS_MAX = 0.08;

        // --- VARIABLES ---
        let scene, renderer, controls;
        let perspectiveCamera, orthoCamera, activeCamera;
        let orthoCamera3D; // New camera for 3D ortho view
        let visualGroup, stencilGroup, capGroup;
        let pointGroup, gaussianGroup;
        let activeWrappers = { visual: null, back: null, front: null, points: null, gaussian: null };
        
        let clippingPlane;
        const slabPlaneTop = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
        const slabPlaneBottom = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        let capMesh;
        let frameHelper; 
        let isAnimate = false;
        let scanSpeed = 0.5;
        let time = 0;
        let modelBounds = { min: -1, max: 1 };
        let viewMode = '3d';
        let renderStyle = 'points';
        let flipModelVertical = false;
        let isOrtho3D = false; // Toggle state for 3D projection
        
        let capMaterial, backMat, frontMat;
        let pointMaterials = [];
        let gaussianMaterials = [];
        let isPanelOpen = true;
        
        // Post Processing Vars
        let renderTarget;
        let postScene, postCamera, postMesh;
        let postMaterial;

        // Settings
        let outlineMode = false;
        let outlineWidth = 2.0; 
        let sliceColor = new THREE.Color(0xffffff);
        
        // Point Settings
        let pointSize = DEFAULT_POINT_SIZE;
        let pointDrawFraction = DEFAULT_POINT_DENSITY;
        let sliceThickness = DEFAULT_SLICE_THICKNESS;
        let showFullPointCloud = false;

        // Export State
        let isProcessingVideo = false;
        let captureScale = 1.0; 
        let preExportState = { width: 0, height: 0, pixelRatio: 1 };
        let activeUploadUrl = null;
        let activeDownloadUrl = null;
        let modelLoadId = 0;
        let jsZipPromise = null;
        const gaussianSortMatrix = new THREE.Matrix4();

        function finiteNumber(value, fallback = 0) {
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function finiteInteger(value, fallback = 0) {
            const parsed = Number.parseInt(value, 10);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function sigmoid(value) {
            return 1 / (1 + Math.exp(-value));
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        function writeNormalizedQuaternion(target, index, x, y, z, w) {
            const length = Math.hypot(x, y, z, w) || 1;
            const offset = index * 4;
            target[offset] = x / length;
            target[offset + 1] = y / length;
            target[offset + 2] = z / length;
            target[offset + 3] = w / length;
        }

        function decodeByteQuaternion(view, offset, target, index) {
            const x = (view.getUint8(offset) - 128) / 128;
            const y = (view.getUint8(offset + 1) - 128) / 128;
            const z = (view.getUint8(offset + 2) - 128) / 128;
            const w = (view.getUint8(offset + 3) - 128) / 128;
            writeNormalizedQuaternion(target, index, x, y, z, w);
        }

        function greatestCommonDivisor(a, b) {
            while (b !== 0) {
                const next = a % b;
                a = b;
                b = next;
            }
            return Math.abs(a);
        }

        function loadJSZip() {
            if (!jsZipPromise) {
                jsZipPromise = import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm').then(module => module.default);
            }
            return jsZipPromise;
        }

        function evenPositiveInteger(value, fallback) {
            const next = Math.max(2, finiteInteger(value, fallback));
            return next % 2 === 0 ? next : next - 1;
        }

        function revokeBlobUrl(url) {
            if (url && url.startsWith('blob:')) URL.revokeObjectURL(url);
        }

        function revokeActiveUploadUrl() {
            revokeBlobUrl(activeUploadUrl);
            activeUploadUrl = null;
        }

        function disposeMaterial(material) {
            if (!material || material === backMat || material === frontMat || material === capMaterial || material === postMaterial) return;
            Object.keys(material).forEach((key) => {
                const value = material[key];
                if (value && value.isTexture) value.dispose();
            });
            material.dispose();
        }

        function disposeObject(object) {
            object.traverse((node) => {
                if (node.geometry) node.geometry.dispose();
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                materials.forEach(disposeMaterial);
            });
        }

        function clearGroup(group) {
            while (group.children.length > 0) {
                const child = group.children[group.children.length - 1];
                group.remove(child);
                disposeObject(child);
            }
        }

        function disposeRenderTarget() {
            if (!renderTarget) return;
            renderTarget.dispose();
            renderTarget = null;
        }

        // --- INIT ---
        function init() {
            const container = document.getElementById('canvas-container');
            const aspect = window.innerWidth / window.innerHeight;

            // 1. Main Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); 

            // 2. Cameras
            // A. Perspective (Default 3D)
            perspectiveCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            perspectiveCamera.position.set(3, 2, 4);

            // B. Ortho 2D (Top Down)
            const fH = FRUSTUM_SIZE;
            const fW = fH * aspect;
            orthoCamera = new THREE.OrthographicCamera(-fW / 2, fW / 2, fH / 2, -fH / 2, 0.1, 100);
            orthoCamera.position.set(0, 10, 0); 
            orthoCamera.lookAt(0, 0, 0);
            
            // C. Ortho 3D (Interactive)
            // Initial frustum similar to perspective view at distance
            orthoCamera3D = new THREE.OrthographicCamera(-fW / 2, fW / 2, fH / 2, -fH / 2, 0.1, 100);
            orthoCamera3D.position.copy(perspectiveCamera.position);
            orthoCamera3D.lookAt(0,0,0);

            activeCamera = perspectiveCamera;

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.localClippingEnabled = true; 
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Render Target
            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                stencilBuffer: true
            });

            // 5. Post-Processing
            postScene = new THREE.Scene();
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: null },
                    uResolution: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
                    uColor: { value: sliceColor },
                    uOutlineWidth: { value: outlineWidth },
                    uIsOutline: { value: 0 } 
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform vec2 uResolution;
                    uniform vec3 uColor;
                    uniform float uOutlineWidth;
                    uniform float uIsOutline;
                    varying vec2 vUv;

                    void main() {
                        vec4 center = texture2D(tDiffuse, vUv);
                        if (uIsOutline < 0.5) {
                            if (center.a > 0.0) gl_FragColor = vec4(uColor, 1.0);
                            else discard;
                            return;
                        }
                        if (center.a > 0.5) {
                            float w = uOutlineWidth;
                            vec2 pixelSize = vec2(1.0) / uResolution;
                            float n1 = texture2D(tDiffuse, vUv + vec2(0.0, w) * pixelSize).a;
                            float n2 = texture2D(tDiffuse, vUv + vec2(0.0, -w) * pixelSize).a;
                            float n3 = texture2D(tDiffuse, vUv + vec2(w, 0.0) * pixelSize).a;
                            float n4 = texture2D(tDiffuse, vUv + vec2(-w, 0.0) * pixelSize).a;
                            if (n1 < 0.5 || n2 < 0.5 || n3 < 0.5 || n4 < 0.5) gl_FragColor = vec4(uColor, 1.0); 
                            else discard; 
                        } else {
                            discard; 
                        }
                    }
                `,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            postMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
            postScene.add(postMesh);

            // 6. Controls
            controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 7. Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 1.2);
            dl.position.set(5, 10, 7);
            dl.castShadow = true;
            scene.add(dl);
            const rimLight = new THREE.DirectionalLight(0x4444ff, 0.5);
            rimLight.position.set(-5, 5, -5);
            scene.add(rimLight);

            // 8. Clipping Plane
            clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

            // 9. Initialize Groups
            visualGroup = new THREE.Group();
            stencilGroup = new THREE.Group();
            capGroup = new THREE.Group();
            pointGroup = new THREE.Group();
            gaussianGroup = new THREE.Group();
            pointGroup.visible = false;
            gaussianGroup.visible = false;
            
            visualGroup.renderOrder = 0;
            stencilGroup.renderOrder = 1;
            capGroup.renderOrder = 2;
            pointGroup.renderOrder = 3;
            gaussianGroup.renderOrder = 4;

            scene.add(visualGroup);
            scene.add(stencilGroup); 
            scene.add(capGroup);
            scene.add(pointGroup);
            scene.add(gaussianGroup);

            // 10. Helper
            const frameGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)); 
            const frameMat = new THREE.LineBasicMaterial({ color: 0xff0000, depthTest: false, depthWrite: false });
            frameHelper = new THREE.LineSegments(frameGeo, frameMat);
            frameHelper.rotation.x = -Math.PI / 2; 
            frameHelper.visible = false; 
            scene.add(frameHelper);

            // 11. Materials
            const stencilConfig = {
                depthWrite: false,
                depthTest: false,
                colorWrite: false,
                stencilWrite: true,
                stencilFunc: THREE.AlwaysStencilFunc,
                clippingPlanes: [clippingPlane],
                blending: THREE.NoBlending,
                fog: false
            };

            backMat = new THREE.MeshBasicMaterial({ 
                ...stencilConfig, 
                side: THREE.BackSide,
                stencilFail: THREE.IncrementWrapStencilOp,
                stencilZFail: THREE.IncrementWrapStencilOp,
                stencilZPass: THREE.IncrementWrapStencilOp
            });

            frontMat = new THREE.MeshBasicMaterial({ 
                ...stencilConfig,
                side: THREE.FrontSide,
                stencilFail: THREE.DecrementWrapStencilOp,
                stencilZFail: THREE.DecrementWrapStencilOp,
                stencilZPass: THREE.DecrementWrapStencilOp
            });

            capMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                stencilWrite: true,
                stencilRef: 0,
                stencilFunc: THREE.NotEqualStencilFunc, 
                stencilFail: THREE.KeepStencilOp,
                stencilZFail: THREE.KeepStencilOp,
                stencilZPass: THREE.KeepStencilOp,
                side: THREE.DoubleSide
            });

            const planeGeom = new THREE.PlaneGeometry(100, 100);
            capMesh = new THREE.Mesh(planeGeom, capMaterial);
            capMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, -1, 0));
            capMesh.renderOrder = 2; 
            capMesh.castShadow = false;
            capMesh.receiveShadow = true;
            capGroup.add(capMesh);

            // Load
            loadModel(DEFAULT_MODEL);

            // Events
            window.addEventListener('resize', onWindowResize);
            setupUI();
            
            // Start Loop
            renderer.setAnimationLoop(renderFrame);
        }

        // --- CORE RENDER FUNCTION ---
        function renderFrame() {
            if(isProcessingVideo) return; 

            // Update Point Uniforms every frame for camera switch
            const isOrtho = (activeCamera.isOrthographicCamera) ? 1.0 : 0.0;
            // Use active camera zoom to scale points in ortho mode
            const orthoZoom = activeCamera.zoom;
            
            pointMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = isOrtho;
                m.uniforms.uOrthoZoom.value = orthoZoom;
            });
            gaussianMaterials.forEach(m => {
                m.uniforms.uIsOrtho.value = isOrtho;
                m.uniforms.uOrthoZoom.value = orthoZoom;
                m.uniforms.uViewport.value.set(renderer.domElement.width, renderer.domElement.height);
            });

            if (isAnimate) {
                time += 0.01 * scanSpeed;
                const t = (time % 2);
                const alpha = t < 1 ? t : 2 - t; 
                const yPos = THREE.MathUtils.lerp(modelBounds.min, modelBounds.max, alpha);
                updatePlaneHeight(yPos);
            }
            
            if(frameHelper.visible) {
                frameHelper.position.y = finiteNumber(document.getElementById('slice-slider').value, frameHelper.position.y);
            }

            controls.update();
            
            if (renderStyle === 'points' || renderStyle === 'gaussian') {
                if (renderStyle === 'gaussian') updateGaussianDepthSorting(false);
                renderer.render(scene, activeCamera);
            } else {
                performMultiPassRender();
            }
        }

        function performMultiPassRender() {
            const currentBg = scene.background;
            const visVisible = visualGroup.visible;
            
            scene.background = null; 
            visualGroup.visible = false; 
            stencilGroup.visible = true; 
            capGroup.visible = true;     
            frameHelper.visible = false; 
            pointGroup.visible = false; 
            gaussianGroup.visible = false;

            renderer.setRenderTarget(renderTarget);
            renderer.clear();
            renderer.render(scene, activeCamera);
            
            renderer.setRenderTarget(null);
            scene.background = currentBg;
            visualGroup.visible = visVisible; 
            stencilGroup.visible = false; 
            capGroup.visible = false;     
            frameHelper.visible = document.getElementById('show-frame').checked && !isProcessingVideo;

            renderer.clear();
            if(visVisible) {
                renderer.render(scene, activeCamera);
            }

            postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
            postMaterial.uniforms.uIsOutline.value = outlineMode ? 1 : 0;
            
            renderer.autoClear = false;
            renderer.render(postScene, postCamera);
            renderer.autoClear = true;
            
            if(frameHelper.visible) {
                if(!visVisible) {
                    visualGroup.visible = false;
                    stencilGroup.visible = false;
                    capGroup.visible = false;
                    scene.background = null; 
                    renderer.autoClear = false;
                    renderer.render(scene, activeCamera);
                    renderer.autoClear = true;
                    scene.background = currentBg;
                }
            }
            
            visualGroup.visible = visVisible;
            stencilGroup.visible = true; 
            capGroup.visible = true;
        }

        // --- CUSTOM POINT SHADER ---
        const createPointMaterial = (texture, color, hasVertexColors = false, hasUv = false) => {
            const useTexture = !!texture && hasUv;
            return new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: texture || null },
                    size: { value: pointSize },
                    diffuse: { value: new THREE.Color(color) },
                    uIsOrtho: { value: 0.0 },
                    uOrthoZoom: { value: 1.0 }
                },
                vertexShader: `
                    ${hasVertexColors ? 'attribute vec3 color;' : ''}
                    uniform float size;
                    uniform float uIsOrtho;
                    uniform float uOrthoZoom;
                    ${useTexture ? 'varying vec2 vUv;' : ''}
                    ${hasVertexColors ? 'varying vec3 vColor;' : ''}
                    #include <clipping_planes_pars_vertex>
                    void main() {
                        ${useTexture ? 'vUv = uv;' : ''}
                        ${hasVertexColors ? 'vColor = color;' : ''}
                        vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                        
                        if (uIsOrtho > 0.5) {
                            // Ortho Size: Fixed pixel size * zoom factor (approx 60x scalar)
                            gl_PointSize = size * 60.0 * uOrthoZoom;
                        } else {
                            // Perspective Size: Attenuate by depth
                            gl_PointSize = size * ( 50.0 / -mvPosition.z );
                        }
                        
                        gl_Position = projectionMatrix * mvPosition;
                        #include <clipping_planes_vertex>
                    }
                `,
                fragmentShader: `
                    ${useTexture ? 'uniform sampler2D map;' : ''}
                    uniform vec3 diffuse;
                    ${useTexture ? 'varying vec2 vUv;' : ''}
                    ${hasVertexColors ? 'varying vec3 vColor;' : ''}
                    #include <clipping_planes_pars_fragment>
                    void main() {
                        #include <clipping_planes_fragment>
                        
                        vec4 color = vec4(diffuse, 1.0);
                        ${hasVertexColors ? 'color *= vec4(vColor, 1.0);' : ''}
                        ${useTexture ? 'color *= texture2D(map, vUv);' : ''}
                        
                        // Round Point
                        vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                        if (dot(cxy, cxy) > 1.0) discard;

                        gl_FragColor = color;
                    }
                `,
                clipping: true,
                transparent: false,
                clippingPlanes: showFullPointCloud ? [] : [slabPlaneTop, slabPlaneBottom]
            });
        };

        const createGaussianSplatMaterial = () => {
            return new THREE.ShaderMaterial({
                uniforms: {
                    size: { value: pointSize },
                    uIsOrtho: { value: 0.0 },
                    uOrthoZoom: { value: 1.0 },
                    uViewport: { value: new THREE.Vector2(1, 1) }
                },
                vertexShader: `
                    attribute vec2 quadPosition;
                    attribute vec3 instancePosition;
                    attribute vec3 instanceColor;
                    attribute float instanceOpacity;
                    attribute vec3 instanceScale;
                    attribute vec4 instanceRotation;
                    uniform float size;
                    uniform float uIsOrtho;
                    uniform float uOrthoZoom;
                    uniform vec2 uViewport;
                    varying vec3 vColor;
                    varying float vOpacity;
                    varying vec2 vGaussian;
                    #include <clipping_planes_pars_vertex>

                    mat3 quatToMat3(vec4 q) {
                        q = normalize(q);
                        float x = q.x, y = q.y, z = q.z, w = q.w;
                        float x2 = x + x, y2 = y + y, z2 = z + z;
                        float xx = x * x2, xy = x * y2, xz = x * z2;
                        float yy = y * y2, yz = y * z2, zz = z * z2;
                        float wx = w * x2, wy = w * y2, wz = w * z2;
                        return mat3(
                            1.0 - (yy + zz), xy + wz, xz - wy,
                            xy - wz, 1.0 - (xx + zz), yz + wx,
                            xz + wy, yz - wx, 1.0 - (xx + yy)
                        );
                    }

                    mat3 modelViewRotation() {
                        return mat3(
                            normalize(modelViewMatrix[0].xyz),
                            normalize(modelViewMatrix[1].xyz),
                            normalize(modelViewMatrix[2].xyz)
                        );
                    }

                    mat3 outerProduct3(vec3 a, vec3 b) {
                        return mat3(
                            a.x * b.x, a.y * b.x, a.z * b.x,
                            a.x * b.y, a.y * b.y, a.z * b.y,
                            a.x * b.z, a.y * b.z, a.z * b.z
                        );
                    }

                    void main() {
                        vColor = instanceColor;
                        vOpacity = instanceOpacity;
                        vGaussian = quadPosition * 3.0;

                        vec4 mvPosition = modelViewMatrix * vec4(instancePosition, 1.0);
                        float sizeScale = max(size / ${DEFAULT_POINT_SIZE.toFixed(3)}, 0.001);
                        vec3 scale = max(instanceScale * sizeScale, vec3(0.00001));
                        mat3 rotation = modelViewRotation() * quatToMat3(instanceRotation);
                        vec3 axisX = rotation[0] * scale.x;
                        vec3 axisY = rotation[1] * scale.y;
                        vec3 axisZ = rotation[2] * scale.z;
                        mat3 cov = outerProduct3(axisX, axisX) + outerProduct3(axisY, axisY) + outerProduct3(axisZ, axisZ);

                        float focalX = projectionMatrix[0][0] * uViewport.x * 0.5;
                        float focalY = projectionMatrix[1][1] * uViewport.y * 0.5;
                        float depth = max(-mvPosition.z, 0.001);
                        vec3 j0;
                        vec3 j1;
                        if (uIsOrtho > 0.5) {
                            j0 = vec3(focalX, 0.0, 0.0);
                            j1 = vec3(0.0, focalY, 0.0);
                        } else {
                            j0 = vec3(focalX / depth, 0.0, focalX * mvPosition.x / (depth * depth));
                            j1 = vec3(0.0, focalY / depth, focalY * mvPosition.y / (depth * depth));
                        }

                        float a = dot(j0, cov * j0) + 0.35;
                        float b = dot(j0, cov * j1);
                        float c = dot(j1, cov * j1) + 0.35;
                        float mid = 0.5 * (a + c);
                        float radius = length(vec2(0.5 * (a - c), b));
                        float lambda1 = clamp(mid + radius, 0.01, 65536.0);
                        float lambda2 = clamp(mid - radius, 0.01, 65536.0);
                        vec2 axis1 = abs(b) > 0.00001 || abs(lambda1 - a) > 0.00001
                            ? normalize(vec2(b, lambda1 - a))
                            : vec2(1.0, 0.0);
                        vec2 axis2 = vec2(-axis1.y, axis1.x);
                        vec2 pixelOffset = 3.0 * (
                            axis1 * quadPosition.x * sqrt(lambda1) +
                            axis2 * quadPosition.y * sqrt(lambda2)
                        );

                        vec4 clip = projectionMatrix * mvPosition;
                        clip.xy += (pixelOffset / uViewport) * 2.0 * clip.w;
                        gl_Position = clip;
                        #include <clipping_planes_vertex>
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vOpacity;
                    varying vec2 vGaussian;
                    #include <clipping_planes_pars_fragment>
                    void main() {
                        #include <clipping_planes_fragment>
                        float r2 = dot(vGaussian, vGaussian);
                        if (r2 > 9.0) discard;
                        float alpha = exp(-0.5 * r2) * vOpacity;
                        if (alpha < 0.003) discard;
                        gl_FragColor = vec4(vColor, alpha);
                    }
                `,
                clipping: true,
                clippingPlanes: showFullPointCloud ? [] : [slabPlaneTop, slabPlaneBottom],
                transparent: true,
                depthTest: true,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
        };
        
        // --- SAMPLER UTILS ---
        function createSamplingGeometry(mesh, count) {
            const geom = mesh.geometry;
            const posAttr = geom.attributes.position;
            if (!posAttr || count <= 0) return new THREE.BufferGeometry();

            const uvAttr = geom.attributes.uv;
            const colorAttr = geom.attributes.color;
            const indexAttr = geom.index;
            const faces = Math.floor((indexAttr ? indexAttr.count : posAttr.count) / 3);
            if (faces <= 0) return new THREE.BufferGeometry();
            
            const areas = new Float32Array(faces);
            let totalArea = 0;
            const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
            const ab = new THREE.Vector3(), ac = new THREE.Vector3();
            const vertexIndex = (offset) => indexAttr ? indexAttr.getX(offset) : offset;
            
            for(let i=0; i<faces; i++) {
                const i3 = i*3;
                const a = vertexIndex(i3);
                const b = vertexIndex(i3+1);
                const c = vertexIndex(i3+2);
                
                va.fromBufferAttribute(posAttr, a);
                vb.fromBufferAttribute(posAttr, b);
                vc.fromBufferAttribute(posAttr, c);
                
                ab.subVectors(vb, va);
                ac.subVectors(vc, va);
                const area = ab.cross(ac).length() * 0.5;
                areas[i] = area;
                totalArea += area;
            }

            if (totalArea <= 0) return new THREE.BufferGeometry();

            const finalPos = new Float32Array(count * 3);
            const finalUV = uvAttr ? new Float32Array(count * 2) : null;
            const finalColor = colorAttr ? new Float32Array(count * 3) : null;
            
            const cdf = new Float32Array(faces);
            let acc = 0;
            for(let i=0; i<faces; i++) {
                acc += areas[i];
                cdf[i] = acc;
            }
            
            for(let i=0; i<count; i++) {
                const r = Math.random() * totalArea;
                let start = 0, end = faces - 1;
                let faceIdx = -1;
                while(start <= end) {
                    const mid = (start + end) >> 1;
                    if(r < cdf[mid]) {
                        faceIdx = mid;
                        end = mid - 1;
                    } else {
                        start = mid + 1;
                    }
                }
                if(faceIdx === -1) faceIdx = faces - 1; 
                
                const r1 = Math.random();
                const r2 = Math.random();
                const sqrtR1 = Math.sqrt(r1);
                const u = 1 - sqrtR1;
                const v = sqrtR1 * (1 - r2);
                const w = sqrtR1 * r2;
                
                const i3 = faceIdx * 3;
                const ia = vertexIndex(i3);
                const ib = vertexIndex(i3+1);
                const ic = vertexIndex(i3+2);
                
                finalPos[i*3] = posAttr.getX(ia)*u + posAttr.getX(ib)*v + posAttr.getX(ic)*w;
                finalPos[i*3+1] = posAttr.getY(ia)*u + posAttr.getY(ib)*v + posAttr.getY(ic)*w;
                finalPos[i*3+2] = posAttr.getZ(ia)*u + posAttr.getZ(ib)*v + posAttr.getZ(ic)*w;
                
                if(uvAttr) {
                    finalUV[i*2] = uvAttr.getX(ia)*u + uvAttr.getX(ib)*v + uvAttr.getX(ic)*w;
                    finalUV[i*2+1] = uvAttr.getY(ia)*u + uvAttr.getY(ib)*v + uvAttr.getY(ic)*w;
                }

                if(colorAttr) {
                    finalColor[i*3] = colorAttr.getX(ia)*u + colorAttr.getX(ib)*v + colorAttr.getX(ic)*w;
                    finalColor[i*3+1] = colorAttr.getY(ia)*u + colorAttr.getY(ib)*v + colorAttr.getY(ic)*w;
                    finalColor[i*3+2] = colorAttr.getZ(ia)*u + colorAttr.getZ(ib)*v + colorAttr.getZ(ic)*w;
                }
            }
            
            const bufferGeo = new THREE.BufferGeometry();
            bufferGeo.setAttribute('position', new THREE.BufferAttribute(finalPos, 3));
            if(uvAttr) bufferGeo.setAttribute('uv', new THREE.BufferAttribute(finalUV, 2));
            if(colorAttr) bufferGeo.setAttribute('color', new THREE.BufferAttribute(finalColor, 3));
            
            return bufferGeo;
        }

        function createSplatGeometry(buffer) {
            const bytesPerSplat = 32;
            const count = Math.floor(buffer.byteLength / bytesPerSplat);
            if (count <= 0) return new THREE.BufferGeometry();

            const view = new DataView(buffer);
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const scales = new Float32Array(count * 3);
            const rotations = new Float32Array(count * 4);

            for (let i = 0; i < count; i++) {
                const offset = i * bytesPerSplat;
                positions[i * 3] = view.getFloat32(offset, true);
                positions[i * 3 + 1] = view.getFloat32(offset + 4, true);
                positions[i * 3 + 2] = view.getFloat32(offset + 8, true);

                const sx = Math.abs(view.getFloat32(offset + 12, true));
                const sy = Math.abs(view.getFloat32(offset + 16, true));
                const sz = Math.abs(view.getFloat32(offset + 20, true));
                scales[i * 3] = sx;
                scales[i * 3 + 1] = sy;
                scales[i * 3 + 2] = sz;
                sizes[i] = Math.max(sx, sy, sz, 0.0001);

                colors[i * 3] = view.getUint8(offset + 24) / 255;
                colors[i * 3 + 1] = view.getUint8(offset + 25) / 255;
                colors[i * 3 + 2] = view.getUint8(offset + 26) / 255;
                opacities[i] = view.getUint8(offset + 27) / 255;
                decodeByteQuaternion(view, offset + 28, rotations, i);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = true;
            return geometry;
        }

        function findPlyHeaderEnd(bytes) {
            const marker = [101, 110, 100, 95, 104, 101, 97, 100, 101, 114];
            for (let i = 0; i <= bytes.length - marker.length; i++) {
                let found = true;
                for (let j = 0; j < marker.length; j++) {
                    if (bytes[i + j] !== marker[j]) {
                        found = false;
                        break;
                    }
                }
                if (found) {
                    let end = i + marker.length;
                    if (bytes[end] === 13) end++;
                    if (bytes[end] === 10) end++;
                    return end;
                }
            }
            return -1;
        }

        function plyPropertyReader(type) {
            const readers = {
                char: { size: 1, read: (view, offset) => view.getInt8(offset) },
                int8: { size: 1, read: (view, offset) => view.getInt8(offset) },
                uchar: { size: 1, read: (view, offset) => view.getUint8(offset) },
                uint8: { size: 1, read: (view, offset) => view.getUint8(offset) },
                short: { size: 2, read: (view, offset, little) => view.getInt16(offset, little) },
                int16: { size: 2, read: (view, offset, little) => view.getInt16(offset, little) },
                ushort: { size: 2, read: (view, offset, little) => view.getUint16(offset, little) },
                uint16: { size: 2, read: (view, offset, little) => view.getUint16(offset, little) },
                int: { size: 4, read: (view, offset, little) => view.getInt32(offset, little) },
                int32: { size: 4, read: (view, offset, little) => view.getInt32(offset, little) },
                uint: { size: 4, read: (view, offset, little) => view.getUint32(offset, little) },
                uint32: { size: 4, read: (view, offset, little) => view.getUint32(offset, little) },
                float: { size: 4, read: (view, offset, little) => view.getFloat32(offset, little) },
                float32: { size: 4, read: (view, offset, little) => view.getFloat32(offset, little) },
                double: { size: 8, read: (view, offset, little) => view.getFloat64(offset, little) },
                float64: { size: 8, read: (view, offset, little) => view.getFloat64(offset, little) }
            };
            return readers[type.toLowerCase()] || null;
        }

        function parsePlyHeader(buffer) {
            const bytes = new Uint8Array(buffer);
            const headerEnd = findPlyHeaderEnd(bytes);
            if (headerEnd < 0) return null;

            const header = new TextDecoder().decode(bytes.subarray(0, headerEnd));
            const lines = header.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            let format = 'ascii';
            let vertexCount = 0;
            let inVertex = false;
            const vertexProperties = [];

            lines.forEach((line) => {
                const parts = line.split(/\s+/);
                if (parts[0] === 'format') format = parts[1];
                if (parts[0] === 'element') {
                    inVertex = parts[1] === 'vertex';
                    if (inVertex) vertexCount = finiteInteger(parts[2], 0);
                    return;
                }
                if (inVertex && parts[0] === 'property' && parts[1] !== 'list') {
                    vertexProperties.push({ type: parts[1], name: parts[2] });
                }
            });

            return { format, headerEnd, vertexCount, vertexProperties };
        }

        function createGaussianPlyGeometry(buffer) {
            const header = parsePlyHeader(buffer);
            if (!header || header.vertexCount <= 0) return null;

            const names = header.vertexProperties.map(prop => prop.name);
            const hasPosition = ['x', 'y', 'z'].every(name => names.includes(name));
            const hasFdcColor = ['f_dc_0', 'f_dc_1', 'f_dc_2'].every(name => names.includes(name));
            const hasRgbColor = ['red', 'green', 'blue'].every(name => names.includes(name));
            const hasScale = ['scale_0', 'scale_1', 'scale_2'].every(name => names.includes(name));
            const hasRotation = ['rot_0', 'rot_1', 'rot_2', 'rot_3'].every(name => names.includes(name));
            const hasGaussianProps = hasFdcColor || names.includes('opacity') || names.includes('scale_0') || names.includes('rot_0');
            if (!hasPosition || (!hasGaussianProps && !hasRgbColor)) return null;

            const positions = new Float32Array(header.vertexCount * 3);
            const colors = new Float32Array(header.vertexCount * 3);
            const sizes = new Float32Array(header.vertexCount);
            const opacities = new Float32Array(header.vertexCount);
            const scales = new Float32Array(header.vertexCount * 3);
            const rotations = new Float32Array(header.vertexCount * 4);
            const propIndex = (name) => names.indexOf(name);
            const xIndex = propIndex('x');
            const yIndex = propIndex('y');
            const zIndex = propIndex('z');
            const s0Index = propIndex('scale_0');
            const s1Index = propIndex('scale_1');
            const s2Index = propIndex('scale_2');
            const r0Index = propIndex('rot_0');
            const r1Index = propIndex('rot_1');
            const r2Index = propIndex('rot_2');
            const r3Index = propIndex('rot_3');
            const f0Index = propIndex('f_dc_0');
            const f1Index = propIndex('f_dc_1');
            const f2Index = propIndex('f_dc_2');
            const redIndex = propIndex('red');
            const greenIndex = propIndex('green');
            const blueIndex = propIndex('blue');
            const opacityIndex = propIndex('opacity');
            const shC0 = 0.28209479177387814;

            const writeVertex = (i, values) => {
                positions[i * 3] = values[xIndex];
                positions[i * 3 + 1] = values[yIndex];
                positions[i * 3 + 2] = values[zIndex];

                const opacity = opacityIndex >= 0 ? sigmoid(values[opacityIndex]) : 1;
                opacities[i] = opacity;
                if (hasScale) {
                    const sx = Math.exp(values[s0Index]);
                    const sy = Math.exp(values[s1Index]);
                    const sz = Math.exp(values[s2Index]);
                    scales[i * 3] = sx;
                    scales[i * 3 + 1] = sy;
                    scales[i * 3 + 2] = sz;
                    sizes[i] = Math.max(sx, sy, sz, 0.0001);
                } else {
                    scales[i * 3] = 0.01;
                    scales[i * 3 + 1] = 0.01;
                    scales[i * 3 + 2] = 0.01;
                    sizes[i] = 0.01;
                }

                if (hasRotation) {
                    writeNormalizedQuaternion(rotations, i, values[r1Index], values[r2Index], values[r3Index], values[r0Index]);
                } else {
                    writeNormalizedQuaternion(rotations, i, 0, 0, 0, 1);
                }

                if (hasFdcColor) {
                    colors[i * 3] = clamp(0.5 + shC0 * values[f0Index], 0, 1);
                    colors[i * 3 + 1] = clamp(0.5 + shC0 * values[f1Index], 0, 1);
                    colors[i * 3 + 2] = clamp(0.5 + shC0 * values[f2Index], 0, 1);
                } else {
                    colors[i * 3] = clamp(values[redIndex] / 255, 0, 1);
                    colors[i * 3 + 1] = clamp(values[greenIndex] / 255, 0, 1);
                    colors[i * 3 + 2] = clamp(values[blueIndex] / 255, 0, 1);
                }
            };

            if (header.format === 'ascii') {
                const body = new TextDecoder().decode(new Uint8Array(buffer, header.headerEnd));
                const rows = body.split(/\r?\n/).filter(Boolean);
                for (let i = 0; i < header.vertexCount && i < rows.length; i++) {
                    writeVertex(i, rows[i].trim().split(/\s+/).map(Number));
                }
            } else if (header.format === 'binary_little_endian' || header.format === 'binary_big_endian') {
                const little = header.format === 'binary_little_endian';
                const propReaders = header.vertexProperties.map(prop => plyPropertyReader(prop.type));
                if (propReaders.some(reader => !reader)) return null;

                const stride = propReaders.reduce((sum, reader) => sum + reader.size, 0);
                const view = new DataView(buffer, header.headerEnd);
                const values = new Array(propReaders.length);
                for (let i = 0; i < header.vertexCount; i++) {
                    let offset = i * stride;
                    for (let j = 0; j < propReaders.length; j++) {
                        const reader = propReaders[j];
                        values[j] = reader.read(view, offset, little);
                        offset += reader.size;
                    }
                    writeVertex(i, values);
                }
            } else {
                return null;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = hasGaussianProps;
            return geometry;
        }

        function normalizeZipPath(path) {
            return String(path || '').replace(/\\/g, '/').replace(/^\/+/, '');
        }

        function findSogMetaFile(zip) {
            const rootMeta = zip.file('meta.json');
            if (rootMeta) return { file: rootMeta, basePath: '' };

            const metaPath = Object.keys(zip.files).find(name => {
                const entry = zip.files[name];
                return !entry.dir && normalizeZipPath(name).toLowerCase().endsWith('/meta.json');
            });
            if (!metaPath) throw new Error('SOG archive is missing meta.json.');

            return {
                file: zip.files[metaPath],
                basePath: normalizeZipPath(metaPath).replace(/\/?meta\.json$/i, '')
            };
        }

        function findSogZipFile(zip, basePath, fileName) {
            const relativePath = normalizeZipPath(fileName);
            const candidates = [
                normalizeZipPath(basePath ? `${basePath}/${relativePath}` : relativePath),
                relativePath
            ].filter(Boolean);

            for (const candidate of candidates) {
                const file = zip.file(candidate);
                if (file) return { file, name: candidate };
            }

            const lowerPath = relativePath.toLowerCase();
            const match = Object.keys(zip.files).find(name => {
                const entry = zip.files[name];
                const normalized = normalizeZipPath(name).toLowerCase();
                return !entry.dir && (normalized === lowerPath || normalized.endsWith(`/${lowerPath}`));
            });
            if (match) return { file: zip.files[match], name: match };

            throw new Error(`SOG archive is missing ${fileName}.`);
        }

        function guessImageMimeType(fileName) {
            const extension = getImportExtension('', fileName);
            if (extension === 'png') return 'image/png';
            if (extension === 'jpg' || extension === 'jpeg') return 'image/jpeg';
            return 'image/webp';
        }

        async function loadImageElement(blob) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const url = URL.createObjectURL(blob);
                image.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(image);
                };
                image.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Could not decode SOG image.'));
                };
                image.src = url;
            });
        }

        async function decodeImageData(blob) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) throw new Error('Could not create SOG image decoder.');

            let bitmap = null;
            let source = null;
            try {
                if (window.createImageBitmap) {
                    try {
                        bitmap = await createImageBitmap(blob, { colorSpaceConversion: 'none' });
                    } catch (error) {
                        bitmap = await createImageBitmap(blob);
                    }
                    source = bitmap;
                } else {
                    source = await loadImageElement(blob);
                }
            } catch (error) {
                source = await loadImageElement(blob);
            }

            canvas.width = source.width;
            canvas.height = source.height;
            ctx.drawImage(source, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (bitmap && bitmap.close) bitmap.close();
            return imageData;
        }

        async function decodeSogImage(zip, basePath, fileName) {
            const entry = findSogZipFile(zip, basePath, fileName);
            const imageBuffer = await entry.file.async('arraybuffer');
            const blob = new Blob([imageBuffer], { type: guessImageMimeType(entry.name) });
            return decodeImageData(blob);
        }

        function requireArray(value, length, label) {
            if (!Array.isArray(value) || value.length < length) {
                throw new Error(`SOG ${label} is missing or incomplete.`);
            }
            return value;
        }

        function unlogSogPosition(value) {
            return Math.sign(value) * (Math.exp(Math.abs(value)) - 1);
        }

        function decodeSogQuaternion(data, offset, target, index) {
            const toComponent = (value) => (value / 255 - 0.5) * 2.0 / Math.SQRT2;
            const a = toComponent(data[offset]);
            const b = toComponent(data[offset + 1]);
            const c = toComponent(data[offset + 2]);
            const mode = data[offset + 3] - 252;
            const d = Math.sqrt(Math.max(0, 1 - a * a - b * b - c * c));

            if (mode === 0) writeNormalizedQuaternion(target, index, d, a, b, c);
            else if (mode === 1) writeNormalizedQuaternion(target, index, a, d, b, c);
            else if (mode === 2) writeNormalizedQuaternion(target, index, a, b, d, c);
            else if (mode === 3) writeNormalizedQuaternion(target, index, a, b, c, d);
            else writeNormalizedQuaternion(target, index, 0, 0, 0, 1);
        }

        async function createSogGeometry(buffer) {
            const JSZip = await loadJSZip();
            const zip = await JSZip.loadAsync(buffer);
            const { file: metaFile, basePath } = findSogMetaFile(zip);
            const meta = JSON.parse(await metaFile.async('string'));
            if (meta.version !== 2) {
                throw new Error(`Unsupported SOG version ${meta.version || 'unknown'}.`);
            }

            const meansFiles = requireArray(meta.means?.files, 2, 'means files');
            const scalesFiles = requireArray(meta.scales?.files, 1, 'scales files');
            const quatsFiles = requireArray(meta.quats?.files, 1, 'quats files');
            const sh0Files = requireArray(meta.sh0?.files, 1, 'sh0 files');
            const meansMins = requireArray(meta.means?.mins, 3, 'means mins');
            const meansMaxs = requireArray(meta.means?.maxs, 3, 'means maxs');
            const scalesCodebook = requireArray(meta.scales?.codebook, 256, 'scales codebook');
            const sh0Codebook = requireArray(meta.sh0?.codebook, 256, 'sh0 codebook');

            const [meansL, meansU, scalesImage, quatsImage, sh0Image] = await Promise.all([
                decodeSogImage(zip, basePath, meansFiles[0]),
                decodeSogImage(zip, basePath, meansFiles[1]),
                decodeSogImage(zip, basePath, scalesFiles[0]),
                decodeSogImage(zip, basePath, quatsFiles[0]),
                decodeSogImage(zip, basePath, sh0Files[0])
            ]);

            const capacity = Math.min(
                meansL.width * meansL.height,
                meansU.width * meansU.height,
                scalesImage.width * scalesImage.height,
                quatsImage.width * quatsImage.height,
                sh0Image.width * sh0Image.height
            );
            const count = finiteInteger(meta.count, capacity);
            if (count <= 0) throw new Error('SOG contains no splats.');
            if (count > capacity) throw new Error('SOG count exceeds image capacity.');

            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const scales = new Float32Array(count * 3);
            const rotations = new Float32Array(count * 4);
            const shC0 = 0.28209479177387814;
            const meansLData = meansL.data;
            const meansUData = meansU.data;
            const scalesData = scalesImage.data;
            const quatsData = quatsImage.data;
            const sh0Data = sh0Image.data;

            for (let i = 0; i < count; i++) {
                const p = i * 4;
                const qx = (meansUData[p] << 8) | meansLData[p];
                const qy = (meansUData[p + 1] << 8) | meansLData[p + 1];
                const qz = (meansUData[p + 2] << 8) | meansLData[p + 2];
                const nx = lerp(meansMins[0], meansMaxs[0], qx / 65535);
                const ny = lerp(meansMins[1], meansMaxs[1], qy / 65535);
                const nz = lerp(meansMins[2], meansMaxs[2], qz / 65535);

                positions[i * 3] = unlogSogPosition(nx);
                positions[i * 3 + 1] = unlogSogPosition(ny);
                positions[i * 3 + 2] = unlogSogPosition(nz);

                const sx = Math.abs(scalesCodebook[scalesData[p]] ?? 0);
                const sy = Math.abs(scalesCodebook[scalesData[p + 1]] ?? 0);
                const sz = Math.abs(scalesCodebook[scalesData[p + 2]] ?? 0);
                scales[i * 3] = sx;
                scales[i * 3 + 1] = sy;
                scales[i * 3 + 2] = sz;
                sizes[i] = Math.max(sx, sy, sz, 0.0001);
                decodeSogQuaternion(quatsData, p, rotations, i);

                colors[i * 3] = clamp(0.5 + (sh0Codebook[sh0Data[p]] ?? 0) * shC0, 0, 1);
                colors[i * 3 + 1] = clamp(0.5 + (sh0Codebook[sh0Data[p + 1]] ?? 0) * shC0, 0, 1);
                colors[i * 3 + 2] = clamp(0.5 + (sh0Codebook[sh0Data[p + 2]] ?? 0) * shC0, 0, 1);
                opacities[i] = sh0Data[p + 3] / 255;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('splatSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('splatScale', new THREE.BufferAttribute(scales, 3));
            geometry.setAttribute('splatRotation', new THREE.BufferAttribute(rotations, 4));
            geometry.userData.isGaussianSplat = true;
            geometry.userData.sourceFormat = 'sog';
            return geometry;
        }

        function canUsePreviewIndex(count) {
            if (count <= 65535) return true;
            return !!(
                renderer &&
                (
                    renderer.capabilities?.isWebGL2 ||
                    renderer.extensions?.get?.('OES_element_index_uint')
                )
            );
        }

        function createPreviewIndexAttribute(count) {
            const IndexArray = count > 65535 ? Uint32Array : Uint16Array;
            const indices = new IndexArray(count);
            let stride = Math.max(1, Math.floor(count * 0.618033988749895));
            if (stride % 2 === 0) stride++;
            while (greatestCommonDivisor(stride, count) !== 1) {
                stride += 2;
                if (stride >= count) stride = (stride % count) || 1;
            }

            let value = 0;
            for (let i = 0; i < count; i++) {
                indices[i] = value;
                value = (value + stride) % count;
            }

            return new THREE.BufferAttribute(indices, 1);
        }

        function preparePreviewDensityGeometry(geometry) {
            const position = geometry.attributes.position;
            if (!position) return 0;

            const count = position.count;
            if (!geometry.userData.previewIndexReady && count > 1 && canUsePreviewIndex(count)) {
                geometry.setIndex(createPreviewIndexAttribute(count));
                geometry.userData.previewIndexReady = true;
            }

            geometry.userData.previewCount = geometry.index ? geometry.index.count : count;
            geometry.setDrawRange(0, Math.max(1, Math.floor(geometry.userData.previewCount * pointDrawFraction)));
            return geometry.userData.previewCount;
        }

        function createBufferGeometryLoader(parseGeometry) {
            return {
                load: (url, onLoad, onProgress, onError) => {
                    fetch(url)
                        .then((response) => {
                            if (!response.ok) throw new Error(`Could not load ${url}`);
                            return response.arrayBuffer();
                        })
                        .then((buffer) => Promise.resolve(parseGeometry(buffer)))
                        .then((geometry) => onLoad(geometry))
                        .catch((error) => {
                            if (onError) onError(error);
                            else throw error;
                        });
                }
            };
        }

        function createPlyLoader() {
            const fallbackLoader = new THREE.PLYLoader();
            return createBufferGeometryLoader((buffer) => {
                if (getImportMode() !== 'mesh') {
                    const gaussianGeometry = createGaussianPlyGeometry(buffer);
                    if (gaussianGeometry) return gaussianGeometry;
                }
